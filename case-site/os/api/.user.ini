; CASE OS — лимиты загрузки для бэкенда (PHP-FPM / FastCGI хостинг).
; Позволяет сохранять состояние с чертежами/презентациями/геоданными до ~30 МБ.
; json_body_limit_bytes() в lib.php = 40 МБ; здесь поднимаем PHP до 48 МБ.
; Если хостинг использует mod_php, действуют директивы из api/.htaccess.
post_max_size = 48M
upload_max_filesize = 48M
memory_limit = 256M
max_input_time = 120
