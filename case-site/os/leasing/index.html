<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASE OS · Leasing &amp; Sales Platform</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%239E0000'/%3E%3Ctext x='8' y='12' font-size='10' font-family='sans-serif' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================================
   CASE OS · Leasing & Sales Platform (LSP) — prototype stylesheet.
   Tokens first: nothing below hard-codes a status colour. Status, category and
   stage colours come from CONFIG and are written into inline styles by the
   renderers, so Settings can change them without touching CSS.
   ========================================================================= */
:root{
  --red:#9E0000; --red-d:#7a0000; --red-l:#c62828;
  --bg:#f4f3f1; --panel:#fff; --card:#fff; --ink:#1b1b1b; --muted:#6b6b6b;
  --soft:#faf9f7; --border:#e6e3df; --shadow:0 1px 2px rgba(0,0,0,.05);
  --green:#2e7d32; --amber:#a16000; --blue:#1565c0; --teal:#0d8484; --purple:#6a3fb5;
  --r:10px; --r-sm:6px;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#15140f; --panel:#201e1a; --card:#201e1a; --ink:#ededed; --muted:#9a958e;
  --soft:#28261f; --border:#36332c; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.2px}
h2{font-size:15px;margin:0 0 8px;font-weight:700}
h3{font-size:13px;margin:0 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
p{margin:0 0 8px}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

/* ---- prototype banner ---------------------------------------------------- */
.protobar{background:#3a2f00;color:#ffe9a8;font-size:11.5px;padding:5px 12px;text-align:center;letter-spacing:.2px}
.protobar b{color:#fff}

/* ---- login --------------------------------------------------------------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:
  linear-gradient(135deg,var(--bg) 0%,var(--soft) 100%)}
.loginbox{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08);
  width:100%;max-width:420px;padding:26px}
.loginbox .brand{font-size:12px;letter-spacing:2.6px;color:var(--red);font-weight:700;margin-bottom:2px}
.loginbox h1{margin-bottom:4px}
.loginbox .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.userlist{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}
.userbtn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--soft);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:8px 10px;cursor:pointer;font:inherit;color:inherit;width:100%}
.userbtn:hover{border-color:var(--red);background:var(--card)}
.userbtn.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(158,0,0,.12)}
.userbtn .nm{font-weight:600;font-size:12.5px}
.userbtn .rl{font-size:11px;color:var(--muted)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:11.5px;font-weight:700;flex:0 0 auto}
.avatar.client{background:var(--teal)}

/* ---- app frame ----------------------------------------------------------- */
#app{display:none;min-height:100vh;flex-direction:column}
header.top{background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  padding:7px 12px;position:sticky;top:0;z-index:40;flex-wrap:wrap}
.logo{font-size:11px;letter-spacing:2.2px;font-weight:700;color:var(--red);white-space:nowrap}
.logo small{display:block;letter-spacing:.3px;font-size:9.5px;color:var(--muted);font-weight:600}
.spacer{flex:1}
.wrap{display:flex;flex:1;min-height:0}
nav.side{width:194px;background:var(--panel);border-right:1px solid var(--border);padding:8px 6px 20px;overflow-y:auto;flex:0 0 auto}
nav.side .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:10px 8px 3px;font-weight:700}
nav.side button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r-sm);
  padding:6px 8px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
nav.side button:hover{background:var(--soft)}
nav.side button.on{background:var(--red);color:#fff;font-weight:600}
nav.side button .ic{width:16px;text-align:center;flex:0 0 auto;font-size:12px}
nav.side button .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;font-weight:700}
nav.side button.on .badge{background:#fff;color:var(--red)}
main{flex:1;min-width:0;padding:14px;overflow-x:hidden}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12px;margin:0 0 12px}

/* ---- controls ------------------------------------------------------------ */
.btn{background:var(--red);color:#fff;border:1px solid var(--red);border-radius:var(--r-sm);padding:5px 11px;font:inherit;
  font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--border);font-weight:500}
.btn.ghost:hover{background:var(--soft);border-color:var(--muted)}
.btn.sm{padding:3px 8px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--card);color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
label.f{display:block;margin-bottom:8px}
label.f > span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
label.f input,label.f select,label.f textarea{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row > *{min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px}
.tabs button{background:none;border:1px solid transparent;border-radius:var(--r-sm);padding:4px 10px;font:inherit;font-size:12px;
  cursor:pointer;color:var(--muted)}
.tabs button:hover{background:var(--soft);color:var(--ink)}
.tabs button.on{background:var(--soft);border-color:var(--border);color:var(--ink);font-weight:600}

/* ---- cards / tables ------------------------------------------------------ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
.grid{display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;box-shadow:var(--shadow)}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.kpi .v.na{color:var(--muted);font-size:15px;font-weight:600}
.kpi .d{font-size:10.5px;color:var(--muted);margin-top:2px}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;
  padding:5px 7px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1}
td{padding:5px 7px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:var(--soft)}
tr.click{cursor:pointer}
.tw{overflow-x:auto;max-width:100%}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
.empty{color:var(--muted);font-size:12px;padding:14px;text-align:center}

/* ---- chips / badges ------------------------------------------------------ */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600;
  border:1px solid transparent;white-space:nowrap;line-height:1.6}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--muted)}
.sev{font-weight:700}
.sev.red{color:var(--red-l)} .sev.amber{color:var(--amber)} .sev.green{color:var(--green)}
.banner{border-radius:var(--r-sm);padding:7px 10px;font-size:12px;margin-bottom:10px;border:1px solid}
.banner.warn{background:#fff8e6;border-color:#e8d08a;color:#6b4e00}
.banner.ok{background:#eaf6ec;border-color:#a9d4b0;color:#1d5426}
.banner.info{background:#eef4fb;border-color:#a8c4e4;color:#12457e}
:root[data-theme="dark"] .banner.warn{background:#3a2f00;border-color:#6b5a1a;color:#ffe9a8}
:root[data-theme="dark"] .banner.ok{background:#12301a;border-color:#2c5c37;color:#b6e6c0}
:root[data-theme="dark"] .banner.info{background:#0f2a45;border-color:#28517e;color:#bcd9f7}
/* provenance marks (D16): icon + frame + word, never colour alone */
.prov{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:0 4px;border-radius:3px;white-space:nowrap;
  border:1px solid var(--muted);color:var(--muted);cursor:help}
.prov.verified{border-style:solid;background:rgba(46,125,50,.12);border-color:var(--green);color:var(--green)}
.prov.asking{border-style:solid;background:none;border-color:var(--amber);color:var(--amber)}
.prov.modelled{border-style:dashed;border-color:var(--blue);color:var(--blue)}
.prov.none{border-style:dotted}
.prov.stale{box-shadow:inset 0 -2px 0 var(--amber)}
.prov.old{box-shadow:inset 0 -2px 0 var(--red-l)}

/* ---- drawer / modal ------------------------------------------------------ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:60;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--border);
  z-index:70;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.drawer .body{padding:13px;overflow-y:auto;flex:1}
.drawer .sec{margin-bottom:14px}
.x{background:none;border:0;font-size:19px;line-height:1;cursor:pointer;color:var(--muted);padding:0 3px}
.x:hover{color:var(--ink)}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);width:min(640px,100%);
  max-height:86vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal .box header{padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.modal .box .body{padding:13px;overflow-y:auto}
.modal .box footer{padding:10px 13px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#222;color:#fff;padding:7px 14px;border-radius:18px;font-size:12px;box-shadow:0 3px 12px rgba(0,0,0,.3)}

/* ---- timeline / list ----------------------------------------------------- */
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--border);margin-left:5px}
.tl li{position:relative;padding:0 0 10px 13px}
.tl li::before{content:'';position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--border)}
.tl li.hi::before{background:var(--red)}
.tl .w{font-size:10.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:5px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start}
.list li:last-child{border-bottom:0}

/* ---- floor plan ---------------------------------------------------------- */
.planwrap{background:var(--soft);border:1px dashed var(--border);border-radius:12px;padding:8px;overflow:hidden;position:relative}
#planview{transform-origin:0 0;transition:transform .05s linear}
#planview.grabbing{cursor:grabbing}
.planzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:5}
.planzoom button{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);
  cursor:pointer;font-size:14px;line-height:1;color:var(--ink)}
.planzoom button:hover{border-color:var(--red)}
svg .unit{cursor:pointer;transition:filter .1s}
svg .unit:hover{filter:brightness(.9)}
svg .unit.sel{stroke:#111;stroke-width:3}
:root[data-theme="dark"] svg .unit.sel{stroke:#fff}
svg .ulab{pointer-events:none;font-family:var(--font);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:5px 10px;margin:8px 0 6px;font-size:11px;align-items:center}
.legend .li{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:0 0 auto}
.planinfo{font-size:11px;color:var(--muted);margin-top:7px}

/* ---- kanban -------------------------------------------------------------- */
.kan{display:flex;gap:9px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.kancol{flex:0 0 218px;background:var(--soft);border:1px solid var(--border);border-radius:var(--r);padding:7px}
.kancol h4{margin:0 0 6px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:center}
.kancol h4 span{color:var(--muted);font-weight:600;font-size:10.5px}
.kancard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 8px;margin-bottom:6px;
  cursor:pointer;font-size:12px}
.kancard:hover{border-color:var(--red)}
.kancard .t{font-weight:600;margin-bottom:2px}
.kancard .m{font-size:10.5px;color:var(--muted)}
.kancard.drag{opacity:.45}
.kancol.over{outline:2px dashed var(--red);outline-offset:-3px}

/* ---- bars ---------------------------------------------------------------- */
.bar{height:9px;border-radius:5px;background:var(--border);overflow:hidden;display:flex;min-width:60px}
.bar > i{display:block;height:100%}
.mixrow{display:grid;grid-template-columns:132px 1fr 116px;gap:8px;align-items:center;margin-bottom:5px;font-size:12px}
.mixrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dual{display:flex;flex-direction:column;gap:2px}
.dual .bar{height:7px}

/* ---- responsive ---------------------------------------------------------- */
.menutoggle{display:none}
@media(max-width:900px){
  .menutoggle{display:inline-block}
  nav.side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .18s ease;
    box-shadow:2px 0 14px rgba(0,0,0,.18);width:210px}
  nav.side.on{transform:none}
  main{padding:10px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .mixrow{grid-template-columns:100px 1fr;}
  .mixrow .val{grid-column:2;text-align:right}
}
@media(max-width:620px){
  .kpi .v{font-size:17px}
  .drawer{width:100%}
  .hide-s{display:none}
}

/* ---- print --------------------------------------------------------------- */
@media print{
  body{background:#fff;color:#000;font-size:11px}
  header.top,nav.side,.protobar,.planzoom,.noprint,#toasts,.tabs{display:none!important}
  main{padding:0}
  .card{border:1px solid #ccc;box-shadow:none;break-inside:avoid;page-break-inside:avoid;margin-bottom:8px}
  .kpi{border:1px solid #ccc}
  .kpis{grid-template-columns:repeat(4,1fr)}
  table{font-size:10px}
  th{background:#f2f2f2!important;color:#000;position:static}
  a{color:#000;text-decoration:none}
  .tw{overflow:visible}
  .printonly{display:block!important}
  svg{max-width:100%;height:auto}
  @page{margin:12mm}
}
.printonly{display:none}
</style>
</head>
<body>
<div class="protobar" id="protobar">
  <b data-i18n="Prototype authentication only. This does not provide production security."></b>
  &nbsp;·&nbsp; <span data-i18n="Demo data, stored in this browser only. Not a CASE Advisory client record."></span>
</div>

<!-- ======================= LOGIN ======================= -->
<div id="login">
  <form class="loginbox" id="loginform" autocomplete="off">
    <div class="brand">CASE OS</div>
    <h1>Leasing &amp; Sales Platform</h1>
    <div class="sub"><span data-i18n="Validation prototype"></span> <span id="vtag"></span> <span data-i18n="· choose a demo user and press Enter"></span></div>
    <div class="userlist" id="userlist"></div>
    <label class="f"><span data-i18n="Demo code (any value; not a password)"></span>
      <input id="logincode" type="text" value="demo" autocomplete="off"></label>
    <div class="row" style="margin-top:10px">
      <button class="btn" type="submit" style="flex:1" data-i18n="Enter"></button>
      <button class="btn ghost" type="button" id="btnResetDemo" data-i18n="Reset demo data"></button>
    </div>
    <div class="banner warn" style="margin:12px 0 0">
      <span data-i18n="No passwords are checked and no data leaves this browser. Production access control, secure file storage and server-side authorisation are out of scope for this prototype."></span>
    </div>
  </form>
</div>

<!-- ======================= APP ======================= -->
<div id="app">
  <header class="top">
    <button class="btn ghost sm menutoggle" id="btnMenu" aria-label="Menu">☰</button>
    <div class="logo">CASE OS<small>Leasing &amp; Sales</small></div>
    <select id="projPick" data-i18n-title="Project scope" aria-label="Project"></select>
    <input id="globalSearch" type="search" data-i18n-placeholder="Search projects, units, brands, deals…" style="width:min(300px,42vw)" aria-label="Global search">
    <span class="spacer"></span>
    <span id="saveState" class="tag" data-i18n-title="Local save status">Saved</span>
    <button class="btn ghost sm" id="btnLang" title="Interface language">EN</button>
    <button class="btn ghost sm" id="btnTheme" data-i18n-title="Light / dark">◐</button>
    <span id="whoami" class="tag"></span>
    <button class="btn ghost sm" id="btnLogout" data-i18n="Log out"></button>
  </header>
  <div class="wrap">
    <nav class="side" id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalbox"></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* ============================================================================
   CASE OS · Leasing & Sales Platform (LSP) — validation prototype.

   Read docs/leasing-platform/ for the architecture this implements. The three
   rules that shape the whole file:

   1. Unit status is INVENTORY state only. Deal stage lives on deals. What the
      plan shows is DERIVED from both (see svcDisplayStatus). Storing a stage on
      a unit is what makes a registry and a CRM drift apart.
   2. A unit's area is counted ONCE in inventory metrics, whatever the number of
      prospects. Pipeline metrics are deal-centric and say so on screen.
   3. Unknown is not zero. A missing area is excluded from sums and reported as
      a count, never silently treated as 0 m².
   ========================================================================= */
var LSP_VERSION = '0.1.0';
var SCHEMA_VERSION = 1;
var K_STATE = 'caseos-lsp-state-v1', K_BACKUP = 'caseos-lsp-backup-v1',
    K_SESSION = 'caseos-lsp-session', K_UI = 'caseos-lsp-ui';

/* ---------------------------------------------------------------- helpers */
function $(id){return document.getElementById(id);}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isFinite(n)?n:null;}
function n0(v){var n=parseFloat(v);return isFinite(n)?n:0;}
function fmt(n,d){if(n==null||!isFinite(n))return 'n/a';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d==null?0:d});}
function money(n,cur){if(n==null||!isFinite(n))return 'n/a';
  return (cur||'USD')+' '+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});}
function pct(a,b){if(!b||!isFinite(b)||b<=0||a==null)return null;return a/b*100;}
function fpct(a,b,d){var p=pct(a,b);return p==null?'n/a':fmt(p,d==null?1:d)+'%';}
function cents(v){return Math.round((Number(v)||0)*100)/100;}
function today(){return new Date().toISOString().slice(0,10);}
function nowISO(){return new Date().toISOString();}
function daysBetween(a,b){if(!a||!b)return null;
  return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function daysAgo(d){return d?daysBetween(d,today()):null;}
function arr(x){return Array.isArray(x)?x:[];}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i;});}
function sum(a){return a.reduce(function(s,v){return s+n0(v);},0);}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null;}
function sortBy(a,f,dir){return a.slice().sort(function(x,y){
  var vx=f(x),vy=f(y); if(vx==null&&vy==null)return 0; if(vx==null)return 1; if(vy==null)return -1;
  return (vx>vy?1:vx<vy?-1:0)*(dir===-1?-1:1);});}
function dateRU(d){if(!d)return '';var p=String(d).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d;}
function initials(name){return String(name||'?').split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase();}
function contrastInk(hex){ /* WCAG-ish luminance pick so labels stay readable on any configured colour */
  var h=String(hex||'#cccccc').replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  function lin(c){return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
  var L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  return L>0.45?'#1b1b1b':'#ffffff';
}
function nextId(prefix,list){
  var max=0; arr(list).forEach(function(x){
    var m=String(x.id||'').match(/(\d+)$/); if(m&&+m[1]>max)max=+m[1];});
  return prefix+'-'+String(max+1).padStart(3,'0');
}

function persist(){
  try{
    var prev=localStorage.getItem(K_STATE);
    S.meta={schemaVersion:SCHEMA_VERSION,savedAt:nowISO(),appVersion:LSP_VERSION};
    var blob=JSON.stringify(S);
    setSaveState('Saving…');
    localStorage.setItem(K_STATE,blob);
    if(prev)localStorage.setItem(K_BACKUP,prev);   /* last good copy before this write */
    UI.dirty=false;setSaveState('Saved');
    return true;
  }catch(e){
    setSaveState('NOT saved');
    toast(e&&e.name==='QuotaExceededError'
      ? 'Browser storage is full. Export a backup from Import / Export, then reset demo data.'
      : 'Could not save locally: '+(e&&e.message||e));

function loadState(){
  var raw=null;
  try{raw=localStorage.getItem(K_STATE);}catch(e){return {ok:false,reason:'Storage is not available in this browser.'};}
  if(!raw)return {ok:false,reason:'empty'};
  var data;
  try{data=JSON.parse(raw);}catch(e){return {ok:false,reason:'corrupt',raw:raw};}
  if(!data||typeof data!=='object'||!Array.isArray(data.units))return {ok:false,reason:'corrupt',raw:raw};
  data=migrate(data);
  Object.keys(S).forEach(function(k){ if(data[k]!==undefined)S[k]=data[k]; });
  return {ok:true};
}

  var v=(d.meta&&d.meta.schemaVersion)||0;

  if(v<1){ if(!d.settings||!d.settings.unitStatuses)d.settings=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
           d.meta=d.meta||{}; d.meta.schemaVersion=1; }

}

function toast(msg){
  var b=$('toasts');if(!b)return;
  var el=document.createElement('div');el.className='toast';el.textContent=msg;b.appendChild(el);
  setTimeout(function(){el.remove();},3400);
}

/* Build an SVG floor plan from a layout spec. Shell, corridor and cores are
   decoration; only elements with data-unit-id are bound to units. */
function buildPlanSVG(spec,opt){
  opt=opt||{};
  var maxX=0,maxY=0;
  spec.forEach(function(u){maxX=Math.max(maxX,u[1]+u[3]);maxY=Math.max(maxY,u[2]+u[4]);});
  var W=maxX+40,H=maxY+40;
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.title||'Floor plan')+'">';
  s+='<rect x="8" y="8" width="'+(W-16)+'" height="'+(H-16)+'" fill="#ffffff" stroke="#8a8580" stroke-width="3"/>';
  /* mall corridor between the two rows */
  if(opt.corridor)s+='<rect x="30" y="'+opt.corridor[0]+'" width="'+(W-60)+'" height="'+opt.corridor[1]+
    '" fill="#f1efec" stroke="#cfc9c1" stroke-width="1.5"/>'+
    '<text x="'+(W/2)+'" y="'+(opt.corridor[0]+opt.corridor[1]/2+7)+'" text-anchor="middle" font-size="22" fill="#a49d94" font-family="sans-serif">'+esc(opt.corridorLabel||'MALL')+'</text>';
  /* vertical cores */
  (opt.cores||[]).forEach(function(c){
    s+='<rect x="'+c[0]+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[3]+'" fill="#e3ded7" stroke="#b9b2a8" stroke-width="1.5"/>'+
       '<text x="'+(c[0]+c[2]/2)+'" y="'+(c[1]+c[3]/2+5)+'" text-anchor="middle" font-size="14" fill="#8a8580" font-family="sans-serif">'+esc(c[4]||'')+'</text>';
  });
  /* the leasable units — real geometry, one element per unit */
  spec.forEach(function(u){
    s+='<rect class="unit" data-unit-code="'+esc(u[0])+'" x="'+u[1]+'" y="'+u[2]+'" width="'+u[3]+'" height="'+u[4]+
       '" fill="#e5e7eb" stroke="#6b6b6b" stroke-width="1.5"/>';
  });
  s+='</svg>';
  return s;
}

<script>
'use strict';
/* ============================================================================
   SERVICES — all business logic, no DOM. Views call these; so does the AI tool
   registry. Two invariants are enforced here rather than in the renderers:
     · inventory buckets partition project GLA, each unit counted once;
     · a missing value is never zero — it is excluded and counted separately.
   ========================================================================= */

/* ---- scoping ------------------------------------------------------------ */
function svcVisibleProjects(){
  if(SESSION&&SESSION.role==='client'){
    var cl=byId(S.clients,SESSION.clientId);
    var ids=cl?arr(cl.projectIds):[];
    return S.projects.filter(function(p){return ids.indexOf(p.id)>=0;});
  }
  return S.projects.slice();
}
function svcProjectScope(){                      /* '' = all visible projects */
  var vis=svcVisibleProjects();
  if(!UI.project)return vis.map(function(p){return p.id;});
  return vis.filter(function(p){return p.id===UI.project;}).map(function(p){return p.id;});
}
function svcUnits(projectIds){
  var ids=projectIds||svcProjectScope();
  var us=S.units.filter(function(u){return ids.indexOf(u.projectId)>=0;});
  if(SESSION&&SESSION.role==='client')us=us.filter(function(u){return u.visibility==='client_visible'||u.visibility==='public';});
  return us;
}
function svcDeals(projectIds,type){
  var ids=projectIds||svcProjectScope();
  return S.deals.filter(function(d){
    return ids.indexOf(d.projectId)>=0 && (!type||d.type===type);});
}
function svcOwnFilter(list,field){               /* managers see their own work first-class */
  if(!SESSION||SESSION.role!=='manager')return list;
  return list;                                    /* prototype: visible but flagged, not hidden */
}
function isOpenStage(type,key){return stageDef(type,key).type==='open';}
function openDealsFor(unitId){
  return S.deals.filter(function(d){return d.unitIds.indexOf(unitId)>=0&&isOpenStage(d.type,d.stage);});
}
function dealsFor(unitId){return S.deals.filter(function(d){return d.unitIds.indexOf(unitId)>=0;});}

/* ---- derived unit state (D5) -------------------------------------------- */
function svcPipelineStage(unitId){
  var ds=openDealsFor(unitId),best=null;
  ds.forEach(function(d){
    var sd=stageDef(d.type,d.stage);
    if(!best||sd.rank>best.rank)best={rank:sd.rank,label:sd.label,color:sd.color,deal:d,def:sd};});
  return best;
}
function rankOf(type,key){return stageDef(type,key).rank;}
function svcDisplayStatus(u){
  /* A marketable unit with a live deal shows the deal's stage; everything else
     shows its inventory status. Nothing is written back to the unit. */
  var st=statusDef(u.commercialStatus);
  var thr=CONFIG().thresholds.displayStage;
  var best=svcPipelineStage(u.id);
  if(st.marketable&&best){
    var minRank=Math.min(rankOf('Leasing',thr),rankOf('Sales',thr));
    if(best.rank>=minRank)
      return {label:best.label,color:best.color,derived:true,base:st,stage:best};
  }
  return {label:st.label,color:st.color,derived:false,base:st,stage:best};
}
function svcClientStatus(u){
  var st=statusDef(u.commercialStatus);
  var best=svcPipelineStage(u.id);
  if(st.marketable&&best)return best.def.clientStatus||st.clientStatus;
  return st.clientStatus;
}

/* ---- inventory KPIs (D6) ------------------------------------------------ */
function svcInventory(projectIds){
  var us=svcUnits(projectIds);
  var thr=CONFIG().thresholds.negotiationStage;
  var minRank=Math.min(rankOf('Leasing',thr),rankOf('Sales',thr));
  var r={totalGLA:0,unitsTotal:us.length,unitsWithoutArea:0,
         leasedGLA:0,soldGLA:0,negotiationGLA:0,availableGLA:0,unavailableGLA:0,
         leasedUnits:0,soldUnits:0,negotiationUnits:0,availableUnits:0,unavailableUnits:0,
         declaredGLA:null,buckets:[]};
  us.forEach(function(u){
    var a=u.area&&u.area.glaM2;
    if(a==null||!isFinite(a)){r.unitsWithoutArea++;return;}   /* unknown ≠ zero */
    r.totalGLA+=a;
    var st=statusDef(u.commercialStatus);
    var best=svcPipelineStage(u.id);
    var inNeg=st.marketable&&best&&best.rank>=minRank;
    if(st.countsAs==='leased'){r.leasedGLA+=a;r.leasedUnits++;}
    else if(st.countsAs==='sold'){r.soldGLA+=a;r.soldUnits++;}
    else if(st.countsAs==='unavailable'){r.unavailableGLA+=a;r.unavailableUnits++;}
    else if(st.countsAs==='pipeline'||inNeg){r.negotiationGLA+=a;r.negotiationUnits++;}
    else {r.availableGLA+=a;r.availableUnits++;}
  });
  var ids=projectIds||svcProjectScope();
  var dec=0,any=false;
  S.projects.forEach(function(p){if(ids.indexOf(p.id)>=0&&p.areas&&p.areas.glaM2!=null){dec+=p.areas.glaM2;any=true;}});
  r.declaredGLA=any?Math.round(dec*10)/10:null;
  ['totalGLA','leasedGLA','soldGLA','negotiationGLA','availableGLA','unavailableGLA'].forEach(function(k){
    r[k]=Math.round(r[k]*10)/10;});
  /* invariant: buckets must partition the measured GLA */
  r.checkSum=Math.round((r.leasedGLA+r.soldGLA+r.negotiationGLA+r.availableGLA+r.unavailableGLA)*10)/10;
  r.balanced=Math.abs(r.checkSum-r.totalGLA)<0.5;
  r.buckets=[
    {key:'leased',      label:'Leased',            gla:r.leasedGLA,       units:r.leasedUnits,       color:'#2f8a4f'},
    {key:'sold',        label:'Sold',              gla:r.soldGLA,         units:r.soldUnits,         color:'#b5651d'},
    {key:'negotiation', label:'Under negotiation', gla:r.negotiationGLA,  units:r.negotiationUnits,  color:'#f4c95d'},
    {key:'available',   label:'Available',         gla:r.availableGLA,    units:r.availableUnits,    color:'#cfe8d4'},
    {key:'unavailable', label:'Unavailable',       gla:r.unavailableGLA,  units:r.unavailableUnits,  color:'#c0bab2'}
  ];
  return r;
}

/* ---- deal-centric metrics ----------------------------------------------- */
function svcDealArea(d){
  if(d.areaOverrideM2!=null)return d.areaOverrideM2;
  var seen={},total=0,missing=0;
  uniq(d.unitIds).forEach(function(uid){
    if(seen[uid])return; seen[uid]=1;
    var u=byId(S.units,uid); if(!u)return;
    var a=u.area&&u.area.glaM2;
    if(a==null||!isFinite(a)){missing++;return;}
    total+=a;});
  return missing&&!total?null:Math.round(total*10)/10;
}
function svcValueBasis(d){
  /* precedence agreed → proposed/offer → asking; the flag says which was used,
     so a dashboard never presents an asking rent as an agreed one. */
  var t=d.commercialTerms||{};
  if(d.type==='Sales'){
    if(t.agreedPrice!=null)return {value:t.agreedPrice,basis:'agreed',kind:'price'};
    if(t.offerPrice!=null) return {value:t.offerPrice, basis:'offer', kind:'price'};
    if(t.askingPrice!=null)return {value:t.askingPrice,basis:'asking',kind:'price'};
    var u0=byId(S.units,d.unitIds[0]);
    if(u0&&u0.salesTerms&&u0.salesTerms.askingPrice!=null)
      return {value:u0.salesTerms.askingPrice,basis:'unit asking',kind:'price'};
    return {value:null,basis:'none',kind:'price'};
  }
  var area=svcDealArea(d);
  var rate=t.agreedRent!=null?{r:t.agreedRent,b:'agreed'}:t.proposedRent!=null?{r:t.proposedRent,b:'proposed'}:
           t.askingRent!=null?{r:t.askingRent,b:'asking'}:null;
  if(!rate){
    var u=byId(S.units,d.unitIds[0]);
    if(u&&u.leasingTerms&&u.leasingTerms.askingRent!=null)rate={r:u.leasingTerms.askingRent,b:'unit asking'};
  }
  if(!rate||area==null)return {value:null,basis:rate?rate.b:'none',kind:'annual rent',area:area,rate:rate?rate.r:null};
  return {value:cents(rate.r*area*12),basis:rate.b,kind:'annual rent',area:area,rate:rate.r};
}
function svcDealProbability(d){
  return d.probability!=null?d.probability:stageDef(d.type,d.stage).prob;
}
function svcPipeline(type,projectIds){
  var ds=svcDeals(projectIds,type).filter(function(d){return isOpenStage(d.type,d.stage);});
  var byStage={},totalArea=0,totalValue=0,weighted=0,valueUnknown=0;
  stageList(type).forEach(function(s){if(s.type==='open')byStage[s.key]={def:s,deals:[],area:0,value:0,weighted:0};});
  ds.forEach(function(d){
    var b=byStage[d.stage]; if(!b)return;
    var a=svcDealArea(d),v=svcValueBasis(d),p=svcDealProbability(d)/100;
    b.deals.push(d); if(a!=null){b.area+=a;totalArea+=a;}
    if(v.value!=null){b.value+=v.value;totalValue+=v.value;b.weighted+=v.value*p;weighted+=v.value*p;}
    else valueUnknown++;
  });
  return {type:type,deals:ds,byStage:byStage,totalArea:Math.round(totalArea*10)/10,
    totalValue:Math.round(totalValue),weighted:Math.round(weighted),valueUnknown:valueUnknown,
    note:'Deal-based: a unit with several prospects appears in more than one deal.'};
}
function svcStageAging(d){return daysAgo(d.dateEnteredStage);}
function svcConversion(type,projectIds){
  var ds=svcDeals(projectIds,type),out=[];
  var list=stageList(type).filter(function(s){return s.type==='open';});
  list.forEach(function(s){
    var reached=ds.filter(function(d){
      if(arr(d.stageHistory).some(function(h){return rankOf(d.type,h.stage)>=s.rank;}))return true;
      return rankOf(d.type,d.stage)>=s.rank;}).length;
    out.push({stage:s,count:reached});
  });
  return out;
}

/* ---- merchandise mix ---------------------------------------------------- */
function svcMix(projectIds,basis){
  var us=svcUnits(projectIds),cats=CONFIG().categories;
  var ids=projectIds||svcProjectScope();
  var target={},sumTarget=0;
  S.projects.forEach(function(p){
    if(ids.indexOf(p.id)<0)return;
    Object.keys(p.targetMix||{}).forEach(function(k){target[k]=(target[k]||0)+p.targetMix[k];sumTarget+=p.targetMix[k];});
  });
  var nProj=ids.length||1;
  var rows=cats.map(function(c){
    var actualUnits=us.filter(function(u){
      var st=statusDef(u.commercialStatus);
      return (st.countsAs==='leased'||st.countsAs==='sold')&&u.actualUse&&u.actualUse.category===c.key;});
    var targetUnits=us.filter(function(u){return u.targetUse&&u.targetUse.category===c.key;});
    var pipelineUnits=us.filter(function(u){
      var st=statusDef(u.commercialStatus);
      if(st.countsAs==='leased'||st.countsAs==='sold')return false;
      var best=svcPipelineStage(u.id);
      if(!best)return false;
      var b=byId(S.brands,best.deal.brandId);
      return b&&b.classification.category===c.key;});
    var vacantUnits=targetUnits.filter(function(u){
      var st=statusDef(u.commercialStatus);return st.countsAs==='vacant';});
    return {cat:c,
      actualGLA:Math.round(sum(actualUnits.map(function(u){return u.area.glaM2;}))*10)/10,
      actualUnits:actualUnits.length,
      targetGLA:Math.round(sum(targetUnits.map(function(u){return u.area.glaM2;}))*10)/10,
      targetUnits:targetUnits.length,
      pipelineGLA:Math.round(sum(pipelineUnits.map(function(u){return u.area.glaM2;}))*10)/10,
      vacantGLA:Math.round(sum(vacantUnits.map(function(u){return u.area.glaM2;}))*10)/10,
      targetSharePct:sumTarget?Math.round((target[c.key]||0)/nProj*10)/10:null};
  }).filter(function(r){return r.actualUnits||r.targetUnits||r.pipelineGLA||r.targetSharePct;});
  var totActual=sum(rows.map(function(r){return r.actualGLA;}));
  var totTarget=sum(rows.map(function(r){return r.targetGLA;}));
  var totActualU=sum(rows.map(function(r){return r.actualUnits;}));
  var totTargetU=sum(rows.map(function(r){return r.targetUnits;}));
  rows.forEach(function(r){
    r.actualSharePct=basis==='units'?pct(r.actualUnits,totActualU):pct(r.actualGLA,totActual);
    r.plannedSharePct=basis==='units'?pct(r.targetUnits,totTargetU):pct(r.targetGLA,totTarget);
    r.gapPct=(r.actualSharePct!=null&&r.plannedSharePct!=null)?r.actualSharePct-r.plannedSharePct:null;
  });
  return {rows:rows,basis:basis||'gla',totalActualGLA:Math.round(totActual*10)/10,
    totalTargetGLA:Math.round(totTarget*10)/10,totalActualUnits:totActualU,totalTargetUnits:totTargetU};
}

/* ---- brand ↔ unit matching (§39): deterministic, explained, never "guaranteed" */
function svcMatchScore(brand,unit){
  var why=[],score=0,max=0,hard=[];
  var bc=brand.classification||{},er=brand.expansionRequirements||{};
  var a=unit.area&&unit.area.glaM2;
  max+=30; /* category */
  if(unit.targetUse&&unit.targetUse.category){
    if(unit.targetUse.category===bc.category){score+=30;why.push(t('Target category matches')+' ('+catLabel(bc.category)+')');}
    else why.push(t('Target category differs')+': '+catLabel(unit.targetUse.category)+' / '+catLabel(bc.category));
  } else {score+=10;why.push(t('Unit has no target category'));}
  max+=30; /* area */
  if(a==null){why.push(t('Unit area unknown — area not scored'));}
  else if(er.minimumAreaM2!=null&&er.maximumAreaM2!=null){
    if(a>=er.minimumAreaM2&&a<=er.maximumAreaM2){score+=30;why.push(t('Area')+' '+fmt(a,1)+' '+sqm()+' '+t('is inside the brand range')+' '+fmt(er.minimumAreaM2)+'–'+fmt(er.maximumAreaM2)+' '+sqm());}
    else{hard.push(t('Area')+' '+fmt(a,1)+' '+sqm()+' '+t('is outside the brand range')+' '+fmt(er.minimumAreaM2)+'–'+fmt(er.maximumAreaM2)+' '+sqm());}
  } else {score+=10;why.push(t('Brand area range not recorded'));}
  max+=15; /* subcategory */
  if(unit.targetUse&&unit.targetUse.subcategory&&bc.subcategory){
    if(unit.targetUse.subcategory===bc.subcategory){score+=15;why.push(t('Subcategory matches')+' ('+bc.subcategory+')');}
    else why.push(t('Subcategory differs'));
  }
  max+=10; /* availability */
  var st=statusDef(unit.commercialStatus);
  if(st.marketable){score+=10;why.push(t('Unit is marketable')+' ('+t(st.label)+')');}
  else hard.push(t('Unit is not marketable')+' ('+t(st.label)+')');
  max+=10; /* role / format */
  if(unit.targetUse&&unit.targetUse.merchandiseRole&&bc.format){
    if(unit.targetUse.merchandiseRole===bc.format){score+=10;why.push(t('Format matches')+' ('+bc.format+')');}
  }
  max+=5;  /* city */
  var proj=byId(S.projects,unit.projectId);
  if(proj&&arr(er.targetCities).indexOf(proj.city)>=0){score+=5;why.push(t('Target city includes')+' '+proj.city);}
  return {score:Math.round(score/max*100),why:why,blockers:hard};
}
function svcSuggestBrandsForUnit(unit,limit){
  return sortBy(S.brands.map(function(b){
    var m=svcMatchScore(b,unit);return {brand:b,score:m.score,why:m.why,blockers:m.blockers};}),
    function(x){return -x.score;}).slice(0,limit||6);
}
function svcSuggestUnitsForBrand(brand,limit){
  return sortBy(svcUnits().map(function(u){
    var m=svcMatchScore(brand,u);return {unit:u,score:m.score,why:m.why,blockers:m.blockers};}),
    function(x){return -x.score;}).slice(0,limit||6);
}

/* ---- completeness, stale, hygiene --------------------------------------- */
function svcUnitCompleteness(u){
  var checks=[
   {k:'Area',ok:u.area&&u.area.glaM2!=null},
   {k:'Status',ok:!!u.commercialStatus},
   {k:'Target category',ok:!!(u.targetUse&&u.targetUse.category)},
   {k:'Commercial terms',ok:!!((u.leasingTerms&&u.leasingTerms.askingRent!=null)||(u.salesTerms&&u.salesTerms.askingPrice!=null))},
   {k:'Responsible manager',ok:!!(u.responsibility&&u.responsibility.responsibleManagerId)}
  ];
  return {checks:checks,score:Math.round(checks.filter(function(c){return c.ok;}).length/checks.length*100)};
}
function svcDealCompleteness(d){
  var checks=[
   {k:'Responsible manager',ok:!!(d.ownership&&d.ownership.responsibleManagerId)},
   {k:'Contact',ok:arr(d.contactIds).length>0},
   {k:'Stage',ok:!!d.stage},
   {k:'Next action',ok:!!(d.nextAction&&d.nextAction.text)},
   {k:'Linked unit',ok:arr(d.unitIds).length>0},
   {k:'Commercial terms',ok:svcValueBasis(d).value!=null}
  ];
  return {checks:checks,score:Math.round(checks.filter(function(c){return c.ok;}).length/checks.length*100)};
}
function svcBrandCompleteness(b){
  var checks=[
   {k:'Category',ok:!!(b.classification&&b.classification.category)},
   {k:'Contacts',ok:arr(b.contactIds).length>0},
   {k:'Expansion requirements',ok:!!(b.expansionRequirements&&b.expansionRequirements.minimumAreaM2!=null)},
   {k:'Last contact',ok:!!(b.relationship&&b.relationship.lastContactDate)},
   {k:'Relationship owner',ok:!!(b.relationship&&b.relationship.ownerId)}
  ];
  return {checks:checks,score:Math.round(checks.filter(function(c){return c.ok;}).length/checks.length*100)};
}
function svcStaleDeals(projectIds){
  var lim=CONFIG().thresholds.staleDealDays;
  return svcDeals(projectIds).filter(function(d){
    if(!isOpenStage(d.type,d.stage))return false;
    var age=daysAgo(d.activity&&d.activity.lastContactDate);
    return age!=null&&age>lim;});
}
function svcNoNextAction(projectIds){
  return svcDeals(projectIds).filter(function(d){
    return isOpenStage(d.type,d.stage)&&!(d.nextAction&&d.nextAction.text);});
}
function svcOverdueTasks(projectIds){
  var ids=projectIds||svcProjectScope();
  return S.tasks.filter(function(t){
    return t.status!=='Done'&&t.dueDate&&t.dueDate<today()&&(!t.projectId||ids.indexOf(t.projectId)>=0);});
}
function svcTasksDue(when,projectIds){
  var ids=projectIds||svcProjectScope(),tt=today();
  return S.tasks.filter(function(t){
    if(t.status==='Done'||!t.dueDate)return false;
    if(t.projectId&&ids.indexOf(t.projectId)<0)return false;
    if(when==='today')return t.dueDate===tt;
    if(when==='week'){var dd=daysBetween(tt,t.dueDate);return dd!=null&&dd>0&&dd<=7;}
    return false;});
}
function svcOpenClientComments(projectIds){
  var ids=projectIds||svcProjectScope();
  return S.comments.filter(function(c){
    return c.authorType==='client'&&c.status!=='Resolved'&&ids.indexOf(c.projectId)>=0;});
}
function svcHygiene(projectIds){
  var us=svcUnits(projectIds),ds=svcDeals(projectIds);
  return [
   {k:t('Units without area'),n:us.filter(function(u){return !u.area||u.area.glaM2==null;}).length,view:'units'},
   {k:t('Units without target category'),n:us.filter(function(u){return !u.targetUse||!u.targetUse.category;}).length,view:'units'},
   {k:t('Units without commercial terms'),n:us.filter(function(u){
      return !(u.leasingTerms&&u.leasingTerms.askingRent!=null)&&!(u.salesTerms&&u.salesTerms.askingPrice!=null)
        &&statusDef(u.commercialStatus).marketable;}).length,view:'units'},
   {k:t('Units without responsible manager'),n:us.filter(function(u){return !(u.responsibility&&u.responsibility.responsibleManagerId);}).length,view:'units'},
   {k:t('Open deals without next action'),n:svcNoNextAction(projectIds).length,view:'leasing'},
   {k:t('Stale deals')+' ('+t('no activity over')+' '+CONFIG().thresholds.staleDealDays+' '+t('days')+')',n:svcStaleDeals(projectIds).length,view:'leasing'},
   {k:t('Brands without contacts'),n:S.brands.filter(function(b){return !arr(b.contactIds).length;}).length,view:'brands'},
   {k:t('Client comments awaiting response'),n:svcOpenClientComments(projectIds).length,view:'portal'},
   {k:t('Signed deals without a contract document'),n:ds.filter(function(d){
      return rankOf(d.type,d.stage)>=rankOf(d.type,'signed')&&isOpenStage(d.type,d.stage)&&
        !arr(d.documentIds).some(function(id){var doc=byId(S.documents,id);return doc&&doc.category==='Contract';});}).length,view:'documents'}
  ];
}
function svcMandateWarnings(projectIds){
  var warn=CONFIG().thresholds.mandateWarnDays,out=[];
  var ids=projectIds||svcProjectScope();
  svcVisibleProjects().filter(function(p){return ids.indexOf(p.id)>=0;}).forEach(function(p){
    var exp=p.commercial&&p.commercial.mandateExpiryDate;
    if(!exp)return;
    var dd=daysBetween(today(),exp);
    if(dd!=null&&dd<=warn)out.push({project:p,days:dd});
  });
  return out;
}

/* ---- provenance (D16) ---------------------------------------------------- */
function provOf(entity,id,field){
  var rec=null;
  if(entity==='unit'){var u=byId(S.units,id);rec=u&&u.provenance?u.provenance[field]:null;}
  return rec||null;
}
function provAge(rec){return rec&&rec.at?daysAgo(rec.at):null;}
function provWeakest(list){
  var recs=list.filter(Boolean);
  if(!recs.length)return null;
  var idx=recs.reduce(function(m,r){var i=PROV_ORDER.indexOf(r.conf);return i<0?m:Math.min(m,i);},PROV_ORDER.length-1);
  var counts={};recs.forEach(function(r){counts[r.conf]=(counts[r.conf]||0)+1;});
  var oldest=recs.reduce(function(m,r){return (!m||String(r.at)<String(m))?r.at:m;},null);
  return {conf:PROV_ORDER[idx],counts:counts,at:oldest,n:recs.length};
}
function provChip(rec,label){
  if(!rec)return '<span class="prov none" title="'+h(t('No source recorded'))+'">'+t('? no source')+'</span>';
  var k=PROV_KIND[rec.conf]||PROV_KIND.asking, age=provAge(rec), th=CONFIG().thresholds;
  var cls='prov '+rec.conf+(age!=null&&age>th.provRedDays?' old':age!=null&&age>th.provAmberDays?' stale':'');
  var when=rec.at?(' · '+dateRU(rec.at)+(age!=null?' ('+(age>365?Math.round(age/30)+' mo':age+' d')+')':'')):'';
  var src=PROV_SRC[rec.src]||rec.src||'';
  return '<span class="'+cls+'" title="'+esc(k.hint+' Source: '+src+(rec.name?' — '+rec.name:'')+when+(rec.note?' · '+rec.note:''))+
    '">'+k.mark+' '+esc(t(label||k.label))+'</span>';
}

/* ---- client view model (D7): a whitelist, never a blacklist -------------- */
function svcClientView(projectId){
  var p=byId(S.projects,projectId);
  if(!p)return null;
  var inv=svcInventory([projectId]);
  var us=S.units.filter(function(u){return u.projectId===projectId&&(u.visibility==='client_visible'||u.visibility==='public');});
  var mix=svcMix([projectId],'gla');
  return {
    project:{id:p.id,name:p.name,city:p.city,address:p.address,assetTypes:p.assetTypes,
      targetOpeningDate:p.commercial&&p.commercial.targetOpeningDate,
      notes:arr(p.notes&&p.notes.clientVisible)},
    kpis:{totalGLA:inv.totalGLA,leasedGLA:inv.leasedGLA,soldGLA:inv.soldGLA,
      negotiationGLA:inv.negotiationGLA,availableGLA:inv.availableGLA,
      leasedPct:pct(inv.leasedGLA+inv.soldGLA,inv.totalGLA),
      availablePct:pct(inv.availableGLA,inv.totalGLA),
      signedDeals:S.deals.filter(function(d){return d.projectId===projectId&&
        rankOf(d.type,d.stage)>=rankOf(d.type,'signed');}).length,
      activeNegotiations:S.deals.filter(function(d){return d.projectId===projectId&&isOpenStage(d.type,d.stage)&&
        rankOf(d.type,d.stage)>=rankOf(d.type,CONFIG().thresholds.negotiationStage);}).length,
      unitsWithoutArea:inv.unitsWithoutArea},
    units:us.map(function(u){
      return {id:u.id,unitNumber:u.unitNumber,floorId:u.floorId,
        areaM2:u.area?u.area.glaM2:null,
        status:svcClientStatus(u),
        category:u.actualUse&&u.actualUse.category?catLabel(u.actualUse.category):
                 (u.targetUse&&u.targetUse.category?catLabel(u.targetUse.category)+' ('+t('target')+')':null),
        tenant:(statusDef(u.commercialStatus).countsAs==='leased'||statusDef(u.commercialStatus).countsAs==='sold')
               ?(u.actualUse?u.actualUse.tenantName:null):null};
    }),
    mix:mix.rows.map(function(r){return {category:r.cat.label,color:r.cat.color,
      actualGLA:r.actualGLA,actualSharePct:r.actualSharePct,plannedSharePct:r.plannedSharePct};}),
    documents:S.documents.filter(function(x){return x.projectId===projectId&&x.visibility==='client_visible';})
      .map(function(x){return {id:x.id,fileName:x.fileName,category:x.category,uploadedAt:x.uploadedAt};}),
    comments:S.comments.filter(function(c){return c.projectId===projectId&&c.visibility==='client_visible';}),
    lastUpdated:S.meta&&S.meta.savedAt?S.meta.savedAt.slice(0,10):today()
  };
}

/* ---- search -------------------------------------------------------------- */
function svcSearch(q){
  q=String(q||'').trim().toLowerCase();
  if(q.length<2)return [];
  var out=[],vis=svcProjectScope();
  function add(type,label,ctx,go){out.push({type:type,label:label,context:ctx,go:go});}
  svcVisibleProjects().forEach(function(p){
    if(p.name.toLowerCase().indexOf(q)>=0)add('Project',p.name,p.city||'',{view:'project',id:p.id});});
  svcUnits().forEach(function(u){
    if(String(u.unitNumber).toLowerCase().indexOf(q)>=0){
      var p=byId(S.projects,u.projectId);
      add('Unit',u.unitNumber,(p?p.name:'')+' · '+(fmt(u.area&&u.area.glaM2,1))+' '+sqm(),{view:'unit',id:u.id});}});
  if(!SESSION||SESSION.role!=='client'){
    S.brands.forEach(function(b){
      if(b.name.toLowerCase().indexOf(q)>=0)add('Brand',b.name,catLabel(b.classification.category),{view:'brand',id:b.id});});
    S.companies.forEach(function(c){
      if(c.legalName.toLowerCase().indexOf(q)>=0)add('Company',c.legalName,c.country||'',{view:'companies',id:c.id});});
    S.contacts.forEach(function(c){
      var nm=(c.firstName+' '+c.lastName);
      if(nm.toLowerCase().indexOf(q)>=0){
        var comp=byId(S.companies,c.companyId);
        add('Contact',nm,(c.position||'')+(comp?' · '+comp.legalName:''),{view:'contacts',id:c.id});}});
    S.deals.forEach(function(d){
      var b=byId(S.brands,d.brandId);
      var nm=(b?b.name:'Deal')+' — '+stgLabel(d.type,d.stage);
      if(nm.toLowerCase().indexOf(q)>=0&&vis.indexOf(d.projectId)>=0)
        add('Deal',nm,d.unitIds.map(function(i){var u=byId(S.units,i);return u?u.unitNumber:'';}).join(', '),{view:'deal',id:d.id});});
    S.tasks.forEach(function(t){
      if(t.title.toLowerCase().indexOf(q)>=0)add('Task',t.title,t.dueDate||'',{view:'tasks',id:t.id});});
    S.documents.forEach(function(x){
      if(x.fileName.toLowerCase().indexOf(q)>=0)add('Document',x.fileName,x.category,{view:'documents',id:x.id});});
  }
  return out.slice(0,40);
}
</script>

<script>
'use strict';
/* ============================================================================
   UI FRAMEWORK — router, navigation, drawer, modal, and the floor-plan engine.
   Event handling is delegated from document: no inline handlers, so the page
   runs under the CASE OS Content-Security-Policy unchanged.
   ========================================================================= */

var ROLE_LABEL={founder_admin:'Founder / Curator',head_ls:'Head of Leasing & Sales',
  manager:'Leasing / Sales Manager',administrator:'Leasing Administrator',
  external_agent:'External Agent',client:'Client / Property Owner'};

/* capability matrix — the single place that answers "may this role do X" */
var CAP={
  founder_admin:{view:'*',edit:true,finance:true,settings:true,admin:true,portalPreview:true,commission:'all'},
  head_ls:      {view:'*',edit:true,finance:true,settings:'partial',admin:false,portalPreview:true,commission:'company'},
  manager:      {view:'ops',edit:true,finance:false,settings:false,admin:false,portalPreview:false,commission:'own'},
  administrator:{view:'ops',edit:'partial',finance:false,settings:false,admin:false,portalPreview:true,commission:'status'},
  external_agent:{view:'limited',edit:false,finance:false,settings:false,admin:false,portalPreview:false,commission:'none'},
  client:       {view:'portal',edit:false,finance:false,settings:false,admin:false,portalPreview:false,commission:'none'}
};
function cap(){return CAP[(SESSION&&SESSION.role)||'manager']||CAP.manager;}
function canEdit(){var c=cap();return c.edit===true||c.edit==='partial';}
function canSeeFinance(){return !!cap().finance;}
function isClient(){return SESSION&&SESSION.role==='client';}

var NAV=[
 {grp:'Overview',items:[
   {v:'dash',   ic:'▣',label:'Dashboard'},
   {v:'projects',ic:'▦',label:'Projects'}]},
 {grp:'Property',items:[
   {v:'plan',   ic:'◈',label:'Floor plan'},
   {v:'units',  ic:'▤',label:'Units'},
   {v:'mix',    ic:'◐',label:'Merchandise mix'}]},
 {grp:'Pipeline',items:[
   {v:'leasing',ic:'⇉',label:'Leasing pipeline'},
   {v:'sales',  ic:'⇈',label:'Sales pipeline'}]},
 {grp:'CRM',items:[
   {v:'brands',    ic:'★',label:'Brands'},
   {v:'companies', ic:'⌂',label:'Companies'},
   {v:'contacts',  ic:'☏',label:'Contacts'},
   {v:'requirements',ic:'✎',label:'Requirements'}]},
 {grp:'Work',items:[
   {v:'tasks',     ic:'✓',label:'Tasks',badge:'tasks'},
   {v:'activities',ic:'≡',label:'Activities'},
   {v:'documents', ic:'🗎',label:'Documents'}]},
 {grp:'Output',items:[
   {v:'reports',ic:'⎙',label:'Reports'},
   {v:'portal', ic:'◎',label:'Client portal',badge:'comments'}]},
 {grp:'System',items:[
   {v:'settings',ic:'⚙',label:'Settings'},
   {v:'io',      ic:'⇄',label:'Import / Export'},
   {v:'ask',     ic:'?',label:'Ask (prototype)'}]}
];
var CLIENT_NAV=[
 {grp:'My project',items:[
   {v:'cdash',ic:'▣',label:'Dashboard'},
   {v:'cplan',ic:'◈',label:'Floor plan'},
   {v:'cdocs',ic:'🗎',label:'Documents'},
   {v:'creport',ic:'⎙',label:'Report'},
   {v:'ccomments',ic:'✎',label:'Comments'}]}
];
function navItems(){
  if(isClient())return CLIENT_NAV;
  var c=cap();
  return NAV.map(function(g){
    return {grp:g.grp,items:g.items.filter(function(i){
      if(i.v==='settings'&&!c.settings)return false;
      if(i.v==='io'&&!(c.settings||c.admin))return false;
      if(i.v==='portal'&&!c.portalPreview)return false;
      return true;})};
  }).filter(function(g){return g.items.length;});
}
function badgeCount(kind){
  if(kind==='tasks')return svcOverdueTasks().length+svcTasksDue('today').length;
  if(kind==='comments')return svcOpenClientComments().length;
  return 0;
}
function renderNav(){
  var html='';
  navItems().forEach(function(g){
    html+='<div class="grp">'+esc(t(g.grp))+'</div>';
    g.items.forEach(function(i){
      var b=i.badge?badgeCount(i.badge):0;
      html+='<button data-go="'+i.v+'" class="'+(UI.view===i.v?'on':'')+'">'+
        '<span class="ic">'+i.ic+'</span><span>'+esc(t(i.label))+'</span>'+
        (b?'<span class="badge">'+b+'</span>':'')+'</button>';
    });
  });
  $('nav').innerHTML=html;
}
function go(view,opt){
  UI.view=view; opt=opt||{};
  if(opt.project)UI.project=opt.project;
  closeDrawer();
  renderNav(); render();
  var n=$('nav'); if(n)n.classList.remove('on');
  window.scrollTo(0,0);
  if(opt.openUnit)openUnitDrawer(opt.openUnit);
  if(opt.openDeal)openDealDrawer(opt.openDeal);
}

/* ---- drawer & modal ------------------------------------------------------ */
function openDrawer(html){
  $('drawer').innerHTML=html;
  $('drawer').classList.add('on'); $('scrim').classList.add('on');
}
function closeDrawer(){$('drawer').classList.remove('on');$('scrim').classList.remove('on');}
function openModal(title,bodyHtml,footerHtml){
  $('modalbox').innerHTML='<header><h2 style="margin:0;flex:1">'+esc(title)+'</h2>'+
    '<button class="x" data-act="closeModal" aria-label="'+h(t('Close'))+'">×</button></header>'+
    '<div class="body">'+bodyHtml+'</div>'+
    (footerHtml?('<footer>'+footerHtml+'</footer>'):'');
  $('modal').classList.add('on');
}
function closeModal(){$('modal').classList.remove('on');}

/* ============================================================================
   FLOOR PLAN ENGINE
   Modes colour the same geometry differently; each mode owns its legend.
   Labels are written with textContent, never by concatenating markup — registry
   data must never become executable markup (CASE OS v4.70.3 lesson).
   ========================================================================= */
var PLAN={scale:1,x:0,y:0,drag:false,sx:0,sy:0,ox:0,oy:0,selected:null,bound:false};
var PLAN_MODES=[
  {key:'status',   label:'Leasing / Sales status'},
  {key:'mix',      label:'Merchandise mix'},
  {key:'target',   label:'Target vs actual'},
  {key:'manager',  label:'Manager'},
  {key:'avail',    label:'Availability'}
];
var MGR_COLORS=['#9E0000','#1565c0','#0d8484','#6a3fb5','#a16000','#2e7d32','#c86b8a'];
function managerColor(id){
  var list=S.users.filter(function(u){return u.role==='manager'||u.role==='head_ls'||u.role==='administrator';});
  var i=list.map(function(u){return u.id;}).indexOf(id);
  return i<0?'#bdb7ae':MGR_COLORS[i%MGR_COLORS.length];
}
function planFor(projectId,floorId){
  return S.floorPlans.filter(function(p){
    return p.projectId===projectId&&p.floorId===floorId&&p.current&&!p.archived;})[0]||null;
}
function unitFillFor(u,mode){
  if(mode==='mix'){
    var c=u.actualUse&&u.actualUse.category?u.actualUse.category:(u.targetUse&&u.targetUse.category);
    return c?catDef(c).color:'#e5e7eb';
  }
  if(mode==='target'){
    var tc=u.targetUse&&u.targetUse.category, ac=u.actualUse&&u.actualUse.category;
    if(!ac)return '#eceae6';                       /* not yet let */
    if(!tc)return '#d7cfc4';
    return ac===tc?'#2f8a4f':'#c62828';            /* on plan vs deviation */
  }
  if(mode==='manager')return managerColor(u.responsibility&&u.responsibility.responsibleManagerId);
  if(mode==='avail'){
    var g=statusDef(u.commercialStatus).availabilityGroup;
    var best=svcPipelineStage(u.id);
    if(g==='available'&&best)g='in_process';
    return {available:'#cfe8d4',in_process:'#f4c95d',occupied_or_sold:'#2f8a4f',unavailable:'#c0bab2'}[g]||'#e5e7eb';
  }
  return svcDisplayStatus(u).color;               /* default: status mode */
}
function planLegend(mode){
  var items=[];
  if(mode==='status'){
    CONFIG().unitStatuses.forEach(function(s){items.push({c:s.color,l:t(s.label)});});
    var thr=CONFIG().thresholds.displayStage;
    stageList('Leasing').forEach(function(s){
      if(s.type==='open'&&s.rank>=rankOf('Leasing',thr)&&s.rank<rankOf('Leasing','signed'))
        items.push({c:s.color,l:t(s.label)+' '+t('(deal)')});});
  } else if(mode==='mix'){
    CONFIG().categories.forEach(function(c){items.push({c:c.color,l:t(c.label)});});
    items.push({c:'#e5e7eb',l:t('No category')});
  } else if(mode==='target'){
    items=[{c:'#2f8a4f',l:t('Actual matches target')},{c:'#c62828',l:t('Deviation from target')},
           {c:'#eceae6',l:t('Not let yet')},{c:'#d7cfc4',l:t('No target set')}];
  } else if(mode==='manager'){
    S.users.filter(function(u){return u.role==='manager'||u.role==='head_ls'||u.role==='administrator';})
      .forEach(function(u){items.push({c:managerColor(u.id),l:u.name});});
    items.push({c:'#bdb7ae',l:t('Unassigned')});
  } else {
    items=[{c:'#cfe8d4',l:t('Available')},{c:'#f4c95d',l:t('In process')},
           {c:'#2f8a4f',l:t('Occupied / sold')},{c:'#c0bab2',l:t('Unavailable')}];
  }
  return '<div class="legend">'+items.map(function(i){
    return '<span class="li"><span class="sw" style="background:'+i.c+'"></span>'+esc(t(i.l))+'</span>';}).join('')+'</div>';
}
/* SVG sanitiser: allow-list for uploaded plans. Demo plans are built in code,
   but the wizard accepts files, so everything goes through the same gate. */
var SVG_OK_TAGS={svg:1,g:1,rect:1,path:1,polygon:1,polyline:1,circle:1,ellipse:1,line:1,text:1,tspan:1,defs:1,title:1,desc:1};
function sanitizeSvg(svgEl){
  var drop=[];
  svgEl.querySelectorAll('*').forEach(function(el){
    var tag=el.tagName.toLowerCase();
    if(!SVG_OK_TAGS[tag]){drop.push(el);return;}
    Array.prototype.slice.call(el.attributes).forEach(function(a){
      var n=a.name.toLowerCase(),v=String(a.value||'');
      if(n.indexOf('on')===0)el.removeAttribute(a.name);
      else if((n==='href'||n==='xlink:href')&&!/^#/.test(v))el.removeAttribute(a.name);
      else if(/javascript:/i.test(v))el.removeAttribute(a.name);
      else if(n==='style'&&/url\s*\(/i.test(v))el.removeAttribute(a.name);
    });
  });
  drop.forEach(function(el){el.remove();});
  return svgEl;
}
function renderPlanInto(host,projectId,floorId,mode,opts){
  opts=opts||{};
  var plan=planFor(projectId,floorId);
  if(!plan){host.innerHTML='<div class="empty">No current plan version for this floor. '+
    (canEdit()?'Use the mapping wizard to add one.':'')+'</div>';return {matched:0,unmatched:[],missing:[]};}
  host.innerHTML='<div class="planwrap" id="planwrap">'+
    '<div class="planzoom noprint"><button data-act="zoomIn" title="'+h(t('Zoom in'))+'">+</button>'+
    '<button data-act="zoomOut" title="'+h(t('Zoom out'))+'">−</button><button data-act="zoomReset" title="'+h(t('Fit'))+'">⤢</button></div>'+
    '<div id="planview"></div></div>';
  var view=$('planview');
  view.innerHTML=plan.svgText;
  var svg=view.querySelector('svg');
  if(!svg){host.innerHTML='<div class="empty">Plan file contains no &lt;svg&gt; element.</div>';return {matched:0,unmatched:[],missing:[]};}
  sanitizeSvg(svg);
  svg.removeAttribute('height'); svg.setAttribute('width','100%');
  svg.style.maxWidth='100%'; svg.style.height='auto';
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');

  var units=S.units.filter(function(u){return u.projectId===projectId&&u.floorId===floorId;});
  if(isClient())units=units.filter(function(u){return u.visibility==='client_visible'||u.visibility==='public';});
  var byCode={},byUid={};
  units.forEach(function(u){byCode[u.unitNumber]=u;byUid[u.id]=u;});
  arr(plan.polygonMappings).forEach(function(m){ /* explicit mapping wins over code match */
    var el=svg.querySelector('[data-poly-id="'+m.polygonId+'"]');
    if(el&&byUid[m.unitId])el.setAttribute('data-unit-code',byUid[m.unitId].unitNumber);
  });
  var matched=0,unmatched=[],seen={};
  var NS='http://www.w3.org/2000/svg';
  svg.querySelectorAll('[data-unit-code]').forEach(function(el){
    var code=el.getAttribute('data-unit-code'), u=byCode[code];
    if(!u){unmatched.push(code);el.style.fill='#f3f0ec';el.style.opacity='0.5';return;}
    seen[u.id]=1;matched++;
    var fill=unitFillFor(u,mode);
    el.classList.add('unit');
    el.style.fill=fill; el.style.fillOpacity='0.88';
    el.setAttribute('data-unit-id',u.id);
    el.setAttribute('tabindex','0');
    el.setAttribute('role','button');
    var ds=svcDisplayStatus(u);
    var tipParts=[u.unitNumber,
      (u.area&&u.area.glaM2!=null?fmt(u.area.glaM2,1)+' '+sqm():t('area unknown')),t(ds.label)];
    if(u.actualUse&&u.actualUse.tenantName)tipParts.push(u.actualUse.tenantName);
    else if(ds.stage){var b=byId(S.brands,ds.stage.deal.brandId);if(b)tipParts.push(b.name+' ('+t('prospect')+')');}
    var title=document.createElementNS(NS,'title');
    title.textContent=tipParts.join(' · ');          /* textContent: data never becomes markup */
    el.appendChild(title);
    el.setAttribute('aria-label',tipParts.join(', '));
    /* labels drawn from geometry so they follow the shape, not a stored position */
    var bb; try{bb=el.getBBox();}catch(e){bb=null;}
    if(bb&&bb.width>40){
      var cx=bb.x+bb.width/2, cy=bb.y+bb.height/2;
      var fs=Math.max(11,Math.min(bb.width/9,bb.height/4,22));
      var ink=contrastInk(fill);
      var lines=[u.unitNumber];
      var second=(u.actualUse&&u.actualUse.tenantName)?u.actualUse.tenantName:
        (u.area&&u.area.glaM2!=null?fmt(u.area.glaM2,0)+' '+sqm():'—');
      if(bb.height>70)lines.push(second);
      if(bb.height>110&&mode==='status')lines.push(t(ds.label));
      /* a label must stay inside its unit: trim to the width the box actually has,
         otherwise long stage names ("LOI / Commercial Terms") run across the corridor */
      var fitChars=function(txt,size){
        var maxChars=Math.max(3,Math.floor((bb.width-fs*0.6)/(size*0.56)));
        txt=String(txt);
        return txt.length>maxChars?(txt.slice(0,Math.max(1,maxChars-1))+'…'):txt;
      };
      lines.forEach(function(txt,i){
        var size=i?fs*0.72:fs;
        txt=fitChars(txt,size);
        var tx=document.createElementNS(NS,'text');
        tx.setAttribute('x',cx); tx.setAttribute('y',cy+(i-(lines.length-1)/2)*fs*1.15+fs*0.35);
        tx.setAttribute('text-anchor','middle');
        tx.setAttribute('font-size',size);
        tx.setAttribute('fill',ink);
        tx.setAttribute('class','ulab');
        tx.setAttribute('pointer-events','none');
        tx.textContent=txt;                          /* again: textContent */
        svg.appendChild(tx);
      });
    }
    /* accessibility: a non-colour cue for the two "attention" cases */
    var st=statusDef(u.commercialStatus);
    if(mode==='status'&&(st.pattern==='hatch'||st.pattern==='dots')){
      el.setAttribute('stroke-dasharray',st.pattern==='hatch'?'8 4':'2 3');
      el.setAttribute('stroke-width','2.5');
    }
  });
  var missing=units.filter(function(u){return !seen[u.id];});
  PLAN.scale=1;PLAN.x=0;PLAN.y=0;applyPlanTransform();
  bindPlanEvents();
  return {matched:matched,unmatched:unmatched,missing:missing,plan:plan};
}
function applyPlanTransform(){
  var v=$('planview'); if(!v)return;
  v.style.transform='translate('+Math.round(PLAN.x)+'px,'+Math.round(PLAN.y)+'px) scale('+PLAN.scale.toFixed(3)+')';
}
function planZoom(f){PLAN.scale=Math.min(6,Math.max(0.4,PLAN.scale*f));applyPlanTransform();}
function planResetZoom(){PLAN.scale=1;PLAN.x=0;PLAN.y=0;applyPlanTransform();}
function bindPlanEvents(){
  if(PLAN.bound)return; PLAN.bound=true;
  document.addEventListener('pointerdown',function(e){
    var w=e.target.closest&&e.target.closest('#planwrap');
    if(!w||(e.target.closest&&e.target.closest('.planzoom')))return;
    if(PLAN.scale<=1)return;
    PLAN.drag=true;PLAN.sx=e.clientX;PLAN.sy=e.clientY;PLAN.ox=PLAN.x;PLAN.oy=PLAN.y;
    var v=$('planview');if(v)v.classList.add('grabbing');
  });
  document.addEventListener('pointermove',function(e){
    if(!PLAN.drag)return;
    PLAN.x=PLAN.ox+(e.clientX-PLAN.sx);PLAN.y=PLAN.oy+(e.clientY-PLAN.sy);applyPlanTransform();});
  document.addEventListener('pointerup',function(){
    if(!PLAN.drag)return;PLAN.drag=false;
    var v=$('planview');if(v)v.classList.remove('grabbing');});
  document.addEventListener('wheel',function(e){
    var w=e.target.closest&&e.target.closest('#planwrap');
    if(!w||(!e.ctrlKey&&!e.metaKey))return;
    e.preventDefault();planZoom(e.deltaY<0?1.12:0.89);},{passive:false});
}
</script>

<script>
'use strict';
/* ============================================================================
   VIEWS, part 1 — dashboard, projects, floor plan, units, merchandise mix.
   ========================================================================= */
function h(x){return esc(x);}
function userName(id){var u=byId(S.users,id);return u?u.name:'—';}
function projName(id){var p=byId(S.projects,id);return p?p.name:'—';}
function floorName(id){var f=byId(S.floors,id);return f?t(f.name):'—';}
function unitLabel(id){var u=byId(S.units,id);return u?u.unitNumber:'—';}
function brandName(id){var b=byId(S.brands,id);return b?b.name:'—';}
function statusChip(u){
  var ds=svcDisplayStatus(u);
  return '<span class="chip" style="background:'+ds.color+';color:'+contrastInk(ds.color)+'">'+
    h(t(ds.label))+(ds.derived?' <span style="opacity:.75">'+t('(deal)')+'</span>':'')+'</span>';
}
function stageChip(d){
  var s=stageDef(d.type,d.stage);
  return '<span class="chip" style="background:'+s.color+';color:'+contrastInk(s.color)+'">'+h(t(s.label))+'</span>';
}
function kpi(k,v,d,go){
  return '<div class="kpi'+(go?' click':'')+'"'+(go?' data-go="'+go+'"':'')+'><div class="k">'+h(k)+'</div>'+
    '<div class="v'+(v==='n/a'?' na':'')+'">'+v+'</div>'+(d?'<div class="d">'+d+'</div>':'')+'</div>';
}
function projectPicker(){
  var vis=svcVisibleProjects();
  var opts='<option value="">'+h(t('All projects'))+' ('+vis.length+')</option>'+
    vis.map(function(p){return '<option value="'+p.id+'"'+(UI.project===p.id?' selected':'')+'>'+h(p.name)+'</option>';}).join('');
  $('projPick').innerHTML=opts;
}
function areaBar(inv){
  var tot=inv.totalGLA||1;
  return '<div class="bar" style="height:14px">'+inv.buckets.map(function(b){
    var w=b.gla/tot*100;
    return w>0?'<i style="width:'+w.toFixed(2)+'%;background:'+b.color+'" title="'+h(b.label+': '+fmt(b.gla,1)+' '+sqm())+'"></i>':'';
  }).join('')+'</div>';
}

/* ---------------------------------------------------------------- dashboard */
function viewDash(){
  var inv=svcInventory(), lp=svcPipeline('Leasing'), sp=svcPipeline('Sales');
  var over=svcOverdueTasks(), todayT=svcTasksDue('today'), week=svcTasksDue('week');

  }).join('')+'<p class="sub" style="margin:6px 0 0">'+t('Top bar: actual. Bottom bar: target. Actual counts leased and sold units only.')+'</p>';
}
