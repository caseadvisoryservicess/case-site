   '</div>'+
   (chips.length?('<div style="margin-top:4px">'+chips.map(function(c){
     return '<span class="chip" style="background:var(--soft);border-color:var(--border);margin-right:4px">'+h(c[1])+
     ' <button class="x" style="font-size:13px" data-act="clearFilter" data-id="'+c[0]+'">×</button></span>';}).join('')+
     '<button class="btn ghost sm" data-act="resetFilters">'+t('Reset all')+'</button></div>'):'')+
   '</div>';
  html+='<div class="tw"><table><thead><tr>'+
    '<th data-act="sortUnits" data-id="unitNumber" style="cursor:pointer">'+t('Unit')+'</th><th>'+t('Floor')+'</th>'+
    '<th data-act="sortUnits" data-id="area" class="num" style="cursor:pointer">'+t('GLA m²')+'</th>'+
    '<th data-act="sortUnits" data-id="status" style="cursor:pointer">'+t('Status')+'</th>'+
    '<th>'+t('Prospects')+'</th><th>'+t('Target')+'</th><th>'+t('Actual / tenant')+'</th>'+
    (canSeeFinance()?'<th data-act="sortUnits" data-id="rent" class="num" style="cursor:pointer">'+t('Asking')+'</th>':'')+
    '<th>'+t('Manager')+'</th><th>'+t('Next action')+'</th></tr></thead><tbody>';
  filtered.forEach(function(u){
    var ds=svcDisplayStatus(u), open=openDealsFor(u.id);
    html+='<tr class="click" data-act="openUnit" data-id="'+u.id+'">'+
      '<td class="nowrap"><b>'+h(u.unitNumber)+'</b></td><td>'+h(floorName(u.floorId))+'</td>'+
      '<td class="num">'+(u.area.glaM2==null?'<span class="sev amber">n/a</span>':fmt(u.area.glaM2,1))+'</td>'+
      '<td>'+statusChip(u)+'</td>'+
      '<td>'+(open.length?('<span class="tag">'+open.length+'</span> '+h(open.slice(0,2).map(function(d){return brandName(d.brandId);}).join(', '))+(open.length>2?'…':'')):'<span style="color:var(--muted)">—</span>')+'</td>'+
      '<td>'+(u.targetUse&&u.targetUse.category?h(catLabel(u.targetUse.category)):'<span class="sev amber">—</span>')+'</td>'+
      '<td>'+(u.actualUse&&u.actualUse.tenantName?h(u.actualUse.tenantName):'<span style="color:var(--muted)">—</span>')+'</td>'+
      (canSeeFinance()?('<td class="num">'+(u.leasingTerms&&u.leasingTerms.askingRent!=null?fmt(u.leasingTerms.askingRent,1):
        (u.salesTerms&&u.salesTerms.askingPrice!=null?money(u.salesTerms.askingPrice):'—'))+'</td>'):'')+
      '<td>'+h(userName(u.responsibility&&u.responsibility.responsibleManagerId))+'</td>'+
      '<td>'+(u.operational&&u.operational.nextAction?
        (h(t(u.operational.nextAction))+'<br><span style="font-size:10.5px" class="'+
         (u.operational.nextActionDate&&u.operational.nextActionDate<today()?'sev red':'')+'">'+
         dateRU(u.operational.nextActionDate)+'</span>'):'<span style="color:var(--muted)">—</span>')+'</td></tr>';
  });
  html+='</tbody></table></div>';
  if(!filtered.length)html+='<div class="empty">'+t('No units match the filters.')+'</div>';
  return html;
}

/* ---------------------------------------------------------------- mix view */
var MIXBASIS='gla';
function viewMix(){
  var mix=svcMix(null,MIXBASIS);
  var html='<div class="ph"><h1>'+t('Merchandise mix')+'</h1><span class="tag">'+
    (UI.project?h(projName(UI.project)):h(t('All projects')))+'</span><span class="spacer"></span>'+
    '<button class="btn ghost sm noprint" data-act="print">⎙ '+t('Print')+'</button></div>'+
    '<p class="sub">'+t('Target mix comes from the project plan; actual counts leased and sold units only.')+'</p>'+
    '<div class="tabs noprint">'+
    '<button data-act="mixBasis" data-id="gla" class="'+(MIXBASIS==='gla'?'on':'')+'">'+t('By GLA')+'</button>'+
    '<button data-act="mixBasis" data-id="units" class="'+(MIXBASIS==='units'?'on':'')+'">'+t('By unit count')+'</button></div>';
  html+='<div class="card"><h2>'+t('Target vs actual')+'</h2>'+mixRows(mix)+'</div>';
  html+='<div class="card"><h2>'+t('Detail')+'</h2><div class="tw"><table><thead><tr><th>'+t('Category')+'</th>'+
    '<th class="num">'+t('Target units')+'</th><th class="num">'+t('Target GLA')+'</th>'+
    '<th class="num">'+t('Actual units')+'</th><th class="num">'+t('Actual GLA')+'</th>'+
    '<th class="num">'+t('Actual share')+'</th><th class="num">'+t('Target share')+'</th><th class="num">'+t('Gap')+'</th>'+
    '<th class="num">'+t('Vacant GLA')+'</th><th class="num">'+t('Pipeline GLA')+'</th></tr></thead><tbody>';
  mix.rows.forEach(function(r){
    html+='<tr><td><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+r.cat.color+'"></span> '+h(t(r.cat.label))+'</td>'+
      '<td class="num">'+r.targetUnits+'</td><td class="num">'+fmt(r.targetGLA,0)+'</td>'+
      '<td class="num">'+r.actualUnits+'</td><td class="num">'+fmt(r.actualGLA,0)+'</td>'+
      '<td class="num">'+(r.actualSharePct==null?'n/a':fmt(r.actualSharePct,1)+'%')+'</td>'+
      '<td class="num">'+(r.plannedSharePct==null?'n/a':fmt(r.plannedSharePct,1)+'%')+'</td>'+
      '<td class="num '+(r.gapPct!=null&&Math.abs(r.gapPct)>=3?(r.gapPct<0?'sev red':'sev amber'):'')+'">'+
        (r.gapPct==null?'n/a':(r.gapPct>0?'+':'')+fmt(r.gapPct,1))+'</td>'+
      '<td class="num">'+fmt(r.vacantGLA,0)+'</td><td class="num">'+fmt(r.pipelineGLA,0)+'</td></tr>';
  });
  html+='</tbody></table></div>'+
   '<p class="sub" style="margin-top:6px">'+t('Under-represented categories (gap below −3 pp) are leasing priorities; over-represented categories should not receive further units without a decision.')+'</p></div>';
  return html;
}
</script>

<script>
'use strict';
/* ============================================================================
   VIEWS, part 2 — pipelines, CRM, work, documents, and the drawers.
   ========================================================================= */

/* ---------------------------------------------------------------- pipelines */
function viewPipeline(type){
  var pl=svcPipeline(type);
  var all=svcDeals(null,type);
  var lost=all.filter(function(d){return stageDef(d.type,d.stage).type==='lost';});
  var won=all.filter(function(d){return stageDef(d.type,d.stage).type==='won';});
  var html='<div class="ph"><h1>'+h(type==='Sales'?t('Sales pipeline'):t('Leasing pipeline'))+'</h1>'+
    '<span class="tag">'+pl.deals.length+' '+t('open')+'</span><span class="spacer"></span>'+
    '<div class="tabs noprint" style="margin:0;border:0;padding:0">'+
    '<button data-act="pipeView" data-id="kanban" class="'+(UI.pipelineView==='kanban'?'on':'')+'">'+t('Kanban')+'</button>'+
    '<button data-act="pipeView" data-id="table" class="'+(UI.pipelineView==='table'?'on':'')+'">'+t('Table')+'</button></div>'+
    (canEdit()?'<button class="btn sm noprint" data-act="newDeal" data-id="'+type+'">+ '+t('Deal')+'</button>':'')+'</div>'+
    '<p class="sub">'+h(t(pl.note))+'</p>';
  html+='<div class="kpis">'+
    kpi(t('Open deals'),String(pl.deals.length),won.length+' '+t('won')+' · '+lost.length+' '+t('lost'))+
    kpi(t('Pipeline area'),fmt(pl.totalArea,0)+' '+sqm(),t('deal-based, may repeat a unit'))+
    (canSeeFinance()?kpi(t('Pipeline value'),money(pl.totalValue),(type==='Sales'?t('price basis'):t('annualised rent'))+
      (pl.valueUnknown?(' · '+pl.valueUnknown+' '+t('deal(s) without value')):'')):'')+
    (canSeeFinance()?kpi(t('Weighted value'),money(pl.weighted),t('value × stage probability')):'')+
  '</div>';
  if(UI.pipelineView==='kanban'){
    html+='<div class="kan">';
    stageList(type).filter(function(s){return s.type==='open';}).forEach(function(s){
      var b=pl.byStage[s.key]||{deals:[],area:0,value:0};
      html+='<div class="kancol" data-stage="'+s.key+'" data-type="'+type+'">'+
        '<h4><span><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+s.color+'"></span> '+
        h(t(s.label))+'</span><span>'+b.deals.length+' · '+fmt(b.area,0)+' m²</span></h4>';
      b.deals.forEach(function(d){
        var v=svcValueBasis(d),age=svcStageAging(d);
        html+='<div class="kancard" draggable="'+(canEdit()?'true':'false')+'" data-act="openDeal" data-id="'+d.id+'">'+
          '<div class="t">'+h(brandName(d.brandId))+'</div>'+
          '<div class="m">'+h(d.unitIds.map(unitLabel).join(', '))+' · '+fmt(svcDealArea(d),0)+' m²</div>'+
          (canSeeFinance()&&v.value!=null?('<div class="m">'+money(v.value)+' <span class="tag">'+h(t(v.basis))+'</span></div>'):'')+
          '<div class="m">'+h(userName(d.ownership.responsibleManagerId))+
          (age!=null?(' · '+age+' '+t('d in stage')):'')+'</div>'+
          (d.nextAction&&d.nextAction.text?('<div class="m '+((d.nextAction.dueDate&&d.nextAction.dueDate<today())?'sev red':'')+'">▸ '+
            h(t(d.nextAction.text))+(d.nextAction.dueDate?(' · '+dateRU(d.nextAction.dueDate)):'')+'</div>'):
            '<div class="m sev amber">▸ '+t('no next action')+'</div>')+
          '</div>';
      });
      html+='</div>';
    });
    html+='</div>';
  } else {
    html+='<div class="tw"><table><thead><tr><th>'+t('Brand')+'</th><th>'+t('Units')+'</th><th class="num">'+t('Area m²')+'</th>'+
      '<th>'+t('Stage')+'</th><th class="num">'+t('Days')+'</th>'+(canSeeFinance()?'<th class="num">'+t('Value')+'</th><th class="num">'+t('Weighted')+'</th>':'')+
      '<th>'+t('Manager')+'</th><th>'+t('Next action')+'</th><th>'+t('Project')+'</th></tr></thead><tbody>';
    sortBy(all,function(d){return -rankOf(d.type,d.stage);}).forEach(function(d){
      var v=svcValueBasis(d),p=svcDealProbability(d);
      html+='<tr class="click" data-act="openDeal" data-id="'+d.id+'">'+
        '<td><b>'+h(brandName(d.brandId))+'</b></td>'+
        '<td>'+h(d.unitIds.map(unitLabel).join(', '))+'</td>'+
        '<td class="num">'+fmt(svcDealArea(d),0)+'</td>'+
        '<td>'+stageChip(d)+(d.outcome&&d.outcome.lostReason?('<br><span style="font-size:10.5px;color:var(--muted)">'+
          h(t((CONFIG().lostReasons.filter(function(r){return r.key===d.outcome.lostReason;})[0]||{}).label||d.outcome.lostReason))+'</span>'):'')+'</td>'+
        '<td class="num">'+(svcStageAging(d)==null?'—':svcStageAging(d))+'</td>'+
        (canSeeFinance()?('<td class="num">'+(v.value==null?'n/a':money(v.value))+'</td>'+
          '<td class="num">'+(v.value==null?'n/a':money(v.value*p/100))+'</td>'):'')+
        '<td>'+h(userName(d.ownership.responsibleManagerId))+'</td>'+
        '<td>'+(d.nextAction&&d.nextAction.text?h(t(d.nextAction.text)):'<span class="sev amber">—</span>')+'</td>'+
        '<td>'+h(projName(d.projectId))+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  /* stage funnel + lost reasons */
  html+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">';
  html+='<div class="card"><h2>'+t('Conversion')+'</h2>';
  var conv=svcConversion(type);
  var top=conv.length?conv[0].count:0;
  conv.forEach(function(c){
    html+='<div class="mixrow"><span class="lbl">'+h(t(c.stage.label))+'</span>'+
      '<span class="bar"><i style="width:'+(top?c.count/top*100:0).toFixed(1)+'%;background:'+c.stage.color+'"></i></span>'+
      '<span class="val num">'+c.count+(top?(' · '+fmt(pct(c.count,top),0)+'%'):'')+'</span></div>';});
  html+='</div>';
  html+='<div class="card"><h2>'+t('Closed lost reasons')+'</h2>';
  if(!lost.length)html+='<div class="empty">'+t('No lost deals recorded.')+'</div>';
  else{
    var byReason={};
    lost.forEach(function(d){var k=d.outcome.lostReason||'other';byReason[k]=(byReason[k]||0)+1;});
    html+='<ul class="list">'+Object.keys(byReason).map(function(k){
      var lr=CONFIG().lostReasons.filter(function(r){return r.key===k;})[0];
      return '<li><span style="flex:1">'+h(lr?t(lr.label):k)+'</span><b>'+byReason[k]+'</b></li>';}).join('')+'</ul>';
  }
  html+='</div></div>';
  return html;
}

/* ---------------------------------------------------------------- CRM */
function viewBrands(){
  var q=(UI.brandQ||'').toLowerCase();
  var list=S.brands.filter(function(b){return !q||b.name.toLowerCase().indexOf(q)>=0||
    catLabel(b.classification.category).toLowerCase().indexOf(q)>=0;});
  var html='<div class="ph"><h1>'+h(t('Brands'))+'</h1><span class="tag">'+list.length+'</span>'+
    '<span class="spacer"></span><input data-filter="brandQ" placeholder="'+h(t('Filter brands…'))+'" value="'+h(UI.brandQ||'')+'" style="width:190px">'+
    (canEdit()?'<button class="btn sm" data-act="newBrand">+ '+t('Brand')+'</button>':'')+'</div>'+
    '<p class="sub">'+t('The brand database is the long-term commercial asset: requirements, contacts, and history of every approach.')+'</p>';
  html+='<div class="tw"><table><thead><tr><th>'+t('Brand')+'</th><th>'+t('Category')+'</th><th>'+t('Company')+'</th><th>'+t('Origin')+'</th>'+
    '<th class="num">'+t('Area range')+'</th><th>'+t('Format')+'</th><th class="num">'+t('Deals')+'</th><th>'+t('Last contact')+'</th><th class="num">'+t('Complete')+'</th></tr></thead><tbody>';
  sortBy(list,function(b){return b.name;}).forEach(function(b){
    var c=svcBrandCompleteness(b),er=b.expansionRequirements||{};
    var last=b.relationship&&b.relationship.lastContactDate;
    var stale=last?daysAgo(last)>CONFIG().thresholds.staleBrandDays:true;
    html+='<tr class="click" data-act="openBrand" data-id="'+b.id+'">'+
      '<td><b>'+h(b.name)+'</b></td>'+
      '<td><span class="chip" style="background:'+catDef(b.classification.category).color+';color:'+
        contrastInk(catDef(b.classification.category).color)+'">'+h(catLabel(b.classification.category))+'</span></td>'+
      '<td>'+h((byId(S.companies,b.companyId)||{}).legalName||'—')+'</td>'+
      '<td>'+h(b.countryOfOrigin||'')+'</td>'+
      '<td class="num">'+(er.minimumAreaM2!=null?fmt(er.minimumAreaM2)+'–'+fmt(er.maximumAreaM2):'n/a')+'</td>'+
      '<td>'+h(b.classification.format||'')+'</td>'+
      '<td class="num">'+arr(b.history.dealIds).length+'</td>'+
      '<td class="'+(stale?'sev amber':'')+'">'+(last?dateRU(last):t('never'))+'</td>'+
      '<td class="num">'+c.score+'%</td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}
function viewCompanies(){
  var html='<div class="ph"><h1>'+h(t('Companies'))+'</h1><span class="tag">'+S.companies.length+'</span></div>'+
    '<p class="sub">'+t('One company may own several brands. Brands are never duplicated as companies.')+'</p>'+
    '<div class="tw"><table><thead><tr><th>'+t('Company')+'</th><th>'+t('Country')+'</th><th>'+t('Industry')+'</th><th>'+t('Brands')+'</th>'+
    '<th class="num">'+t('Contacts')+'</th><th>'+t('Manager')+'</th></tr></thead><tbody>';
  S.companies.forEach(function(c){
    html+='<tr><td><b>'+h(c.legalName)+'</b></td><td>'+h(c.country||'')+'</td><td>'+h(t(c.industry||''))+'</td>'+
      '<td>'+arr(c.brandIds).map(function(id){
        return '<span class="tag" style="cursor:pointer" data-act="openBrand" data-id="'+id+'">'+h(brandName(id))+'</span>';}).join(' ')+'</td>'+
      '<td class="num">'+arr(c.contactIds).length+'</td><td>'+h(userName(c.responsibleManagerId))+'</td></tr>';});
  html+='</tbody></table></div>';
  return html;
}
function viewContacts(){
  var html='<div class="ph"><h1>'+h(t('Contacts'))+'</h1><span class="tag">'+S.contacts.length+'</span></div>'+
    '<p class="sub">'+t('One contact may serve several brands and one company.')+'</p>'+
    '<div class="tw"><table><thead><tr><th>'+t('Name')+'</th><th>'+t('Position')+'</th><th>'+t('Company')+'</th><th>'+t('Brands')+'</th>'+
    '<th>'+t('Phone')+'</th><th>'+t('Email')+'</th><th>'+t('City')+'</th><th>'+t('Owner')+'</th></tr></thead><tbody>';
  S.contacts.forEach(function(c){
    html+='<tr><td><b>'+h(c.firstName+' '+c.lastName)+'</b></td><td>'+h(c.position||'')+'</td>'+
      '<td>'+h((byId(S.companies,c.companyId)||{}).legalName||'—')+'</td>'+
      '<td>'+arr(c.brandIds).map(function(id){return h(brandName(id));}).join(', ')+'</td>'+
      '<td>'+h(arr(c.phones)[0]||'')+'</td><td>'+h(arr(c.emails)[0]||'')+'</td>'+
      '<td>'+h(c.city||'')+'</td><td>'+h(userName(c.relationshipOwnerId))+'</td></tr>';});
  html+='</tbody></table></div>';
  return html;
}
function viewRequirements(){
  var html='<div class="ph"><h1>'+h(t('Requirements'))+'</h1><span class="tag">'+S.requirements.length+'</span></div>'+
    '<p class="sub">'+t('A requirement exists before any specific unit: brand → requirement → opportunity → unit(s).')+'</p>'+
    '<div class="tw"><table><thead><tr><th>'+t('Brand')+'</th><th>'+t('Requirement')+'</th><th class="num">'+t('Area')+'</th>'+
    '<th>'+t('Projects')+'</th><th>'+t('Status')+'</th><th>'+t('Owner')+'</th><th>'+t('Matches')+'</th></tr></thead><tbody>';
  S.requirements.forEach(function(r){
    var b=byId(S.brands,r.brandId);
    var matches=b?svcSuggestUnitsForBrand(b,3).filter(function(m){return m.score>=60&&!m.blockers.length;}):[];
    html+='<tr><td><b>'+h(brandName(r.brandId))+'</b></td><td>'+h(t(r.text))+'</td>'+
      '<td class="num">'+(r.minAreaM2!=null?fmt(r.minAreaM2)+'–'+fmt(r.maxAreaM2):'n/a')+'</td>'+
      '<td>'+arr(r.projectIds).map(projName).join(', ')+'</td><td>'+h(t('status:'+r.status))+'</td>'+
      '<td>'+h(userName(r.ownerId))+'</td>'+
      '<td>'+(matches.length?matches.map(function(m){
        return '<span class="tag" style="cursor:pointer" data-act="openUnit" data-id="'+m.unit.id+'">'+
          h(m.unit.unitNumber)+' ('+m.score+'%)</span>';}).join(' '):'<span style="color:var(--muted)">—</span>')+'</td></tr>';});
  html+='</tbody></table></div>';
  return html;
}

/* ---------------------------------------------------------------- work */
function viewTasks(){
  var over=svcOverdueTasks(),tod=svcTasksDue('today'),week=svcTasksDue('week');
  var done=S.tasks.filter(function(t){return t.status==='Done';});
  function block(title,list,cls){
    if(!list.length)return '<div class="card"><h2>'+h(t(title))+' (0)</h2><div class="empty">'+t('Nothing here.')+'</div></div>';
    return '<div class="card"><h2>'+h(t(title))+' ('+list.length+')</h2><ul class="list">'+list.map(function(tk){
      return '<li><span style="flex:1"><b>'+h(t(tk.title))+'</b><br><span style="font-size:10.5px;color:var(--muted)">'+
        h(userName(tk.assigneeId))+(tk.projectId?' · '+h(projName(tk.projectId)):'')+
        ' · <span class="'+(cls||'')+'">'+dateRU(tk.dueDate)+'</span>'+
        (tk.priority==='High'?' · <span class="sev red">'+t('High')+'</span>':'')+
        (tk.visibility==='client_visible'?' · <span class="tag">'+t('shared with the owner')+'</span>':'')+'</span></span>'+
        (canEdit()?('<button class="btn ghost sm" data-act="doneTask" data-id="'+tk.id+'">'+t('Done')+'</button>'+
         '<button class="btn ghost sm" data-act="snoozeTask" data-id="'+tk.id+'">+7d</button>'):'')+'</li>';}).join('')+'</ul></div>';
  }
  var html='<div class="ph"><h1>'+h(t('Tasks'))+'</h1><span class="spacer"></span>'+
    (canEdit()?'<button class="btn sm" data-act="newTask">+ '+t('Task')+'</button>':'')+'</div>'+
    '<p class="sub">'+t('One click to complete or to move a task by a week.')+'</p>';
  html+=block('Overdue',over,'sev red')+block('Due today',tod,'sev amber')+block('Next 7 days',week,'');
  html+='<div class="card"><h2>'+t('Completed')+' ('+done.length+')</h2>'+(done.length?('<ul class="list">'+
    done.slice(-6).map(function(tk){return '<li><span style="flex:1">'+h(t(tk.title))+'</span><span class="tag">'+t('done')+'</span></li>';}).join('')+'</ul>'):'<div class="empty">'+t('None yet.')+'</div>')+'</div>';
  return html;
}
function viewActivities(){
  var ids=svcProjectScope();
  var list=sortBy(S.activities.filter(function(a){return !a.projectId||ids.indexOf(a.projectId)>=0;}),
    function(a){return a.at;},-1);
  var html='<div class="ph"><h1>'+h(t('Activities'))+'</h1><span class="tag">'+list.length+'</span>'+
    '<span class="spacer"></span>'+(canEdit()?'<button class="btn sm" data-act="newActivity">+ '+t('Activity')+'</button>':'')+'</div>'+
    '<p class="sub">'+t('Calls, meetings, viewings, stage and status changes, comments and uploads.')+'</p><div class="card"><ul class="tl">';
  list.slice(0,60).forEach(function(a){

function openUnitDrawer(unitId){
  var u=byId(S.units,unitId); if(!u)return;
  PLAN.selected=unitId;
  document.querySelectorAll('svg .unit.sel').forEach(function(el){el.classList.remove('sel');});
  var el=document.querySelector('[data-unit-id="'+unitId+'"]'); if(el)el.classList.add('sel');
  if(isClient())return openClientUnitDrawer(u);
  var ds=svcDisplayStatus(u), deals=dealsFor(u.id), open=openDealsFor(u.id);
  var comp=svcUnitCompleteness(u);
  var acts=S.activities.filter(function(a){return a.unitId===u.id||
    (a.dealId&&deals.some(function(d){return d.id===a.dealId;}));});
  var docs=S.documents.filter(function(d){return d.unitId===u.id||
    (d.dealId&&deals.some(function(x){return x.id===d.dealId;}));});
  var hist=S.statusHistory.filter(function(x){return x.entity==='unit'&&x.refId===u.id;});
  var lt=u.leasingTerms||{},st2=u.salesTerms||{};
  var html='<header><div style="flex:1"><h1>'+h(u.unitNumber)+' '+statusChip(u)+'</h1>'+
    '<div class="sub" style="margin:2px 0 0">'+h(projName(u.projectId))+' · '+h(floorName(u.floorId))+
    ' · '+(u.area.glaM2==null?'<span class="sev amber">area unknown</span>':fmt(u.area.glaM2,1)+' '+sqm()+' GLA')+
    ' '+provChip(u.provenance&&u.provenance.glaM2,'area')+'</div></div>'+
    '<button class="x" data-act="closeDrawer" aria-label="'+h(t('Close'))+'">×</button></header><div class="body">';
  /* summary */
  html+='<div class="sec"><h3>'+t('Summary')+'</h3><div class="tw"><table><tbody>'+
    row(t('Target use'),(u.targetUse&&u.targetUse.category?catLabel(u.targetUse.category):'<span class="sev amber">'+t(t('not set'))+'</span>')+
      (u.targetUse&&u.targetUse.subcategory?(' · '+h(u.targetUse.subcategory)):''))+
    row(t('Actual use'),u.actualUse&&u.actualUse.tenantName?(h(u.actualUse.tenantName)+' · '+h(catLabel(u.actualUse.category))):'—')+
    row(t('Responsible'),h(userName(u.responsibility&&u.responsibility.responsibleManagerId)))+
    row(t('Mode'),h(u.commercialMode||'leasing'))+
    row(t('Completeness'),comp.score+'% <span style="font-size:10.5px;color:var(--muted)">'+
      comp.checks.filter(function(c){return !c.ok;}).map(function(c){return 'missing: '+c.k;}).join(', ')+'</span>')+
    '</tbody></table></div></div>';
  /* commercial */
  if(canSeeFinance()){
    html+='<div class="sec"><h3>'+t('Commercial')+'</h3><div class="tw"><table><tbody>';
    if(u.commercialMode!=='sales'){
      html+=row(t('Asking rent'),(lt.askingRent!=null?fmt(lt.askingRent,1)+' '+h(lt.rentUnit||''):'n/a')+' '+
        provChip(u.provenance&&u.provenance.askingRent,'asking'));
      html+=row(t('Agreed rent'),(lt.agreedRent!=null?fmt(lt.agreedRent,1)+' '+h(lt.rentUnit||''):'—')+' '+
        (u.provenance&&u.provenance.agreedRent?provChip(u.provenance.agreedRent,'agreed'):''));
      html+=row(t('Service charge'),lt.serviceCharge!=null?fmt(lt.serviceCharge,1):'n/a');
      html+=row(t('Lease term'),h(lt.leaseTerm||'—'));
    }
    if(u.commercialMode!=='leasing'){
      html+=row(t('Asking price'),(st2.askingPrice!=null?money(st2.askingPrice):'n/a')+' '+
        provChip(u.provenance&&u.provenance.askingPrice,'asking'));
      html+=row(t('Price per m²'),st2.pricePerM2!=null?money(st2.pricePerM2):'n/a');
    }
    html+='</tbody></table></div></div>';
  }
  /* deals */
  html+='<div class="sec"><h3>'+t('Deals')+' ('+deals.length+')</h3>';
  if(!deals.length)html+='<div class="empty">'+t('No deal linked yet.')+'</div>';

    var v=svcValueBasis(d);
    return '<li style="cursor:pointer" data-act="openDeal" data-id="'+d.id+'"><span style="flex:1"><b>'+h(brandName(d.brandId))+'</b> '+stageChip(d)+
      '<br><span style="font-size:10.5px;color:var(--muted)">'+h(t(d.type))+
      (d.unitIds.length>1?(' · '+t('multi-unit')+': '+h(d.unitIds.map(unitLabel).join(' + '))):'')+
      (canSeeFinance()&&v.value!=null?(' · '+money(v.value)+' ('+h(t(v.basis))+')'):'')+
      (d.nextAction&&d.nextAction.text?(' · ▸ '+h(t(d.nextAction.text))):'')+'</span></span></li>';}).join('')+'</ul>';
  if(open.length>1)html+='<div class="banner info" style="margin-top:6px">'+open.length+' '+plural(open.length,'prospect')+' '+t('are competing for this unit. Its area is counted once in inventory metrics.')+'</div>';
  html+='</div>';
  /* suggestions */
  var sugg=svcSuggestBrandsForUnit(u,4);
  html+='<div class="sec"><h3>'+t('Suggested brands')+'</h3><ul class="list">'+sugg.map(function(s){
    return '<li style="cursor:pointer" data-act="openBrand" data-id="'+s.brand.id+'"><span style="flex:1">'+
      h(s.brand.name)+' <span class="tag">'+s.score+'%</span>'+
      '<br><span style="font-size:10.5px;color:var(--muted)">'+h(s.why.slice(0,2).join(' · '))+
      (s.blockers.length?('<br><span class="sev amber">'+h(s.blockers.join(' · '))+'</span>'):'')+'</span></span></li>';}).join('')+
    '</ul><p class="sub" style="margin:4px 0 0">'+t('Deterministic match on category, area, subcategory, availability and format. A suggestion is not a recommendation.')+'</p></div>';
  /* timeline */
  html+='<div class="sec"><h3>'+t('Activity & history')+'</h3><ul class="tl">'+
    hist.map(function(x){return '<li class="hi"><b>Status</b> '+h(x.from||'—')+' → '+h(x.to)+
      '<div class="w">'+dateRU(x.at.slice(0,10))+' · '+h(userName(x.by))+(x.reason?' · '+h(t(x.reason)):'')+'</div></li>';}).join('')+
    acts.slice(-8).map(function(a){return '<li><b>'+h(t(a.type))+'</b> '+h(t(a.text))+
      '<div class="w">'+dateRU(a.at.slice(0,10))+' · '+h(userName(a.by))+'</div></li>';}).join('')+
    '</ul></div>';
  /* documents */
  html+='<div class="sec"><h3>'+t('Documents')+' ('+docs.length+')</h3>'+(docs.length?('<ul class="list">'+
    docs.map(function(d){return '<li><span style="flex:1">'+h(d.fileName)+'<br><span style="font-size:10.5px;color:var(--muted)">'+
      h(t(d.category))+' · '+h(t(d.visibility))+'</span></span></li>';}).join('')+'</ul>'):'<div class="empty">'+t('None.')+'</div>')+'</div>';
  /* actions */
  if(canEdit()){
    html+='<div class="sec"><h3>'+t('Actions')+'</h3><div class="row">'+
      '<label class="f" style="flex:1;min-width:150px"><span>'+t('Change status')+'</span><select data-act="setUnitStatus" data-id="'+u.id+'">'+
      CONFIG().unitStatuses.map(function(s){return '<option value="'+s.key+'"'+(u.commercialStatus===s.key?' selected':'')+'>'+h(t(s.label))+'</option>';}).join('')+
      '</select></label>'+
      '<label class="f" style="flex:1;min-width:150px"><span>'+t('Next action')+'</span><input data-act="setUnitNext" data-id="'+u.id+'" value="'+
      h((u.operational&&u.operational.nextAction)||'')+'" placeholder="'+h(t('What happens next'))+'"></label>'+
      '<label class="f" style="width:140px"><span>'+t('Due')+'</span><input type="date" data-act="setUnitNextDate" data-id="'+u.id+'" value="'+
      h((u.operational&&u.operational.nextActionDate)||'')+'"></label></div>'+
      '<div class="row" style="margin-top:4px">'+
      '<button class="btn sm" data-act="newDealForUnit" data-id="'+u.id+'">+ '+t('Deal / prospect')+'</button>'+
      '<button class="btn ghost sm" data-act="newTaskForUnit" data-id="'+u.id+'">+ '+t('Task')+'</button>'+
      '<button class="btn ghost sm" data-act="newCommentForUnit" data-id="'+u.id+'">+ '+t('Comment')+'</button>'+
      '<button class="btn ghost sm" data-act="newDocForUnit" data-id="'+u.id+'">+ '+t('Register file')+'</button>'+
      '</div></div>';
  }
  html+='</div>';
  openDrawer(html);
}

  html+='<div class="sec"><h3>'+t('Documents')+' ('+docs.length+')</h3>'+(docs.length?('<ul class="list">'+docs.map(function(x){

      h(projName(d.projectId))+' · '+h(d.unitIds.map(unitLabel).join(', '))+' '+stageChip(d)+'</span></li>';}).join('')+'</ul>')
    :'<div class="empty">'+t('No deals yet.')+'</div>')+'</div>';
  html+='<div class="sec"><h3>'+t('Suggested units')+'</h3><ul class="list">'+sugg.map(function(s){
    return '<li style="cursor:pointer" data-act="openUnit" data-id="'+s.unit.id+'"><span style="flex:1">'+
      h(s.unit.unitNumber)+' · '+h(projName(s.unit.projectId))+' <span class="tag">'+s.score+'%</span>'+
      '<br><span style="font-size:10.5px;color:var(--muted)">'+h(s.why.slice(0,2).join(' · '))+
      (s.blockers.length?('<br><span class="sev amber">'+h(s.blockers.join(' · '))+'</span>'):'')+'</span></span></li>';}).join('')+'</ul></div>';
  if(canEdit())html+='<div class="sec"><div class="row">'+
    '<button class="btn sm" data-act="newDealForBrand" data-id="'+b.id+'">+ '+t('Opportunity')+'</button>'+
    '<button class="btn ghost sm" data-act="logBrandContact" data-id="'+b.id+'">'+t('Log contact today')+'</button></div></div>';
  html+='</div>';
  openDrawer(html);
}
</script>

<script>
'use strict';
/* ============================================================================
   VIEWS, part 3 — reports, client portal, settings, import/export, Ask.
   ========================================================================= */

/* ---------------------------------------------------------------- reports */
var REPORT_KIND='client';
function viewReports(){
  var html='<div class="ph"><h1>'+h(t('Reports'))+'</h1><span class="spacer"></span>'+
    '<button class="btn sm noprint" data-act="print">⎙ '+t('Print / Save as PDF')+'</button>'+
    '<button class="btn ghost sm noprint" data-act="snapshotReport">'+t('Save snapshot')+'</button></div>'+
    '<div class="tabs noprint">'+
    ['client','leasing','sales','activity','quality'].map(function(k){
      var lbl=t({client:'Client report',leasing:'Leasing (internal)',sales:'Sales (internal)',
        activity:'Activity report',quality:'Data quality'}[k]);
      if(k!=='client'&&isClient())return '';
      return '<button data-act="reportKind" data-id="'+k+'" class="'+(REPORT_KIND===k?'on':'')+'">'+h(lbl)+'</button>';}).join('')+'</div>';
  html+=REPORT_KIND==='client'?reportClient():
        REPORT_KIND==='leasing'?reportPipeline('Leasing'):
        REPORT_KIND==='sales'?reportPipeline('Sales'):
        REPORT_KIND==='activity'?reportActivity():reportQuality();
  return html;
}
function reportClient(){
  var ids=UI.project?[UI.project]:svcVisibleProjects().map(function(p){return p.id;});
  if(!ids.length)return '<div class="empty">'+t('No project selected.')+'</div>';
  var out='';
  ids.forEach(function(pid){
    var cv=svcClientView(pid); if(!cv)return;
    var prev=sortBy(S.reports.filter(function(r){return r.projectId===pid;}),function(r){return r.at;},-1)[0];
    out+='<div class="card"><h2>'+h(cv.project.name)+' — owner report</h2>'+
      '<p class="sub">'+t('Prepared')+' '+dateRU(today())+' · '+t('data as of')+' '+dateRU(cv.lastUpdated)+
      ' · '+t('commercial information approved for the owner only')+'.</p>';
    out+='<h3>'+t('Executive summary')+'</h3><p>'+
      t('Of')+' '+fmt(cv.kpis.totalGLA,0)+' '+sqm()+' '+t('measured lettable area')+', '+fmt(cv.kpis.leasedGLA+cv.kpis.soldGLA,0)+' '+sqm()+' ('+
      fpct(cv.kpis.leasedGLA+cv.kpis.soldGLA,cv.kpis.totalGLA)+') '+t('is committed')+', '+fmt(cv.kpis.negotiationGLA,0)+' '+sqm()+' ('+
      fpct(cv.kpis.negotiationGLA,cv.kpis.totalGLA)+') '+t('is in active negotiation and')+' '+fmt(cv.kpis.availableGLA,0)+' '+sqm()+' ('+
      fpct(cv.kpis.availableGLA,cv.kpis.totalGLA)+') '+t('remains available')+'. '+
      cv.kpis.signedDeals+' '+t('agreement(s) signed to date')+'; '+cv.kpis.activeNegotiations+' '+t('negotiation(s) are live')+'.'+
      (cv.kpis.unitsWithoutArea?(' '+cv.kpis.unitsWithoutArea+' '+t('unit(s) have no recorded area and are excluded from these figures.')):'')+
      '</p>';
    out+='<div class="kpis">'+
      kpi(t('Total GLA'),fmt(cv.kpis.totalGLA,0)+' '+sqm(),t('measured from units'))+
      kpi(t('Leased'),fmt(cv.kpis.leasedGLA,0)+' '+sqm(),fpct(cv.kpis.leasedGLA,cv.kpis.totalGLA))+
      (cv.kpis.soldGLA?kpi(t('Sold'),fmt(cv.kpis.soldGLA,0)+' '+sqm(),fpct(cv.kpis.soldGLA,cv.kpis.totalGLA)):'')+
      kpi(t('In negotiation'),fmt(cv.kpis.negotiationGLA,0)+' '+sqm(),fpct(cv.kpis.negotiationGLA,cv.kpis.totalGLA))+
      kpi(t('Available'),fmt(cv.kpis.availableGLA,0)+' '+sqm(),fpct(cv.kpis.availableGLA,cv.kpis.totalGLA))+
      kpi(t('Signed agreements'),String(cv.kpis.signedDeals),t('to date'))+'</div>';
    if(prev){
      var dLeased=cv.kpis.leasedGLA-(prev.kpis&&prev.kpis.leasedGLA||0);
      out+='<h3>'+t('Change since the previous report')+' ('+dateRU(prev.at.slice(0,10))+')</h3><p>'+
        'Leased area '+(dLeased>=0?'increased':'decreased')+' by '+fmt(Math.abs(dLeased),0)+' m². '+
        'Signed agreements: '+(prev.kpis?prev.kpis.signedDeals:0)+' → '+cv.kpis.signedDeals+'.</p>';
    } else out+='<h3>'+t('Change since the previous report')+'</h3><p>'+t('No earlier snapshot is stored. Save a snapshot to start the comparison.')+'</p>';
    out+='<h3>'+t('Merchandise mix')+'</h3>'+cv.mix.filter(function(m){return m.actualGLA||m.plannedSharePct;}).map(function(m){
      var a=m.actualSharePct||0,p=m.plannedSharePct||0,max=Math.max(a,p,1);
      return '<div class="mixrow"><span class="lbl">'+h(t(m.category))+'</span>'+
        '<span class="bar"><i style="width:'+(a/max*100).toFixed(1)+'%;background:'+m.color+'"></i></span>'+
        '<span class="val num">'+(m.actualSharePct==null?'n/a':fmt(m.actualSharePct,1)+'%')+'</span></div>';}).join('');
    out+='<h3>'+t('Unit status')+'</h3><div class="tw"><table><thead><tr><th>'+t('Unit')+'</th><th>'+t('Floor')+'</th>'+
      '<th class="num">'+t('Area m²')+'</th><th>'+t('Status')+'</th><th>'+t('Category')+'</th><th>'+t('Tenant')+'</th></tr></thead><tbody>'+
      cv.units.map(function(u){
        return '<tr><td>'+h(u.unitNumber)+'</td><td>'+h(floorName(u.floorId))+'</td>'+
          '<td class="num">'+(u.areaM2==null?'n/a':fmt(u.areaM2,1))+'</td><td>'+h(t(u.status))+'</td>'+
          '<td>'+h(u.category||'—')+'</td><td>'+h(u.tenant||'—')+'</td></tr>';}).join('')+
      '</tbody></table></div>';
    var openC=cv.comments.filter(function(c){return c.status!=='Resolved'&&c.authorType==='client';});
    out+='<h3>'+t('Decisions required')+'</h3>'+(openC.length?('<ul class="list">'+openC.map(function(c){
      return '<li><span style="flex:1">'+h(t(c.text))+' <span class="tag">'+h(t('status:'+c.status))+'</span></span></li>';}).join('')+'</ul>')
      :'<p>No open questions from the owner.</p>');
    /* Only tasks explicitly approved for the owner: an internal task title is internal
       wording and would leak commissions, tactics and staff instructions. */
    var shared=S.tasks.filter(function(tk){
      return tk.projectId===pid&&tk.status!=='Done'&&tk.visibility==='client_visible';});
    out+='<h3>'+t('Next steps')+'</h3>'+(shared.length?('<ul class="list">'+shared.slice(0,6).map(function(tk){
        return '<li><span style="flex:1">'+h(t(tk.title))+' · '+dateRU(tk.dueDate)+'</span></li>';}).join('')+'</ul>')
      :'<p>No shared next steps are published for this period.</p>');
    out+='<p class="sub">'+t('This report excludes commissions, internal notes and negotiation detail.')+'</p></div>';
  });
  return out;
}
function reportPipeline(type){
  var pl=svcPipeline(type),inv=svcInventory();
  var out='<div class="card"><h2>'+h(type)+' — internal report</h2>'+
    '<p class="sub">'+t('Internal use only. Contains commercial and commission information.')+'</p>'+
    '<h3>'+t('GLA by status')+'</h3><div class="tw"><table><thead><tr><th>'+t('Bucket')+'</th><th class="num">'+t('GLA m²')+'</th>'+
    '<th class="num">'+t('Share')+'</th><th class="num">'+t('Units')+'</th></tr></thead><tbody>'+
    inv.buckets.map(function(b){return '<tr><td>'+h(t(b.label))+'</td><td class="num">'+fmt(b.gla,1)+'</td>'+
      '<td class="num">'+fpct(b.gla,inv.totalGLA)+'</td><td class="num">'+b.units+'</td></tr>';}).join('')+
    '<tr><td><b>Measured GLA</b></td><td class="num"><b>'+fmt(inv.totalGLA,1)+'</b></td><td class="num">100%</td>'+
    '<td class="num"><b>'+inv.unitsTotal+'</b></td></tr></tbody></table></div>';
  out+='<h3>'+t('Pipeline by stage')+'</h3><div class="tw"><table><thead><tr><th>'+t('Stage')+'</th><th class="num">'+t('Deals')+'</th>'+
    '<th class="num">'+t('Area m²')+'</th>'+(canSeeFinance()?'<th class="num">'+t('Value')+'</th><th class="num">'+t('Weighted')+'</th>':'')+
    '</tr></thead><tbody>';
  stageList(type).filter(function(s){return s.type==='open';}).forEach(function(s){
    var b=pl.byStage[s.key]; if(!b||!b.deals.length)return;
    out+='<tr><td>'+h(t(s.label))+'</td><td class="num">'+b.deals.length+'</td><td class="num">'+fmt(b.area,1)+'</td>'+
      (canSeeFinance()?('<td class="num">'+money(b.value)+'</td><td class="num">'+money(b.weighted)+'</td>'):'')+'</tr>';});
  out+='</tbody></table></div>';
  out+='<h3>'+t('Pipeline by manager')+'</h3><div class="tw"><table><thead><tr><th>'+t('Manager')+'</th><th class="num">'+t('Deals')+'</th>'+
    '<th class="num">'+t('Area m²')+'</th>'+(canSeeFinance()?'<th class="num">'+t('Weighted value')+'</th>':'')+'</tr></thead><tbody>';
  var byMgr={};
  pl.deals.forEach(function(d){
    var k=d.ownership.responsibleManagerId||'—';
    byMgr[k]=byMgr[k]||{n:0,a:0,w:0};
    byMgr[k].n++; byMgr[k].a+=n0(svcDealArea(d));
    var v=svcValueBasis(d); if(v.value!=null)byMgr[k].w+=v.value*svcDealProbability(d)/100;});
  Object.keys(byMgr).forEach(function(k){
    out+='<tr><td>'+h(userName(k))+'</td><td class="num">'+byMgr[k].n+'</td><td class="num">'+fmt(byMgr[k].a,1)+'</td>'+
      (canSeeFinance()?('<td class="num">'+money(byMgr[k].w)+'</td>'):'')+'</tr>';});
  out+='</tbody></table></div>';
  if(canSeeFinance()){
    var comm=svcDeals(null,type).filter(function(d){return d.commission;});
    out+='<h3>'+t('Commissions')+'</h3><div class="tw"><table><thead><tr><th>'+t('Deal')+'</th><th>'+t('Status')+'</th>'+
      '<th class="num">'+t('Gross')+'</th><th>'+t('Expected')+'</th><th>'+t('Received')+'</th></tr></thead><tbody>'+
      (comm.length?comm.map(function(d){
        return '<tr><td>'+h(brandName(d.brandId))+' · '+h(d.unitIds.map(unitLabel).join(', '))+'</td>'+
          '<td>'+h(d.commission.status)+'</td><td class="num">'+money(d.commission.grossCommission)+'</td>'+
          '<td>'+dateRU(d.commission.expectedPaymentDate)+'</td>'+
          '<td>'+(d.commission.receivedDate?dateRU(d.commission.receivedDate):'—')+'</td></tr>';}).join('')
        :'<tr><td colspan="5">No commission records.</td></tr>')+'</tbody></table></div>';
  }
  out+='</div>';
  return out;
}
function reportActivity(){
  var stale=svcStaleDeals(),noNext=svcNoNextAction(),over=svcOverdueTasks();
  var byMgr={};
  S.activities.forEach(function(a){byMgr[a.by]=(byMgr[a.by]||0)+1;});
  return '<div class="card"><h2>'+t('Activity report')+'</h2>'+
    '<div class="kpis">'+kpi(t('Overdue follow-ups'),String(over.length))+
    kpi(t('Deals without next action'),String(noNext.length))+
    kpi(t('Stale deals'),String(stale.length),'no activity > '+CONFIG().thresholds.staleDealDays+' days')+'</div>'+
    '<h3>'+t('Activities by user')+'</h3><div class="tw"><table><thead><tr><th>'+t('User')+'</th><th class="num">'+t('Records')+'</th></tr></thead><tbody>'+
    Object.keys(byMgr).map(function(k){return '<tr><td>'+h(userName(k))+'</td><td class="num">'+byMgr[k]+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<h3>'+t('Stale deals')+'</h3>'+(stale.length?('<div class="tw"><table><thead><tr><th>'+t('Brand')+'</th><th>'+t('Stage')+'</th>'+
      '<th>'+t('Units')+'</th><th class="num">'+t('Days idle')+'</th><th>'+t('Manager')+'</th></tr></thead><tbody>'+stale.map(function(d){
      return '<tr><td>'+h(brandName(d.brandId))+'</td><td>'+h(stgLabel(d.type,d.stage))+'</td>'+
        '<td>'+h(d.unitIds.map(unitLabel).join(', '))+'</td><td class="num">'+daysAgo(d.activity.lastContactDate)+'</td>'+
        '<td>'+h(userName(d.ownership.responsibleManagerId))+'</td></tr>';}).join('')+'</tbody></table></div>')
      :'<p>None.</p>')+'</div>';
}
function reportQuality(){
  return '<div class="card"><h2>'+t('Data quality report')+'</h2><div class="tw"><table><thead><tr><th>'+t('Check')+'</th>'+
    '<th class="num">'+t('Records')+'</th></tr></thead><tbody>'+svcHygiene().map(function(x){
      return '<tr><td>'+h(x.k)+'</td><td class="num '+(x.n?'sev amber':'')+'">'+x.n+'</td></tr>';}).join('')+
    '</tbody></table></div><p class="sub">'+t('Every figure is computed from the current data, not stored.')+'</p></div>';
}

/* ---------------------------------------------------------------- client portal */
function viewPortal(){
  /* internal preview of what a given client sees */
  var cl=S.clients[0];
  if(!UI.portalClient)UI.portalClient=cl?cl.id:'';
  var client=byId(S.clients,UI.portalClient);
  var html='<div class="ph"><h1>'+h(t('Client portal'))+' — '+t('preview')+'</h1><span class="spacer"></span>'+
    '<select data-act="portalClient">'+S.clients.map(function(c){
      return '<option value="'+c.id+'"'+(UI.portalClient===c.id?' selected':'')+'>'+h(c.name)+'</option>';}).join('')+'</select></div>'+
    '<div class="banner info">'+t('This is the read-only preview of the owner view. Replies to comments are posted from the internal comment list so the author is recorded correctly.')+'</div>';
  if(!client)return html+'<div class="empty">'+t('No client.')+'</div>';
  arr(client.projectIds).forEach(function(pid){ html+=clientProjectBlock(pid,true); });
  var comments=S.comments.filter(function(c){return arr(client.projectIds).indexOf(c.projectId)>=0;});
  html+='<div class="card"><h2>'+t('Comments from the owner')+'</h2>'+(comments.length?('<ul class="list">'+
    sortBy(comments,function(c){return c.at;},-1).map(function(c){
      return '<li><span style="flex:1">'+(c.authorType==='client'?'<b>'+h(userName(c.authorId))+'</b>':'<i>'+h(userName(c.authorId))+' ('+t('CASE team')+')</i>')+
        ': '+h(t(c.text))+'<br><span style="font-size:10.5px;color:var(--muted)">'+dateRU(c.at.slice(0,10))+
        (c.unitId?(' · unit '+h(unitLabel(c.unitId))):'')+' · '+h(projName(c.projectId))+'</span></span>'+
        '<span class="chip" style="background:'+(c.status==='Open'?'#f4c95d':c.status==='In Review'?'#73a8d4':'#cfe8d4')+
        ';color:#1b1b1b">'+h(t('status:'+c.status))+'</span>'+
        (canEdit()&&c.authorType==='client'&&c.status!=='Resolved'?
          ('<button class="btn ghost sm" data-act="replyComment" data-id="'+c.id+'">'+t('Reply')+'</button>'+
           '<button class="btn ghost sm" data-act="resolveComment" data-id="'+c.id+'">'+t('Resolve')+'</button>'):'')+'</li>';}).join('')+'</ul>')
    :'<div class="empty">'+t('No comments.')+'</div>')+'</div>';
  return html;
}
function clientProjectBlock(pid,preview){
  var cv=svcClientView(pid); if(!cv)return '';
  var html='<div class="card"><h2>'+h(cv.project.name)+'</h2>'+
    '<p class="sub">'+h(arr(cv.project.assetTypes).map(t).join(', '))+' · '+h(cv.project.city||'')+
    ' · '+t('last updated')+' '+dateRU(cv.lastUpdated)+'</p>'+
    '<div class="kpis">'+
    kpi(t('Total GLA'),fmt(cv.kpis.totalGLA,0)+' '+sqm(),'')+
    kpi(t('Leased'),fpct(cv.kpis.leasedGLA,cv.kpis.totalGLA),fmt(cv.kpis.leasedGLA,0)+' '+sqm())+
    (cv.kpis.soldGLA?kpi(t('Sold'),fpct(cv.kpis.soldGLA,cv.kpis.totalGLA),fmt(cv.kpis.soldGLA,0)+' '+sqm()):'')+
    kpi(t('In negotiation'),fpct(cv.kpis.negotiationGLA,cv.kpis.totalGLA),fmt(cv.kpis.negotiationGLA,0)+' '+sqm())+
    kpi(t('Available'),fpct(cv.kpis.availableGLA,cv.kpis.totalGLA),fmt(cv.kpis.availableGLA,0)+' '+sqm())+
    kpi(t('Signed agreements'),String(cv.kpis.signedDeals),cv.kpis.activeNegotiations+' '+t('active negotiations'))+
    '</div>';
  html+='<h3>'+t('Merchandise mix')+'</h3>'+cv.mix.filter(function(m){return m.actualGLA;}).map(function(m){
    var a=m.actualSharePct||0;
    return '<div class="mixrow"><span class="lbl">'+h(t(m.category))+'</span>'+
      '<span class="bar"><i style="width:'+Math.min(100,a).toFixed(1)+'%;background:'+m.color+'"></i></span>'+
      '<span class="val num">'+fmt(a,1)+'%</span></div>';}).join('');
  if(arr(cv.project.notes).length)html+='<h3>'+t('Updates')+'</h3><ul class="list">'+
    cv.project.notes.map(function(n){return '<li>'+h(t(n))+'</li>';}).join('')+'</ul>';
  html+='<h3>'+t('Approved documents')+'</h3>'+(cv.documents.length?('<ul class="list">'+cv.documents.map(function(d){
    return '<li><span style="flex:1">'+h(d.fileName)+' <span class="tag">'+h(t(d.category))+'</span></span></li>';}).join('')+'</ul>')
    :'<div class="empty">'+t('No documents shared yet.')+'</div>');
  html+='</div>';
  return html;
}
/* client-role views */
function viewClientDash(){
  var cl=byId(S.clients,SESSION.clientId);
  var html='<div class="ph"><h1>'+t('My property')+'</h1><span class="spacer"></span>'+
    '<button class="btn ghost sm noprint" data-act="print">⎙ '+t('Print')+'</button></div>'+
    '<p class="sub">'+h(cl?cl.name:'')+' · figures approved by the CASE leasing team</p>';
  arr(cl&&cl.projectIds).forEach(function(pid){html+=clientProjectBlock(pid);});
  return html;
}
function viewClientPlan(){
  var cl=byId(S.clients,SESSION.clientId);
  var pids=arr(cl&&cl.projectIds);
  if(!UI.project||pids.indexOf(UI.project)<0)UI.project=pids[0]||'';
  var floors=S.floors.filter(function(f){return f.projectId===UI.project;});
  if(!UI.planFloor||!floors.some(function(f){return f.id===UI.planFloor;}))UI.planFloor=floors[0]?floors[0].id:'';
  UI.planMode='status';
  var html='<div class="ph"><h1>'+t('Floor plan')+'</h1><span class="tag">'+h(projName(UI.project))+'</span></div>'+
    '<p class="sub">'+t('Click a unit to see its approved information and leave a comment.')+'</p>'+
    '<div class="tabs">'+floors.map(function(f){
      return '<button data-act="setFloor" data-id="'+f.id+'" class="'+(UI.planFloor===f.id?'on':'')+'">'+h(t(f.name))+'</button>';}).join('')+'</div>';
  var items=[{c:'#cfe8d4',l:t('Available')},{c:'#f4c95d',l:t('In negotiation')},{c:'#2f8a4f',l:t('Leased')},
    {c:'#b5651d',l:t('Sold')},{c:'#c0bab2',l:t('Not available')}];
  html+='<div class="legend">'+items.map(function(i){
    return '<span class="li"><span class="sw" style="background:'+i.c+'"></span>'+h(t(i.l))+'</span>';}).join('')+'</div>';
  html+='<div class="card" style="padding:8px"><div id="planhost"></div></div>';
  return html;
}
function openClientUnitDrawer(u){
  var cs=svcClientStatus(u);
  var color={Available:'#cfe8d4','In Negotiation':'#f4c95d',Interest:'#f4c95d',Contracting:'#88bd70',
    Leased:'#2f8a4f','For Sale':'#f0c674',Sold:'#b5651d','Not available':'#c0bab2'}[cs]||'#e5e7eb';
  var html='<header><div style="flex:1"><h1>'+h(u.unitNumber)+'</h1>'+
    '<div class="sub" style="margin:2px 0 0">'+h(floorName(u.floorId))+' · '+
    (u.area.glaM2==null?'area to be confirmed':fmt(u.area.glaM2,1)+' '+sqm())+'</div></div>'+
    '<button class="x" data-act="closeDrawer" aria-label="'+h(t('Close'))+'">×</button></header><div class="body">'+
    '<div class="sec"><span class="chip" style="background:'+color+';color:'+contrastInk(color)+'">'+h(t(cs))+'</span></div>'+
    '<div class="sec"><h3>'+t('Information')+'</h3><div class="tw"><table><tbody>'+
    row(t('Status'),h(t(cs)))+

/* ---------------------------------------------------------------- AI tool registry + Ask */
var TOOLS={
  searchBrands:{ro:true,run:function(p){return S.brands.filter(function(b){

  filterUnits:{ro:true,run:function(p){return svcUnits().filter(function(u){
    if(p.status&&u.commercialStatus!==p.status)return false;
    if(p.category&&!(u.targetUse&&u.targetUse.category===p.category))return false;
    if(p.minArea!=null&&!(u.area.glaM2!=null&&u.area.glaM2>=p.minArea))return false;
    if(p.maxArea!=null&&!(u.area.glaM2!=null&&u.area.glaM2<=p.maxArea))return false;
    return true;}).map(unitBrief);}},
  getUnit:{ro:true,run:function(p){var u=byId(S.units,p.id);return u?unitBrief(u):null;}},
  getDealsByStage:{ro:true,run:function(p){return svcDeals(null,p.type||'Leasing').filter(function(d){
    return !p.stage||d.stage===p.stage;}).map(dealBrief);}},
  getDealsWithoutNextAction:{ro:true,run:function(){return svcNoNextAction().map(dealBrief);}},
  getStaleDeals:{ro:true,run:function(p){return svcStaleDeals().map(dealBrief);}},
  getOverdueTasks:{ro:true,run:function(){return svcOverdueTasks().map(function(t){
    return {id:t.id,title:t.title,due:t.dueDate,assignee:userName(t.assigneeId)};});}},
  calculateLeasedGLA:{ro:true,run:function(){var i=svcInventory();return {leasedGLA:i.leasedGLA,soldGLA:i.soldGLA,
    totalGLA:i.totalGLA,percent:pct(i.leasedGLA+i.soldGLA,i.totalGLA),unitsWithoutArea:i.unitsWithoutArea};}},
  calculateVacantGLA:{ro:true,run:function(){var i=svcInventory();return {availableGLA:i.availableGLA,
    percent:pct(i.availableGLA,i.totalGLA),units:i.availableUnits};}},
  calculatePipelineGLA:{ro:true,run:function(p){var x=svcPipeline(p.type||'Leasing');
    return {area:x.totalArea,deals:x.deals.length,note:x.note};}},
  calculatePipelineValue:{ro:true,fin:true,run:function(p){var x=svcPipeline(p.type||'Leasing');
    return {value:x.totalValue,weighted:x.weighted,dealsWithoutValue:x.valueUnknown};}},
  aggregateMerchandiseMix:{ro:true,run:function(p){return svcMix(null,p.basis||'gla').rows.map(function(r){
    return {category:r.cat.label,actualGLA:r.actualGLA,actualShare:r.actualSharePct,targetShare:r.plannedSharePct,gap:r.gapPct};});}},
  suggestBrandsForUnit:{ro:true,run:function(p){var u=byId(S.units,p.unitId);
    return u?svcSuggestBrandsForUnit(u,p.limit||5).map(function(s){
      return {brand:s.brand.name,score:s.score,why:s.why,blockers:s.blockers};}):[];}},
  suggestUnitsForBrand:{ro:true,run:function(p){var b=byId(S.brands,p.brandId);
    return b?svcSuggestUnitsForBrand(b,p.limit||5).map(function(s){
      return {unit:s.unit.unitNumber,project:projName(s.unit.projectId),score:s.score,why:s.why,blockers:s.blockers};}):[];}},
  getDataCompleteness:{ro:true,run:function(){return svcHygiene();}},
  getVisibleDocuments:{ro:true,run:function(p){
    var list=S.documents.filter(function(d){return !p.projectId||d.projectId===p.projectId;});
    if(isClient())list=list.filter(function(d){return d.visibility==='client_visible';});
    return list.map(function(d){return {id:d.id,fileName:d.fileName,category:d.category,visibility:d.visibility};});}},
  generateOwnerReport:{ro:true,run:function(p){return svcClientView(p.projectId||UI.project||svcProjectScope()[0]);}},
  createTask:{ro:false,run:function(p){
    var tk={id:nextId('TASK',S.tasks),title:String(p.title||'Task'),projectId:p.projectId||UI.project||null,
      unitId:p.unitId||null,dealId:p.dealId||null,assigneeId:p.assigneeId||(SESSION&&SESSION.userId),
      dueDate:p.dueDate||today(),priority:p.priority||'Normal',status:'Open',createdAt:nowISO()};
    S.tasks.push(tk); audit('Task created (tool)',tk.title); markDirty(); return tk;}},
  addComment:{ro:false,run:function(p){

      clientId:SESSION&&SESSION.clientId||null,projectId:p.projectId||UI.project,unitId:p.unitId||null,

    S.comments.push(c); audit('Comment added (tool)',c.text.slice(0,60)); markDirty(); return c;}}
};
function unitBrief(u){
  var ds=svcDisplayStatus(u);
  return {id:u.id,unit:u.unitNumber,project:projName(u.projectId),floor:floorName(u.floorId),
    areaM2:u.area.glaM2,status:stLabel(u.commercialStatus),displayStatus:ds.label,
    prospects:openDealsFor(u.id).length,
    askingRent:canSeeFinance()?(u.leasingTerms&&u.leasingTerms.askingRent):undefined};
}
function dealBrief(d){
  var v=svcValueBasis(d);
  return {id:d.id,brand:brandName(d.brandId),type:d.type,stage:stgLabel(d.type,d.stage),
    units:d.unitIds.map(unitLabel),areaM2:svcDealArea(d),
    value:canSeeFinance()?v.value:undefined,valueBasis:canSeeFinance()?v.basis:undefined,
    nextAction:d.nextAction&&d.nextAction.text,manager:userName(d.ownership.responsibleManagerId)};
}
function runTool(name,params){
  var tool=TOOLS[name];
  if(!tool)return {ok:false,error:'Unknown tool: '+name};
  if(tool.fin&&!canSeeFinance())return {ok:false,error:'This role may not see financial values.'};
  if(!tool.ro&&!canEdit())return {ok:false,error:'This role may not change data.'};
  var out;
  try{out=tool.run(params||{});}catch(e){return {ok:false,error:String(e&&e.message||e)};}
  audit('Tool called: '+name,JSON.stringify(params||{}).slice(0,120));
  return {ok:true,tool:name,readOnly:!!tool.ro,result:out,
    source:'platform data and calculations from this browser only'};
}
/* deterministic intent parser — no model, no network. The same shape as the
   CASE OS geo agent: phrase → closed tool menu → tools compute the numbers. */
var INTENTS=[
 {re:/(vacant|available|свобод)/i,tool:'calculateVacantGLA',params:function(){return {};}},
 {re:/(leased|occupancy|сдан|заполн)/i,tool:'calculateLeasedGLA',params:function(){return {};}},
 {re:/(pipeline value|стоимость воронки)/i,tool:'calculatePipelineValue',params:function(m,q){
   return {type:/sale|продаж/i.test(q)?'Sales':'Leasing'};}},
 {re:/(pipeline|воронк)/i,tool:'calculatePipelineGLA',params:function(m,q){
   return {type:/sale|продаж/i.test(q)?'Sales':'Leasing'};}},
 {re:/(without (a )?(next|follow)|без следующего)/i,tool:'getDealsWithoutNextAction',params:function(){return {};}},
 {re:/(stale|stuck|застоял|без движения)/i,tool:'getStaleDeals',params:function(){return {};}},
 {re:/(overdue|просроч)/i,tool:'getOverdueTasks',params:function(){return {};}},
 {re:/(mix|категор)/i,tool:'aggregateMerchandiseMix',params:function(){return {basis:'gla'};}},
 {re:/brands? (that )?fit (unit )?([A-Za-z]-?\d+)/i,tool:'suggestBrandsForUnit',params:function(m){
   var u=S.units.filter(function(x){return x.unitNumber.toLowerCase()===String(m[3]).toLowerCase();})[0];
   return {unitId:u?u.id:null};}},
 {re:/(completeness|quality|качеств|полнот)/i,tool:'getDataCompleteness',params:function(){return {};}},
 {re:/(owner report|отчёт владельц|отчет владельц)/i,tool:'generateOwnerReport',params:function(){return {projectId:UI.project||svcProjectScope()[0]};}},
 {re:/units? (in )?([A-Za-z]-?\d+)/i,tool:'searchUnits',params:function(m){return {q:m[2]};}}
];
var ASKLOG=[];
function askRun(q){
  var matched=null;
  for(var i=0;i<INTENTS.length;i++){
    var m=q.match(INTENTS[i].re);
    if(m){matched={def:INTENTS[i],m:m};break;}
  }
  if(!matched){
    ASKLOG.push({q:q,answer:'I did not recognise that. Try: vacant area, leased area, pipeline value, '+
      'stale deals, deals without next action, overdue tasks, merchandise mix, brands that fit unit A-102, data quality.',data:null});
    return;
  }
  var res=runTool(matched.def.tool,matched.def.params(matched.m,q));
  ASKLOG.push({q:q,answer:res.ok?('Tool '+res.tool+' — платформенные данные и расчёты'):('Refused: '+res.error),data:res.ok?res.result:null,tool:res.tool});
}
function viewAsk(){
  var html='<div class="ph"><h1>'+t('Ask (prototype)')+'</h1></div>'+
    '<div class="banner info">'+t('Deterministic: the question is parsed in the browser and answered by the tool registry. No language model and no network call. Every number comes from a tool, never from free text.')+'</div>'+
    '<div class="card"><div class="row"><input id="askInput" placeholder="'+h(t('e.g. vacant area · pipeline value · stale deals · brands that fit unit A-102'))+'" style="flex:1;min-width:220px">'+
    '<button class="btn sm" data-act="askRun">'+t('Ask')+'</button></div>'+
    '<p class="sub" style="margin-top:6px">'+t('Available tools:')+' '+Object.keys(TOOLS).map(function(k){return '<code>'+k+'</code>';}).join(', ')+'</p></div>';
  ASKLOG.slice().reverse().forEach(function(x){
    html+='<div class="card"><b>'+h(x.q)+'</b><div class="sub">'+h(x.answer)+'</div>'+
      (x.data?('<pre style="font-size:11px;overflow:auto;max-height:260px;background:var(--soft);padding:8px;border-radius:6px">'+
        h(JSON.stringify(x.data,null,1).slice(0,3000))+'</pre>'):'')+'</div>';});
  return html;
}

      '</div><button class="btn ghost sm" data-go="dash">'+t('Back to dashboard')+'</button>';
    console.error(e);
  }
  m.innerHTML=html;
  if((v==='plan'||v==='cplan')&&$('planhost'))afterPlanRender();
  if(v==='io')bindIOInputs();

}

/* ---- CSV helpers --------------------------------------------------------- */
function csvCell(v){
  var s=v==null?'':String(v);
  return /[";\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s;
}
function download(name,text,mime){
  var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
}
function exportCsv(name,rows,headers){
  var sep=';';                                   /* Excel in RU/UZ locales expects ';' */
  var text='﻿'+headers.join(sep)+'\r\n'+
    rows.map(function(r){return r.map(csvCell).join(sep);}).join('\r\n');
  download(name,text,'text/csv;charset=utf-8');
  audit('CSV export',name);
}

    logStatus('unit',u.id,'commercialStatus',stLabel(from),stLabel(value),'');
    logActivity('Status change',u.unitNumber+': '+stLabel(from)+' → '+stLabel(value),
      {unitId:u.id,projectId:u.projectId});
    audit('Unit status changed',u.unitNumber+' '+from+' → '+value);
    markDirty(); toast(t('Status updated everywhere')); openUnitDrawer(u.id); render();
  } else if(act==='setUnitNext'){
    var u2=byId(S.units,id); if(!u2)return;
    u2.operational=u2.operational||{}; u2.operational.nextAction=value||null; markDirty();
  } else if(act==='setUnitNextDate'){
    var u3=byId(S.units,id); if(!u3)return;
    u3.operational=u3.operational||{}; u3.operational.nextActionDate=value||null; markDirty();
  } else if(act==='setDealStage'){
    var d=byId(S.deals,id); if(!d)return;
    var prev=d.stage; if(prev===value)return;
    var sd=stageDef(d.type,value);
    if(sd.type==='lost'){
      var reason=prompt('Closed Lost requires a reason:\n'+
        CONFIG().lostReasons.map(function(r,i){return (i+1)+'. '+r.label;}).join('\n'),'1');
      if(!reason){render();return;}
      var idx=parseInt(reason,10);
      var lr=isFinite(idx)?CONFIG().lostReasons[idx-1]:CONFIG().lostReasons.filter(function(r){
        return r.label.toLowerCase()===String(reason).toLowerCase();})[0];
      if(!lr){toast(t('Stage not changed: a valid lost reason is required.'));render();return;}
      d.outcome.lostReason=lr.key; d.outcome.lost=true; d.status='Lost';
    }
    d.stage=value; d.dateEnteredStage=today();
    d.stageHistory.push({stage:value,at:nowISO(),by:SESSION.userId});
    if(sd.type==='won'){d.outcome.won=true;d.status='Won';}
    /* a signed stage proposes the matching inventory status — it never sets it silently */
    if(rankOf(d.type,value)>=rankOf(d.type,'signed')&&sd.type==='open'){
      var target=d.type==='Sales'?'sold':'contract';
      if(confirm('Set the linked unit(s) to "'+stLabel(target)+'" and record the tenant?')){
        d.unitIds.forEach(function(uid){
          var un=byId(S.units,uid); if(!un)return;
          var f=un.commercialStatus; un.commercialStatus=target;
          var br=byId(S.brands,d.brandId);
          if(br)un.actualUse={brandId:br.id,tenantName:br.name,category:br.classification.category,
            subcategory:br.classification.subcategory};
          logStatus('unit',un.id,'commercialStatus',stLabel(f),stLabel(target),'deal '+d.id);
        });
      }
    }
    logActivity('Stage change',brandName(d.brandId)+': '+stgLabel(d.type,prev)+' → '+sd.label,
      {dealId:d.id,projectId:d.projectId});
    d.activity.lastContactDate=today();
    audit('Deal stage changed',brandName(d.brandId)+' '+prev+' → '+value);
    markDirty(); toast(t('Stage updated')); openDealDrawer(d.id); render();
  } else if(act==='setDealNext'){
    var d2=byId(S.deals,id); if(!d2)return;
    d2.nextAction=d2.nextAction||{}; d2.nextAction.text=value||null; markDirty();
  } else if(act==='setDealNextDate'){
    var d3=byId(S.deals,id); if(!d3)return;
    d3.nextAction=d3.nextAction||{}; d3.nextAction.dueDate=value||null; markDirty();
  }
}
function applyConfigEdit(cfg,key,value){
  var c=CONFIG();
  if(cfg==='status.label'||cfg==='status.color'){
    var s=c.unitStatuses.filter(function(x){return x.key===key;})[0]; if(!s)return;
    if(cfg==='status.label')s.label=value; else s.color=value;
  } else if(cfg==='cat.color'){
    var cat=c.categories.filter(function(x){return x.key===key;})[0]; if(cat)cat.color=value;
  } else if(cfg.indexOf('thr.')===0){
    var k=cfg.slice(4);
    c.thresholds[k]=(k==='negotiationStage'||k==='displayStage')?value:(num(value)||0);
  } else if(cfg.indexOf('comm.')===0){
    var ck=cfg.slice(5);
    c.commission[ck]=(ck==='completionRule')?value:(ck==='managerSeesOwnShare')?(value==='true'):(num(value)||0);
  }
  S.settings=c; audit('Settings changed',cfg+' '+(key||'')+' = '+value); markDirty();
}

/* ---- import handling ----------------------------------------------------- */
function bindIOInputs(){
  var f=$('importFile');
  if(f)f.addEventListener('change',function(e){
    var file=e.target.files[0]; if(!file)return;
    var r=new FileReader();
    r.onload=function(){ previewImport(String(r.result)); };
    r.readAsText(file);
  });
  var c=$('caseosFile');
  if(c)c.addEventListener('change',function(e){
    var file=e.target.files[0]; if(!file)return;
    var r=new FileReader();
    r.onload=function(){ previewCaseOs(String(r.result)); };
    r.readAsText(file);
  });
}
var PENDING_IMPORT=null;
function previewImport(text){
  var box=$('importPreview'); if(!box)return;
  var data,errs=[],warns=[];
  try{data=JSON.parse(text);}catch(e){
    box.innerHTML='<div class="banner warn">The file is not valid JSON: '+h(String(e.message))+'. Nothing was changed.</div>';return;}
  if(!data||typeof data!=='object'){box.innerHTML='<div class="banner warn">Unexpected file shape. Nothing was changed.</div>';return;}
  ['units','deals','brands','projects'].forEach(function(k){
    if(!Array.isArray(data[k]))errs.push('Missing or invalid array: '+k);});
  if(data.meta&&data.meta.schemaVersion>SCHEMA_VERSION)
    errs.push('The file was written by a newer version (schema '+data.meta.schemaVersion+').');
  if(!errs.length){
    (data.units||[]).forEach(function(u){
      if(!byId(data.projects||[],u.projectId))warns.push('Unit '+(u.unitNumber||u.id)+' refers to an unknown project.');});
    (data.deals||[]).forEach(function(d){
      arr(d.unitIds).forEach(function(uid){
        if(!byId(data.units||[],uid))warns.push('Deal '+d.id+' refers to an unknown unit.');});});
    var ids={};
    (data.units||[]).forEach(function(u){if(ids[u.id])errs.push('Duplicate unit id: '+u.id);ids[u.id]=1;});
  }
  PENDING_IMPORT=errs.length?null:data;
  box.innerHTML=(errs.length?'<div class="banner warn"><b>Import refused.</b><br>'+errs.map(h).join('<br>')+'</div>':
    '<div class="banner ok">The file is valid and can replace the current data.</div>')+
    '<div class="tw"><table><tbody>'+
    ['projects','units','deals','brands','companies','contacts','tasks','documents','comments'].map(function(k){
      return row(k,String(arr(data[k]).length));}).join('')+'</tbody></table></div>'+
    (warns.length?('<div class="banner warn">'+warns.slice(0,8).map(h).join('<br>')+
      (warns.length>8?('<br>… '+(warns.length-8)+' more'):'')+'</div>'):'')+
    (errs.length?'':'<button class="btn sm" data-act="confirmImport">'+t('Replace all data with this file')+'</button>');
}
ACTIONS.confirmImport=function(){
  if(!PENDING_IMPORT)return;
  if(!confirm(t('Replace ALL local data with the imported file?')))return;
  var d=migrate(PENDING_IMPORT);
  Object.keys(S).forEach(function(k){if(d[k]!==undefined)S[k]=d[k];});
  audit('JSON import','replaced all data'); persist(); toast(t('Data imported')); go('dash');
};
function previewCaseOs(text){
  var box=$('caseosPreview'); if(!box)return;
  var data;
  try{data=JSON.parse(text);}catch(e){
    box.innerHTML='<div class="banner warn">Not valid JSON: '+h(String(e.message))+'</div>';return;}
  if(!data||!Array.isArray(data.OBJECTS)||!Array.isArray(data.U)){
    box.innerHTML='<div class="banner warn">This does not look like a CASE OS backup: OBJECTS and U are expected at the top level.</div>';return;}
  var STAT_MAP={vac:['available',null],neg:['available','negotiation'],off:['available','offered'],
    os:['available','loi'],cs:['available','draft'],cd:['contract','signed'],res:['reserved','negotiation']};
  var rows=[],warn=[];
  data.OBJECTS.forEach(function(o){rows.push(['Project',o.name||o.id,'→ PROJ']);});
  var noArea=0,catMissing={};
  data.U.forEach(function(u){
    if(u.area==null||!isFinite(+u.area))noArea++;
    if(u.cat&&!catByAlias(u.cat))catMissing[u.cat]=(catMissing[u.cat]||0)+1;});
  var multi=data.U.filter(function(u){return u.merged&&arr(u.merged).length;}).length;
  var withVars=data.U.filter(function(u){return arr(u.vars).length;}).length;
  box.innerHTML='<div class="banner info">Dry run only — nothing has been imported.</div>'+
    '<div class="tw"><table><tbody>'+
    row(t('Projects (OBJECTS)'),String(data.OBJECTS.length))+
    row(t('Units (U)'),String(data.U.length))+
    row(t('Brands (BRANDS)'),String(arr(data.BRANDS).length))+
    row(t('Units without area'),noArea?('<span class="sev amber">'+noArea+'</span> — imported as unknown, never as zero'):'0')+
    row(t('Units with candidate brands'),withVars+' → each becomes an open deal at the stage mapped from the CASE OS status')+
    row(t('Merged units'),String(multi)+' → kept as one unit with a combined label')+
    row(t('Unmapped categories'),Object.keys(catMissing).length?('<span class="sev amber">'+h(Object.keys(catMissing).join(', '))+'</span> → "Other"'):'none')+
    '</tbody></table></div>'+
    '<h3 style="margin-top:8px">'+t('Status mapping')+'</h3><div class="tw"><table><thead><tr><th>CASE OS</th>'+
    '<th>'+t('Inventory status')+'</th><th>'+t('Open deal stage')+'</th></tr></thead><tbody>'+
    Object.keys(STAT_MAP).map(function(k){
      return '<tr><td><code>'+k+'</code></td><td>'+h(stLabel(STAT_MAP[k][0]))+'</td>'+
        '<td>'+(STAT_MAP[k][1]?h(stgLabel('Leasing',STAT_MAP[k][1])):'—')+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<p class="sub">The adapter is a dry run in this build: it reports what a full import would do. '+
    'Writing the mapped records is Phase 9 of the implementation plan.</p>';
}
function bindPlanUpload(){
  var f=$('planFile'); if(!f)return;
  f.addEventListener('change',function(e){
    var file=e.target.files[0]; if(!file)return;
    var r=new FileReader();
    r.onload=function(){
      var txt=String(r.result);
      if(txt.indexOf('<svg')<0){toast(t('That file contains no <svg> element.'));return;}
      var plan=planFor(UI.project,UI.planFloor);
      var old=plan;
      if(old){old.current=false;old.archived=true;}
      S.floorPlans.push({id:nextId('PLAN',S.floorPlans),projectId:UI.project,
        buildingId:(byId(S.floors,UI.planFloor)||{}).buildingId,floorId:UI.planFloor,
        version:(old?old.version:0)+1,fileName:file.name,format:'SVG',effectiveDate:today(),
        uploadedAt:nowISO(),uploadedBy:SESSION.userId,current:true,archived:false,
        notes:'Uploaded through the mapping wizard.',svgText:txt,polygonMappings:[]});
      audit('Floor plan version added',file.name);
      markDirty(); closeModal(); toast(t('New plan version added; previous version archived')); render();
    };
    r.readAsText(file);
  });
}

/* ---- global event wiring ------------------------------------------------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-go]');
  if(!el)return;
  var go_=el.getAttribute('data-go');
  if(go_){e.preventDefault();go(go_);return;}
  var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(el.tagName==='SELECT'||el.tagName==='INPUT'||el.tagName==='TEXTAREA')return;
  if(ACTIONS[act]){e.preventDefault();ACTIONS[act](id);}
});
document.addEventListener('change',function(e){
  var el=e.target;
  var act=el.getAttribute&&el.getAttribute('data-act');
  if(act&&/^set(Unit|Deal)/.test(act)){applyFieldAction(act,el.getAttribute('data-id'),el.value);return;}
  if(act==='portalClient'){ACTIONS.portalClient(el.value);return;}
  var cfg=el.getAttribute&&el.getAttribute('data-cfg');
  if(cfg){applyConfigEdit(cfg,el.getAttribute('data-key'),el.value);
    if(cfg.indexOf('thr.')===0)render();
    return;}
  var flt=el.getAttribute&&el.getAttribute('data-filter');
  if(flt){ if(flt==='brandQ')UI.brandQ=el.value; else UNITF[flt]=el.value; render(); }
});
document.addEventListener('input',function(e){
  var el=e.target, flt=el.getAttribute&&el.getAttribute('data-filter');
  if(flt&&(flt==='q'||flt==='brandQ')){
    clearTimeout(window._ft);
    window._ft=setTimeout(function(){
      if(flt==='brandQ')UI.brandQ=el.value; else UNITF.q=el.value;
      render();
      var again=document.querySelector('[data-filter="'+flt+'"]');
      if(again){again.focus();again.setSelectionRange(again.value.length,again.value.length);}
    },260);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();closeDrawer();}
  if(e.key==='Enter'&&e.target&&e.target.id==='askInput'){ACTIONS.askRun();}
  /* Enter enters the application from anywhere on the login screen (00_MASTER_PROMPT.md §32) */
  if(e.key==='Enter'&&!SESSION){
    var login=$('login');
    if(login&&login.style.display!=='none'&&LOGIN_PICK){e.preventDefault();doLogin(LOGIN_PICK);}
  }
});
/* plan interaction: click and keyboard */
document.addEventListener('click',function(e){
  var el=e.target.closest&&e.target.closest('[data-unit-id]');
  if(el)openUnitDrawer(el.getAttribute('data-unit-id'));
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var el=document.activeElement;
  if(el&&el.getAttribute&&el.getAttribute('data-unit-id')){
    e.preventDefault();openUnitDrawer(el.getAttribute('data-unit-id'));}
});
/* kanban drag & drop — records stage history like any other move */
document.addEventListener('dragstart',function(e){
  var c=e.target.closest&&e.target.closest('.kancard');
  if(!c)return;
  e.dataTransfer.setData('text/plain',c.getAttribute('data-id'));
  c.classList.add('drag');
});
document.addEventListener('dragend',function(e){
  var c=e.target.closest&&e.target.closest('.kancard'); if(c)c.classList.remove('drag');
  document.querySelectorAll('.kancol.over').forEach(function(x){x.classList.remove('over');});
});
document.addEventListener('dragover',function(e){
  var col=e.target.closest&&e.target.closest('.kancol');
  if(!col)return;
  e.preventDefault(); col.classList.add('over');
});
document.addEventListener('dragleave',function(e){
  var col=e.target.closest&&e.target.closest('.kancol'); if(col)col.classList.remove('over');
});
document.addEventListener('drop',function(e){
  var col=e.target.closest&&e.target.closest('.kancol'); if(!col)return;
  e.preventDefault(); col.classList.remove('over');
  var dealId=e.dataTransfer.getData('text/plain');
  if(dealId)applyFieldAction('setDealStage',dealId,col.getAttribute('data-stage'));
});
window.addEventListener('beforeunload',function(e){
  if(UI.dirty){e.preventDefault();e.returnValue='';}
});

/* ---- header controls ----------------------------------------------------- */
function bindHeader(){
  $('projPick').addEventListener('change',function(){UI.project=this.value;saveUI();render();});
  $('btnLogout').addEventListener('click',function(){
    persist(); SESSION=null;
    try{localStorage.removeItem(K_SESSION);}catch(e){}
    $('app').style.display='none'; $('login').style.display='flex'; renderLogin();});
  $('btnTheme').addEventListener('click',function(){
    UI.theme=UI.theme==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',UI.theme);saveUI();});
  $('btnLang').addEventListener('click',function(){
    /* EN → RU → UZ → EN. The label always shows the language you are in, not the next one. */
    var order=LANGS.map(function(l){return l.key;});
    UI.lang=order[(order.indexOf(UI.lang)+1)%order.length];
    LANG=UI.lang; saveUI(); applyStaticI18n(); renderNav(); render();
    toast(LANGS.filter(function(l){return l.key===UI.lang;})[0].name);});
  $('btnMenu').addEventListener('click',function(){$('nav').classList.toggle('on');});
  $('scrim').addEventListener('click',function(){closeDrawer();});
  var gs=$('globalSearch');
  gs.addEventListener('input',function(){
    var q=this.value;
    clearTimeout(window._gs);
    window._gs=setTimeout(function(){
      if(q.trim().length<2){closeModal();return;}
      var res=svcSearch(q);
      openModal('Search: '+q, res.length?('<ul class="list">'+res.map(function(r){
        return '<li style="cursor:pointer" data-act="searchGo" data-id="'+encodeURIComponent(JSON.stringify(r.go))+'">'+
          '<span style="flex:1"><b>'+h(t(r.label))+'</b> — <span class="tag">'+h(r.type)+'</span>'+
          '<br><span style="font-size:10.5px;color:var(--muted)">'+h(r.context)+'</span></span></li>';}).join('')+'</ul>')
        :'<div class="empty">'+t('Nothing found.')+'</div>');
    },260);
  });
}
ACTIONS.searchGo=function(payload){
  var go_=JSON.parse(decodeURIComponent(payload));
  closeModal();
  if(go_.view==='unit'){var u=byId(S.units,go_.id);if(u){UI.project=u.projectId;UI.planFloor=u.floorId;}
    go('units');openUnitDrawer(go_.id);return;}
  if(go_.view==='deal'){go(byId(S.deals,go_.id).type==='Sales'?'sales':'leasing');openDealDrawer(go_.id);return;}
  if(go_.view==='brand'){go('brands');openBrandDrawer(go_.id);return;}
  if(go_.view==='project'){UI.project=go_.id;go('project');return;}
  go(go_.view);
};

/* Static markup (login screen, header) is translated in place: the alternative would be
   rebuilding the shell on every language change and losing what the user has typed. */
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    el.textContent=t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){
    el.title=t(el.getAttribute('data-i18n-title'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
    el.placeholder=t(el.getAttribute('data-i18n-placeholder'));
  });
  setSaveState(SAVE_STATE);
  var b=$('btnLang');
  if(b){
    var cur=LANGS.filter(function(l){return l.key===LANG;})[0]||LANGS[0];
    b.textContent=cur.label;
    b.title=t('Interface language')+': '+cur.name;
  }
  document.documentElement.setAttribute('lang',LANG);
}

/* ---- login --------------------------------------------------------------- */
var LOGIN_PICK=null;
function renderLogin(){
  $('vtag').textContent='v'+LSP_VERSION;
  var html=S.users.map(function(u){
    return '<button type="button" class="userbtn'+(LOGIN_PICK===u.id?' on':'')+'" data-user="'+u.id+'">'+
      '<span class="avatar'+(u.role==='client'?' client':'')+'">'+h(initials(u.name))+'</span>'+
      '<span><span class="nm">'+h(u.name)+'</span><br><span class="rl">'+h(t(ROLE_LABEL[u.role]||u.role))+'</span></span></button>';}).join('');
  $('userlist').innerHTML=html;
  if(!LOGIN_PICK&&S.users.length)LOGIN_PICK=S.users[0].id;
  document.querySelectorAll('[data-user]').forEach(function(b){
    b.addEventListener('click',function(){
      LOGIN_PICK=this.getAttribute('data-user');
      document.querySelectorAll('.userbtn').forEach(function(x){x.classList.remove('on');});
      this.classList.add('on');
      /* the picker is a plain button, so Enter on it would not submit the form:
         move focus to the code field, where Enter does what the tester expects. */
      var code=$('logincode'); if(code)code.focus();
    });
    b.addEventListener('dblclick',function(){       /* double click enters straight away */
      LOGIN_PICK=this.getAttribute('data-user'); doLogin(LOGIN_PICK);});
  });
  var first=document.querySelector('[data-user="'+LOGIN_PICK+'"]');
  if(first)first.classList.add('on');
}
function doLogin(userId){
  var u=byId(S.users,userId); if(!u)return;
  SESSION={userId:u.id,role:u.role,clientId:u.clientId||null};
  try{localStorage.setItem(K_SESSION,JSON.stringify(SESSION));}catch(e){}
  $('login').style.display='none';
  $('app').style.display='flex';
  $('whoami').textContent=u.name+' · '+t(ROLE_LABEL[u.role]||u.role);
  document.documentElement.setAttribute('data-theme',UI.theme);
  applyStaticI18n();
  if(isClient()){
    var cl=byId(S.clients,SESSION.clientId);
    UI.project=arr(cl&&cl.projectIds)[0]||'';
    UI.view='cdash';
    $('globalSearch').style.display='none';
  } else {
    $('globalSearch').style.display='';
    UI.view='dash';
  }
  audit('Login',u.name+' ('+u.role+')');
  renderNav(); render();
}

/* ---- boot ---------------------------------------------------------------- */
function boot(){
  loadUI();
  document.documentElement.setAttribute('data-theme',UI.theme);
  var res=loadState();
  if(!res.ok&&res.reason==='corrupt'){
    document.body.innerHTML='<div style="max-width:560px;margin:60px auto;padding:20px;font-family:sans-serif">'+
      '<h1>'+t('Local data could not be read')+'</h1>'+
      '<p>The saved data in this browser is damaged. Nothing was deleted. Choose what to do:</p>'+
      '<p><button class="btn" id="recBackup">'+t('Restore the previous save')+'</button> '+
      '<button class="btn ghost" id="recDownload">'+t('Download the damaged data')+'</button> '+
      '<button class="btn ghost" id="recReset">'+t('Start again with demo data')+'</button></p></div>';
    $('recBackup').onclick=function(){
      var raw=localStorage.getItem(K_BACKUP);
      if(!raw){alert(t('No previous save is stored.'));return;}
      localStorage.setItem(K_STATE,raw);location.reload();};
    $('recDownload').onclick=function(){download('LSP_damaged_'+today()+'.json',res.raw||'','application/json');};
    $('recReset').onclick=function(){localStorage.removeItem(K_STATE);location.reload();};
    return;
  }
  if(!res.ok){ S=freshDemo(); persist(); }
  if(!S.settings||!S.settings.unitStatuses)S.settings=JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  bindHeader();
  applyStaticI18n();
  renderLogin();
  $('loginform').addEventListener('submit',function(e){e.preventDefault();doLogin(LOGIN_PICK);});
  $('btnResetDemo').addEventListener('click',function(){
    if(!confirm(t('Replace local data with the demo dataset?')))return;
    S=freshDemo(); persist(); LOGIN_PICK=null; renderLogin(); toast(t('Demo data restored'));});
  /* restore a session so a refresh does not throw the tester back to login */
  var sess=null;
  try{sess=JSON.parse(localStorage.getItem(K_SESSION)||'null');}catch(e){}
  if(sess&&byId(S.users,sess.userId))doLogin(sess.userId);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
