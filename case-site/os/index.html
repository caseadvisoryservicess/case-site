/* продление срока ответа по предложению (арендатор попросил время на обдумывание) */
function extendOffer(unitId,brand){if(!R().edit){alert('Недостаточно прав.');return;}const u=U.find(x=>x.id===unitId);if(!u)return;
 const list=(u.offers&&u.offers.length)?u.offers:(u.offer?[u.offer]:[]);
 const of=list.find(x=>x.to===brand)||list[0];if(!of)return;
 const v=prompt('На сколько дней продлить срок ответа для «'+of.to+'» (КП '+(of.no||'')+')?\nСейчас — до '+dateRU(of.validUntil)+'.','7');
 if(v==null)return;const days=Math.round(+v);if(!(days>0)){alert('Введите число дней больше нуля.');return;}
 const oldUntil=of.validUntil;of.validUntil=addDaysISO(new Date(of.validUntil),days);of.validDays=(of.validDays||0)+days;
 if(u.offer&&u.offer.to===of.to&&u.offer.no===of.no){u.offer.validUntil=of.validUntil;u.offer.validDays=of.validDays;}
 u.dates=(u.dates||[]).map(d=>(d[0].indexOf('Окончание брони')===0&&(d[0].indexOf(of.to)>=0||d[0].indexOf('КП '+of.no)>=0))?[d[0],of.validUntil]:d);
 u.hist.push([iso(TODAY),'Срок ответа продлён: '+of.to+' (КП '+(of.no||'')+') '+dateRU(oldUntil)+' → '+dateRU(of.validUntil)+' (+'+days+' дн., '+S.user.name+')']);
 audit('Продление срока КП',u.code+' · '+of.to+' → '+of.validUntil);persist();openUnit(unitId);if(S.view==='registry')renderRegistry();}
/* этап «до КП»: бренд(ы) проявили интерес — фиксируем без цены. Цена и детали появятся при формировании КП. */
function negotiateUnit(id){if(!R().edit){alert('Недостаточно прав.');return;}const u=U.find(x=>x.id===id);if(!u)return;

 if(v==null)return;const names=v.split(/[,;]+/).map(s=>s.trim()).filter(Boolean);

function unitSave(id){const u=U.find(x=>x.id===id);if(!u)return;const g=i=>{const e=$(i);return e?e.value:'';};
 if(!rateEditGuard(u,+g('e_rate')||0))return;
 const newCode=(g('e_code')||u.code).trim(); /* коды уникальны внутри объекта; в разных объектах могут совпадать — это нормально */
 if(newCode.toLowerCase()!==String(u.code).toLowerCase()&&U.some(x=>x.obj===u.obj&&x.id!==u.id&&String(x.code).trim().toLowerCase()===newCode.toLowerCase())){alert('В этом объекте уже есть помещение с кодом «'+newCode+'». Коды внутри объекта должны быть уникальными (в других объектах такой код — не помеха).');return;}
 const _pb=u.broker,_ps=u.status;
 u.code=newCode||u.code;u.floor=g('e_floor');u.block=(g('e_block')||'').trim();u.cat=g('e_cat');u.sub=g('e_sub');u.format=(g('e_format')||'').trim();u.concept=(g('e_concept')||'').trim();u.zone=(g('e_zone')||'').trim();u.area=+g('e_area')||0;u.terr=+g('e_terr')||0;u.rate=+g('e_rate')||0;u.budget=+g('e_budget')||0;u.status=g('e_status');u.broker=g('e_broker');
 u.total=Math.round(u.area*u.rate);u.gap=(OCCK.indexOf(u.status)>=0)?0:-(u.total);commTrack(u,_pb,_ps);
 u.hist.push([iso(TODAY),'Правка помещения ('+S.user.name+')']);audit('Правка помещения',u.code);persist();openUnit(id);}

function delUnitCatV(id,c){const u=U.find(x=>x.id===id);if(!u||!R().edit)return;u.extraCats=(u.extraCats||[]).filter(x=>x!==c);u.hist.push([iso(TODAY),'Убрана категория: '+c+' ('+S.user.name+')']);persist();pickerView(id,false);}
function pickerView(id,all){
 const u=U.find(x=>x.id===id);if(!u)return;
 if(!window._pickSel||window._pickSel.uid!==id)window._pickSel={uid:id,ids:{}};
 const cats=unitCats(u);
 const catMatch=b=>{if(!b.cat)return false;return cats.some(c=>b.cat===c||b.cat.indexOf(c)>=0||c.indexOf(b.cat)>=0||catHex(b.cat)===catHex(c));}; /* сравнение с учётом алиасов палитры */
 const q=(S._pickQ||'').trim().toLowerCase();
 let list=BRANDS.filter(b=>b.status!=='refused'&&(all||catMatch(b)));
 if(q)list=list.filter(b=>((b.name||'')+' '+(b.sub||'')+' '+(b.type||'')+' '+(b.country||'')).toLowerCase().includes(q));
 const total=list.length;list=list.slice(0,300);

  return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f2f0ed"><input type="checkbox" ${on?'checked':''} onchange="_pickSel.ids['${b.id}']=this.checked;pickerSelBar()" style="flex-shrink:0"><div style="min-width:0;flex:1"><b>${esc(b.name)}</b>${inShort?' <span class="pill">в шорт-листе</span>':''}${inVars?' <span class="pill">вариант</span>':''}<div style="font-size:10.5px;color:var(--muted)">${catDot(b.cat)}${esc(b.cat)}${b.sub?' / '+esc(b.sub):''} · ${esc(b.country||'-')}${b.amin?' · '+b.amin+'-'+b.amax+' м²':''}</div></div><div style="display:flex;gap:5px;flex-shrink:0"><button class="btn ghost sm" onclick="addToList('${id}','${b.id}','short')">+ шорт</button><button class="btn ghost sm" onclick="addToList('${id}','${b.id}','var')">+ вариант</button></div></div>`;}).join('');
 const addCatSel=R().edit?`<select onchange="addUnitCatV('${id}',this.value)" style="font-family:inherit;font-size:11px;padding:4px 6px;border:1px solid var(--border);border-radius:7px"><option value="">＋ категория…</option>${CASECATS.filter(c=>cats.indexOf(c)<0).map(c=>`<option>${esc(c)}</option>`).join('')}</select>`:'';
 const catChips=cats.map(c=>`<span class="chip">${catDot(c)}${esc(c)}${(R().edit&&c!==u.cat)?` <a href="#" onclick="delUnitCatV('${id}','${esc(c)}');return false" style="color:var(--red-d);text-decoration:none">✕</a>`:''}</span>`).join(' ');
 $('drawer').innerHTML=`<div class="dh"><span class="x" onclick="openUnit('${id}')">×</span><h2>Подбор арендаторов</h2><div class="s">${esc(u.code)}</div></div><div class="dbody">
 <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">${catChips} ${addCatSel}</div>

 <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:12px;color:var(--muted)">${all?'Все бренды':'По категориям юнита'} · ${total}${total>300?' (показаны первые 300 — уточните поиск)':''}</span><button class="btn ghost sm" onclick="pickerView('${id}',${all?'false':'true'})">${all?'Только по категориям':'Показать все'}</button></div>
 <div id="pickBar" style="margin-bottom:6px"></div>
 ${rows||'<div style="color:var(--muted);font-size:12.5px">Нет подходящих брендов. Добавьте категорию юниту или нажмите «Показать все».</div>'}
 <div style="margin-top:12px"><button class="btn ghost sm" onclick="openUnit('${id}')">← Назад к помещению</button></div></div>`;
 openDrawerUI();pickerSelBar();
 if(S._pickFoc){S._pickFoc=0;const e=$('pickQ');if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length);}catch(_){}}}
 localize();

function pickerSelBar(){const bar=$('pickBar');if(!bar||!window._pickSel)return;const n=Object.values(window._pickSel.ids).filter(Boolean).length;bar.innerHTML=n?`<button class="btn sm" onclick="pickerAdd('short')">✓ В шорт-лист (${n})</button> <button class="btn ghost sm" onclick="pickerAdd('var')">⚑ В варианты (${n})</button> <button class="btn ghost sm" onclick="_pickSel.ids={};pickerSelBar();pickerView(_pickSel.uid,false)">снять</button>`:`<span class="mut" style="font-size:11px">Отметьте несколько брендов галочками — добавим одной кнопкой.</span>`;}
function pickerAdd(kind){const st=window._pickSel;if(!st)return;const u=U.find(x=>x.id===st.uid);if(!u)return;let n=0;
 Object.keys(st.ids).forEach(bid=>{if(!st.ids[bid])return;const b=BRANDS.find(x=>x.id===bid);if(!b)return;
  if(kind==='short'){u.shortlist=u.shortlist||[];if(u.shortlist.indexOf(b.name)<0){u.shortlist.push(b.name);n++;}}
  else{if(u.vars.indexOf(b.name)<0){u.vars.push(b.name);n++;}}});
 if(n){u.hist.push([iso(TODAY),(kind==='short'?'Шорт-лист':'Варианты')+': +'+n+' из подбора ('+S.user.name+')']);persist();}
 st.ids={};toast('Добавлено брендов: '+n);openUnit(st.uid);}
function addToList(uid,bid,kind){const u=U.find(x=>x.id===uid),b=BRANDS.find(x=>x.id===bid);if(!u||!b)return;if(kind==='short'){u.shortlist=u.shortlist||[];if(u.shortlist.indexOf(b.name)<0)u.shortlist.push(b.name);u.hist.push([iso(TODAY),'Шорт-лист: +'+b.name+' ('+S.user.name+')']);}else{if(u.vars.indexOf(b.name)<0)u.vars.push(b.name);u.hist.push([iso(TODAY),'Вариант: +'+b.name+' ('+S.user.name+')']);}persist();pickerView(uid,false);}

function docTextOpts(arr){const L=DOC.docLang;return arr.map((tx,i)=>{const s=tx[L]||tx.ru;return `<option value="${i}">${esc(s.length>46?s.slice(0,46)+'…':s)}</option>`;}).join('');}

 else{_doc++;DOCREG.unshift(Object.assign({id:'d'+_doc,by:S.user?S.user.name:'-',at:nowStr(),lang:DOC.docLang,fname:DOC.fname,status:'draft',ver:1,versions:[],raw:html},meta));audit('Документ: '+(meta.type||meta.t||''),(meta.no&&meta.no!=='-'?meta.no+' · ':'')+(meta.to||''));}

function reissueKP(id){const r=DOCREG.find(x=>x.id===id);if(!r||!r.form)return;const f=r.form;
 DOC.uid=null;DOC.t='kp';if(S.view!=='docs'){go('docs');}
 setTimeout(()=>{pickT('kp');setTimeout(()=>{
  const set=(i,v)=>{const e=$(i);if(e!=null&&v!=null&&v!=='')e.value=v;};
  set('f_obj',f.obj);if(typeof kCfg==='function')kCfg();
  setTimeout(()=>{
   set('f_no',f.no);set('f_valid',f.valid);set('f_addr',f.addr);set('f_ten',f.ten);
   set('f_unit',f.unit);set('f_area',f.area);set('f_rate',f.rate);set('f_budget',f.budget);
   if($('f_terr_on')){$('f_terr_on').checked=!!f.terrOn;}set('f_terr',f.terr);set('f_terrate',f.terrate);
   if($('f_season'))$('f_season').checked=!!f.season;set('f_seasonm',f.seasonm);
   set('f_rmodel',f.rmod);set('f_rstep',f.rstep);set('f_turn',f.turn);set('f_turnmin',f.turnmin);
   set('f_inc',f.inc);set('f_sc',f.sc);set('f_vat',f.vat);set('f_vatr',f.vatr);
   set('f_capx',f.capx);set('f_capxv',f.capxv);set('f_fit',f.fit);set('f_fitp',f.fitp);set('f_prep',f.prep);set('f_dep',f.dep);
   set('f_cond',f.cond);set('f_special',f.special);set('f_sig',f.sig);
   if(f.act){const a=$('f_act');if(a){const has=[...a.options].some(o=>o.value===f.act);if(has)a.value=f.act;else{a.value=[...a.options].map(o=>o.value).find(v=>v.indexOf('Другое')>=0)||a.value;const m=$('f_actm');if(m)m.value=f.act;}}}
   if(typeof pricePrev==='function')pricePrev();
   alert('Форма заполнена из КП '+f.no+' (текущая версия v'+(r.ver||1)+').\nИзмените условия (ставка, каникулы, график, срок ответа) и нажмите «Сформировать» — выйдет редакция v'+((r.ver||1)+1)+', предыдущая сохранится в истории.');
  },120);
 },120);},60);}

 return `<div class="sect" style="margin-top:0">Реестр документов <span class="mut" style="font-weight:500;color:var(--muted)">${DOCREG.length}</span></div><div class="tbl-scroll"><table><thead><tr><th>№ / тип</th><th>Кому</th><th>Кто / когда</th><th>Статус</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;

function uploadImg(id,field){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const b=BRANDS.find(x=>x.id===id);b[field]=r.result;b.editedBy=S.user.name;b.editedAt=nowMin();(b.hist=b.hist||[]).push([iso(TODAY),S.user.name,'Загружено изображение: '+field]);persist();openBrand(id);};r.readAsDataURL(f);};inp.click();}
