<style>
:root{--red:#9E0000;--red-d:#7a0000;--red-l:#c62828;--bg:#f4f3f1;--panel:#fff;--card:#fff;--ink:#1b1b1b;--muted:#6b6b6b;--soft:#faf9f7;--border:#e6e3df;--green:#2e7d32;--amber:#a16000;--blue:#1565c0;--teal:#0d8484;--purple:#6a3fb5;--shadow:0 1px 3px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.05)}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:clip}
body{font-family:'Montserrat',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:clip}
button{font-family:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}.hidden{display:none!important}.num{text-align:right;font-variant-numeric:tabular-nums}

.brand{display:flex;align-items:baseline;gap:7px;font-weight:800;font-size:19px;white-space:nowrap}.brand .c{color:var(--red)}.brand .tag{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase}

.gsearch{position:relative;width:min(320px,28vw);min-width:150px;flex:0 1 auto}.gsearch input{width:100%;font-family:inherit;font-size:12.5px;padding:8px 26px 8px 30px;border:1px solid var(--border);border-radius:8px;background:#fff}.gsearch .gclear{position:absolute;right:7px;top:50%;transform:translateY(-50%);cursor:pointer;color:#6d6d6d;font-weight:800;font-size:13px;display:none;z-index:2;padding:2px 5px;line-height:1}.gsearch .gclear:hover{color:var(--red-d)}.gsearch::before{content:'⌕';position:absolute;left:10px;top:6px;color:#6d6d6d;font-weight:800;z-index:1}.gdrop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:70;display:none}.gdrop.open{display:block}.gitem{display:flex;justify-content:space-between;gap:8px;padding:10px 11px;border-bottom:1px solid #f2f0ed;cursor:pointer}.gitem:hover{background:var(--soft)}.gitem b{font-size:12.5px}.gitem small{display:block;color:var(--muted);font-size:10.5px}.gitem .kind{font-size:9.5px;font-weight:800;color:var(--red-d);background:#fdeaea;border-radius:10px;padding:2px 7px;align-self:flex-start}

.nav-menu a:hover{background:var(--soft)}.nav-menu a.active{background:var(--red);color:#fff}.nav-menu a .ic{flex:0 0 24px;width:24px;text-align:center;font-size:16px}

.perm{display:none;margin-top:12px;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--soft);font-size:11px;color:var(--muted)}.perm.collapsed{padding:6px 11px}

   ~280px (независимый аудит, P1-05). Переносим топ-бар на вторую строку заметно раньше —

async function _doSaveState(){

 try{
  await apiPOST('state.php',{data:stateBlob()});

  _offlineDirty=false;_saveConflict=false;
 }catch(e){
  console.warn('Сохранение в базу не удалось - нет связи, работаем локально',e);
  const conflict=String(e&&e.message||'').indexOf('изменены другим пользователем')>=0;

  _offlineDirty=true;
 }finally{
  // Обновляем индикатор ПОСЛЕ сброса _saveBusy — иначе бейдж навсегда застревал на «Сохранение…»,

  _saveBusy=false;updateOfflineBadge();

// Единый индикатор состояния сохранения (P1-04): раньше и локальный, и серверный сбой
// сохранения проходили молча — пользователь мог продолжать работать и позже обнаружить,
// что ничего не записалось. Показывает: сохранение переполнило локальное хранилище браузера
// (самое серьёзное — второго уровня защиты уже нет), конфликт версий, идёт сохранение на
// сервер, нет связи/сервер недоступен — или ничего (всё сохранено), с меткой времени в title.
function updateOfflineBadge(){
 const b=$('offBadge');if(!b)return;
 const savedTitle=_lastSavedAt?('Сохранено в '+_lastSavedAt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})):'';

 if(_localSaveFailed){b.style.display='';b.style.background='#fdecea';b.style.color='#a30000';b.style.borderColor='#f0b4ac';b.title='Локальное хранилище браузера переполнено — сохранение не работает';b.textContent='⛔ Локальное хранилище переполнено';return;}
 if(!BACKEND){if(_lastSavedAt&&Date.now()-_lastSavedAt.getTime()<2200){b.style.display='';b.style.background='#eef8f0';b.style.color='#256433';b.style.borderColor='#b8d8bf';b.title=savedTitle;b.textContent='✓ Сохранено локально';clearTimeout(window._saveBadgeHideT);window._saveBadgeHideT=setTimeout(updateOfflineBadge,2300);}else b.style.display='none';return;}
 if(_saveConflict){b.style.display='';b.style.background='#fdecea';b.style.color='#a30000';b.style.borderColor='#f0b4ac';b.title='Кто-то другой сохранил более новую версию';b.textContent='⚠ Конфликт — обновите страницу';return;}
 if(_saveBusy){b.style.display='';b.style.background='#eef2ff';b.style.color='#33418a';b.style.borderColor='#c9d3f5';b.title=savedTitle;b.textContent='⏳ Сохранение…';return;}
 const off=(typeof navigator!=='undefined'&&navigator.onLine===false)||_offlineDirty;
 if(off){b.style.display='';b.style.background='#fff3e0';b.style.color='#9a6b00';b.style.borderColor='#f0d9a0';b.title=savedTitle;b.textContent=(navigator.onLine===false)?'⚠ Нет связи - работаем локально':'⚠ Не удалось сохранить — повтор…';return;}
 if(_lastSavedAt&&Date.now()-_lastSavedAt.getTime()<2200){b.style.display='';b.style.background='#eef8f0';b.style.color='#256433';b.style.borderColor='#b8d8bf';b.title=savedTitle;b.textContent='✓ Сохранено';clearTimeout(window._saveBadgeHideT);window._saveBadgeHideT=setTimeout(updateOfflineBadge,2300);return;}
 b.style.display='none';
}

/* ===== КОМИССИИ: комиссия CASE от арендодателя + доля агента =====
   Комиссия CASE с юнита = годовая аренда (total×12) × % комиссии объекта (o.comm.total).
   Доля агента = % от комиссии CASE (общий COMMCFG.agentPct, персонально — a.commPct у агента).
   COMMLOST — потерянная комиссия агента: юнит передан другому, сделка сорвалась, юнит удалён. */
let COMMCFG={agentPct:30};
let COMMLOST=[];
const COMM_PIPE=['neg','off','os','cs','res'];
const COMM_PROB={neg:20,off:40,os:65,cs:85,res:50,cd:100};
function commTeamAccess(){const x=R();return !!(x.admin||x.finance||x.approve);}
function commCanSeeAll(){return commTeamAccess();}
function commCanEditAgent(a){const me=(typeof myBrokerName==='function'?myBrokerName():null);return !!(R().admin||(a&&me&&a.name===me));}
function commStageProb(st){return COMM_PROB[st]||0;}
function commAgentWeightedU(u){return Math.round(commAgentFeeU(u)*commStageProb(u.status)/100);}
function commAgentBook(units){const B=commBook(units,commAgentFeeU);B.weighted=units.reduce((s,u)=>s+(COMM_PIPE.indexOf(u.status)>=0?commAgentWeightedU(u):0),0);B.active=units.filter(u=>COMM_PIPE.indexOf(u.status)>=0).length;B.signed=units.filter(u=>u.status==='cd').length;return B;}
function commBrokerList(units){const brokers=Array.from(new Set(units.map(u=>String(u.broker||'').trim()).filter(b=>b&&b!=='-'))).sort();COMMLOST.forEach(x=>{if(x.broker&&brokers.indexOf(x.broker)<0)brokers.push(x.broker);});return brokers;}
function commUnitBrand(u){return (u.offer&&u.offer.to)||((u.vars||[])[0])||u.sub||'-';}
/* #70 внешний агент: имена брендов на юнитах маскируются (конкурентная информация) */
function brandCloak(v){try{if(R().external)return 'скрыто';}catch(e){}return v==null?'':v;}
function commFeeU(u){const o=objById(u.obj);const pct=(o&&o.comm&&+o.comm.total)||0;return Math.round((+u.total||0)*12*pct/100);}
function commAgentPct(name){const a=AGENTS.find(x=>x.name===name);return (a&&a.commPct!=null&&a.commPct!=='')?(+a.commPct||0):(+((COMMCFG&&COMMCFG.agentPct)||0));}
function commAgentFeeU(u){return Math.round(commFeeU(u)*commAgentPct(String(u.broker||'').trim())/100);}
function commBook(units,feeFn){const by={};let pot=0,earn=0,pipe=0,weighted=0;units.forEach(u=>{const f=feeFn(u);if(!f)return;pot+=f;by[u.status]=(by[u.status]||0)+f;weighted+=Math.round(f*commStageProb(u.status)/100);if(u.status==='cd')earn+=f;else if(COMM_PIPE.indexOf(u.status)>=0)pipe+=f;});return {pot,earn,pipe,weighted,by};}
function commLostOf(name){return COMMLOST.filter(x=>x.broker===name).reduce((s,x)=>s+(+x.amount||0),0);}
function commAutoLeaseDeal(u){try{
 if(!Array.isArray(window.LEASE_COMMISSION_DEALS))return; /* модуль комиссий аренды (v326) не загружен */
 if(window.LEASE_COMMISSION_DEALS.some(d=>d.unitId===u.id))return; /* по этому юниту уже есть сделка - не дублируем */
 const o=objById(u.obj),broker=String(u.broker||'').trim();
 window.LEASE_COMMISSION_DEALS.unshift({id:'lcd_auto_'+u.id+'_'+Date.now().toString(36),unitId:u.id,objectName:(o&&o.name)||u.obj||'',unit:u.code||'',tenant:commUnitBrand(u)||'',area:u.area||0,rate:u.rate||0,termMonths:12,signedDate:iso(TODAY),baseMethod:'manual',commissionBase:commFeeU(u)||0,currency:'USD',scenario:'external',stage:'signed',paymentStatus:'pending',agent1:broker,agent2:'',split1:100,split2:0,curator:'',support:'',broker:broker,notes:'Авто-создано при переходе в «Контракт подписан» (юнит '+(u.code||'')+').',createdAt:iso(TODAY),autoCreated:true});
}catch(e){}}
function commAutoCriticalDate(u){try{
 if(!Array.isArray(u.dates))u.dates=[];
 if(u.dates.some(d=>/окончание договора/i.test(d[0])))return; /* дата уже отслеживается - не дублируем */
 const end=new Date();end.setFullYear(end.getFullYear()+1);
 const endIso=end.toISOString().slice(0,10);
 u.dates.push(['Окончание договора (авто, уточнить)',endIso]);
 u.hist.push([iso(TODAY),'Авто-дата: Окончание договора '+endIso+' (по умолчанию 12 мес. от подписания - требует уточнения)']);
}catch(e){}}
function commTrack(u,prevBroker,prevStatus,forceReason){try{
 if(u.status==='cd'&&prevStatus!=='cd'){commAutoLeaseDeal(u);commAutoCriticalDate(u);}
 const pb=String(prevBroker||'').trim();if(!pb||pb==='-')return;
 if(COMM_PIPE.indexOf(prevStatus)<0&&prevStatus!=='cd')return; /* юнит и так был без сделки — терять нечего */
 const amt=Math.round(commFeeU(u)*commAgentPct(pb)/100);if(!amt)return;
 const nb=String(u.broker||'').trim();
 let reason=forceReason||'';
 if(!reason){
  if(nb!==pb)reason=(nb&&nb!=='-')?('юнит передан агенту: '+nb):'юнит снят с агента';
  else if(u.status==='vac'&&prevStatus!=='vac')reason='сделка сорвалась — юнит снова вакантен';
  else return;
 }
 COMMLOST.push({at:nowMin(),broker:pb,unit:u.code,obj:(objById(u.obj)||{}).name||u.obj,amount:amt,reason});
 if(COMMLOST.length>400)COMMLOST.splice(0,COMMLOST.length-400);
}catch(e){}}
function commSetPct(v){if(!R().admin)return;COMMCFG=(COMMCFG&&!Array.isArray(COMMCFG))?COMMCFG:{};COMMCFG.agentPct=Math.max(0,Math.min(100,+v||0));audit('Комиссии: доля агента',COMMCFG.agentPct+'%');persist();if(BACKEND){clearTimeout(_saveT);apiPOST('state.php',{data:stateBlob()}).catch(()=>{});}go(S.view);}

let _UZK={};
function curMap(){return LANG==='uz'?UZMAP:LANG==='en'?ENMAP:null;}
function uzKeys(){const map=curMap();if(!map)return[];if(!_UZK[LANG])_UZK[LANG]=Object.keys(map).sort((a,b)=>b.length-a.length);return _UZK[LANG];}
function uzText(s){if(!s)return s;const map=curMap();if(!map)return s;const ex=map[s.trim()];if(ex)return s.replace(s.trim(),ex);if(!/[А-Яа-яЁё]/.test(s))return s;let out=s;const keys=uzKeys();for(let i=0;i<keys.length;i++){const k=keys[i];if(k.length>=4&&out.indexOf(k)>=0)out=out.split(k).join(map[k]);}return out.split('м²').join('m²');}
/* localize() раньше решало "нужен ли перевод" по наличию кириллицы в ТЕКУЩЕМ тексте узла.
   Это ломалось при переключении между двумя нерусскими языками (напр. UZ → EN): после перевода на
   узбекский (латиница) кириллицы в тексте уже нет, проверка молча пропускала узел, и текст навсегда
   застревал на предыдущем нерусском языке до следующей полной перерисовки #main. Теперь оригинал на
   русском один раз запоминается в data-ru(-атрибут) на элементе и перевод всегда идёт от него, а не
   от того, что сейчас отображается — так работает переключение в любую сторону, включая обратно на RU. */
function localize(){try{if(!document.createTreeWalker)return;
 const conts=['main','drawer','perm'].map(id=>$(id)).filter(Boolean);const tb=document.querySelector('.topbar');if(tb)conts.push(tb);
 conts.forEach(r=>{const skip=r.querySelector?r.querySelector('#dprev'):null;
  const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT,null);const ns=[];let x;while(x=w.nextNode()){if(skip&&skip.contains(x))continue;ns.push(x);}
  ns.forEach(tn=>{const p=tn.parentElement;if(!p)return;
   let src=p.getAttribute('data-ru');
   if(src==null){if(!/[А-Яа-яЁё]/.test(tn.nodeValue))return;src=tn.nodeValue;p.setAttribute('data-ru',src);}
   const nv=LANG==='ru'?src:uzText(src);if(nv!==tn.nodeValue)tn.nodeValue=nv;
  });
  (r.querySelectorAll?r.querySelectorAll('[placeholder],[title],[aria-label]'):[]).forEach(el=>{if(skip&&skip.contains(el))return;
   ['placeholder','title','aria-label'].forEach(a=>{if(!el.hasAttribute(a))return;
    const dk='data-ru-'+a;let src=el.getAttribute(dk);
    if(src==null){const v=el.getAttribute(a);if(!/[А-Яа-яЁё]/.test(v))return;src=v;el.setAttribute(dk,src);}
    const nv=LANG==='ru'?src:uzText(src);if(nv!==el.getAttribute(a))el.setAttribute(a,nv);
   });
  });
 });}catch(e){}}

const _HEAVY_LOCAL_KEYS=['PLANSVG','PLANUP','PLAN_LABELPOS','GEO_DATA','PROJECT_PPT']; /* крупные base64/чертежи/гео — под нехватку места не кладём в localStorage (они на сервере) */
function persist(){
 let ok=false,_perr=null;
 // Аудит топбара #2: при работающем сервере крупные данные (чертежи/гео/картинки) НЕ дублируем в localStorage —
 // сервер источник, браузеру хватает ядра. Это проактивно предотвращает переполнение, а не лечит его постфактум.
 try{let _blob=stateBlob();if(BACKEND){_HEAVY_LOCAL_KEYS.forEach(k=>{try{delete _blob[k];}catch(_){}});}localStorage.setItem(STORAGE_KEY,JSON.stringify(_blob));ok=true;_localReduced=false;}
 catch(e){
  _perr=e;
  // Переполнение localStorage (QuotaExceededError): вместо тревоги «всё потеряно» — мягкая деградация.
  // Пробуем сохранить ЯДРО (юниты/бренды/реестр/CRM) без тяжёлых чертежей/картинок/гео. Это кэширует
  // важное; крупные данные и так хранятся на сервере (backend) и не помещаются в браузер.
  try{const b=stateBlob();_HEAVY_LOCAL_KEYS.forEach(k=>{try{delete b[k];}catch(_){}});localStorage.setItem(STORAGE_KEY,JSON.stringify(b));ok=true;_localReduced=true;}
  catch(e2){ok=false;}
 }
 if(ok){if(!BACKEND){_lastSavedAt=new Date();}if(_localSaveFailed){_localSaveFailed=false;}updateOfflineBadge();}
 else{
  _localSaveFailed=true;updateOfflineBadge();
  try{toast('⛔ Не удалось сохранить в этом браузере ('+(_perr&&_perr.name||'ошибка')+ ').'+(BACKEND?' Сервер тоже может быть недоступен —работа рискует потеряться.':' Освободите место в браузере, иначе изменения будут потеряны.'));}catch(e2){}
 }
 try{apiSaveState();}catch(e){}

/* ===== Сортируемая/фильтруемая таблица (Excel-стиль) ===== */
function tblS(key,k){S.tbl=S.tbl||{};const s=S.tbl[key]=S.tbl[key]||{filters:{},sort:null};if(!s.sort||s.sort.k!==k)s.sort={k,dir:1};else if(s.sort.dir>0)s.sort.dir=-1;else s.sort=null;S._focus=null;go(S.view);}
function tblF(key,k,v){S.tbl=S.tbl||{};const s=S.tbl[key]=S.tbl[key]||{filters:{},sort:null};s.filters[k]=v;S._focus='flt_'+key+'_'+k;go(S.view);}
function tblReset(key){if(S.tbl&&S.tbl[key]){S.tbl[key].filters={};S.tbl[key].sort=null;}S._focus=null;go(S.view);}
function tblFilterPass(c,r,fv){
 if(!c.filter)return true;
 if(fv==null||fv===''||fv==='Все')return true;
 const raw=String(fv).trim().replace(/,/g,'.').replace(/≤/g,'<=').replace(/≥/g,'>=');
 const got=c.get(r);
 if(c.filter==='number'||c.filter==='num'||c.filter==='range'){
  const val=(got==null||got==='')?0:(+got||0);
  let m;
  if((m=raw.match(/^(>=|≥)\s*(-?\d+(?:\.\d+)?)$/)))return val>=+m[2];
  if((m=raw.match(/^>\s*(-?\d+(?:\.\d+)?)$/)))return val>+m[1];
  if((m=raw.match(/^(<=|≤)\s*(-?\d+(?:\.\d+)?)$/)))return val<=+m[2];
  if((m=raw.match(/^<\s*(-?\d+(?:\.\d+)?)$/)))return val<+m[1];
  if((m=raw.match(/^(-?\d+(?:\.\d+)?)\s*[-–—]\s*(-?\d+(?:\.\d+)?)$/))){const a=Math.min(+m[1],+m[2]),b=Math.max(+m[1],+m[2]);return val>=a&&val<=b;}
  if((m=raw.match(/^=?\s*(-?\d+(?:\.\d+)?)$/)))return val===+m[1];
  return String(got==null?'':got).toLowerCase().indexOf(raw.toLowerCase())>=0;
 }
 const val=(got==null?'':String(got));
 return c.filter==='select'?val===raw:val.toLowerCase().indexOf(raw.toLowerCase())>=0;
}
function buildTable(key,cols,rows,opts){opts=opts||{};S.tbl=S.tbl||{};const st=S.tbl[key]=S.tbl[key]||{filters:{},sort:null};
 let data=rows.filter(r=>cols.every(c=>tblFilterPass(c,r,st.filters[c.k])));
 if(st.sort){const c=cols.find(x=>x.k===st.sort.k);if(c)data=data.slice().sort((a,b)=>{let va=c.get(a),vb=c.get(b);if(c.num){return((+va||0)-(+vb||0))*st.sort.dir;}va=(va==null?'':String(va)).toLowerCase();vb=(vb==null?'':String(vb)).toLowerCase();return va<vb?-st.sort.dir:va>vb?st.sort.dir:0;});}
 const arrow=c=>!c.sortable?'':(st.sort&&st.sort.k===c.k?(st.sort.dir>0?' ▲':' ▼'):' <span style="opacity:.28">⇅</span>');
 const th=cols.map(c=>`<th${c.num?' class="num"':''}${c.sortable?` style="cursor:pointer;white-space:nowrap" onclick="tblS('${key}','${c.k}')"`:''}>${esc(c.label)}${arrow(c)}</th>`).join('');
 const distinct=c=>{const s=[];rows.forEach(r=>{const v=c.get(r);if(v!=null&&v!==''&&s.indexOf(String(v))<0)s.push(String(v));});return s.sort();};
 const hasF=cols.some(c=>c.filter);
 const fr=hasF?('<tr class="fltrow">'+cols.map(c=>{if(!c.filter)return '<th></th>';const id='flt_'+key+'_'+c.k,cur=st.filters[c.k]||'';if(c.filter==='select'){return `<th><select id="${id}" onchange="tblF('${key}','${c.k}',this.value)" style="width:100%;font-family:inherit;font-size:11px;padding:4px;border:1px solid var(--border);border-radius:6px;font-weight:400">${['Все'].concat(distinct(c)).map(o=>`<option${cur===o?' selected':''}>${esc(o)}</option>`).join('')}</select></th>`;}const ph=(c.filter==='number'||c.filter==='num'||c.filter==='range')?'≥100 / ≤300 / 70-300':'фильтр…';return `<th><input id="${id}" value="${esc(cur)}" oninput="tblF('${key}','${c.k}',this.value)" placeholder="${ph}" style="width:100%;font-family:inherit;font-size:11px;padding:4px;border:1px solid var(--border);border-radius:6px;font-weight:400;text-transform:none"></th>`;}).join('')+'</tr>'):'';
 const body=data.map(r=>{const cls=[opts.rowClick?'click':'',opts.rowClass?opts.rowClass(r):''].filter(Boolean).join(' ');const clickAttr=opts.rowClick?` onclick="${opts.rowClick(r)}"`:'';const styleAttr=opts.rowStyle?` style="${opts.rowStyle(r)}"`:'';return `<tr${cls?` class="${cls}"`:''}${styleAttr}${clickAttr}>`+cols.map(c=>`<td${c.num?' class="num"':''}>${c.render?c.render(r):esc(c.get(r))}</td>`).join('')+'</tr>';}).join('')||`<tr><td colspan="${cols.length}" style="color:var(--muted)">Ничего не найдено.</td></tr>`;
 const cnt=(data.length!==rows.length)?`<span style="font-size:11px;color:var(--muted);margin-left:8px">${data.length} / ${rows.length}</span>`:'';
 return `<div class="tbl-scroll"><table><thead><tr>${th}</tr>${fr}</thead><tbody>${body}</tbody></table></div>${hasF?`<div style="margin-top:7px"><button class="btn ghost sm" onclick="tblReset('${key}')">Сбросить фильтры и сортировку</button>${cnt}</div>`:''}`;
}


/* Верхний синхронный ползунок для всех широких таблиц + видимый нижний */
function syncTblScroll(){document.querySelectorAll('.tbl-scroll').forEach(sc=>{const tb=sc.querySelector('table');if(!tb)return;let top=sc.previousElementSibling;
 if(!(top&&top.classList&&top.classList.contains('tbl-scroll-top'))){top=document.createElement('div');top.className='tbl-scroll-top';top.appendChild(document.createElement('div'));sc.parentNode.insertBefore(top,sc);

  sc.addEventListener('scroll',()=>{if(sc._lk)return;top._lk=1;top.scrollLeft=sc.scrollLeft;top._lk=0;},{passive:true});}
 const need=tb.scrollWidth;top.firstElementChild.style.width=need+'px';top.style.display=need>sc.clientWidth+4?'':'none';});}

function commStatusBars(by){const ks=Object.keys(by||{}).filter(k=>by[k]>0);if(!ks.length)return '<div style="font-size:12px;color:var(--muted)">Пока нет юнитов с комиссией — проверьте % комиссии в карточке объекта и назначьте брокеров.</div>';const mx=Math.max.apply(null,ks.map(k=>by[k]));return '<div>'+ks.sort((a,b)=>by[b]-by[a]).map(k=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span class="st ${STCLS[k]}">${stT(k)}</span><span>${fmt(by[k])}</span></div><div class="bw"><div class="bar" style="width:${Math.round(by[k]/mx*100)}%;background:${barColor(k)}"></div></div></div>`).join('')+'</div>';}
function commDashCard(){
 if(!commTeamAccess())return '';
 const all=unitsOf(S.obj);
 const brokers=commBrokerList(all);
 const sel=(S.commAgent&&(S.commAgent==='ALL'||brokers.indexOf(S.commAgent)>=0))?S.commAgent:'ALL';
 const us=sel==='ALL'?all:all.filter(u=>String(u.broker||'').trim()===sel);
 const B=commBook(us,commFeeU);
 const lostAg=sel==='ALL'?COMMLOST.reduce((s,x)=>s+(+x.amount||0),0):commLostOf(sel);
 const agLbl=LANG==='uz'?'Agent boʻyicha filtr':LANG==='en'?'Filter by agent':'Фильтр по агенту';
 const pctLbl=LANG==='uz'?'Agent ulushi, %':LANG==='en'?'Agent share, %':'Доля агента, %';
 const selHtml=brokers.length?`<select aria-label="${esc(agLbl)}" onchange="S.commAgent=this.value;renderDash()" onclick="event.stopPropagation()" style="font-family:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:8px">
  <option value="ALL">Все агенты</option>${brokers.map(b=>`<option value="${esc(b)}"${sel===b?' selected':''}>${esc(b)}</option>`).join('')}</select>`:'';
 const pctInp=R().admin?`<span style="font-size:11px;color:var(--muted)"><label for="commAgentPct">Доля агента, %:</label></span><input id="commAgentPct" aria-label="${esc(pctLbl)}" type="number" min="0" max="100" value="${+((COMMCFG&&COMMCFG.agentPct)||0)}" onchange="commSetPct(this.value)" style="width:58px;font-family:inherit;font-size:12px;padding:5px;border:1px solid var(--border);border-radius:7px;text-align:right">`:'';
 const rows=brokers.map(b=>{const bu=all.filter(u=>String(u.broker||'').trim()===b);const K=commBook(bu,commFeeU);const A=commAgentBook(bu);const pct=commAgentPct(b);return {b,n:bu.length,K,A,pct,lost:commLostOf(b)};}).sort((a,b)=>b.A.pipe-a.A.pipe||b.A.earn-a.A.earn);
 const cmp=rows.length?`<h4 style="margin:14px 0 6px;font-size:12.5px">Бонусы команды <span class="mut">командный обзор доступен по правам Финансы / Согласование / Администрирование · остальные видят только себя</span></h4><div class="tbl-scroll"><table><thead><tr><th>Сотрудник</th><th class="num">Юнитов</th><th class="num">Накоплено</th><th class="num">Придёт при закрытии</th><th class="num">Weighted forecast</th><th class="num">Упущено</th><th class="num">Доля</th><th class="num">CASE pipeline</th></tr></thead><tbody>${rows.map(r=>`<tr style="cursor:pointer" onclick="S.commAgent='${esc(r.b)}';renderDash()"><td><b>${esc(r.b)}</b></td><td class="num">${r.n}</td><td class="num" style="color:var(--green)"><b>${fmt(r.A.earn)}</b></td><td class="num">${fmt(r.A.pipe)}</td><td class="num">${fmt(r.A.weighted)}</td><td class="num" style="color:var(--red-d)">${r.lost?'−'+fmt(r.lost).slice(1)+' $':'—'}</td><td class="num">${r.pct}%</td><td class="num">${fmt(r.K.pipe)}</td></tr>`).join('')}</tbody></table></div>`:'';
 const topAgent=rows[0];
 const closeBonus=sel==='ALL'?rows.reduce((s,r)=>s+r.A.pipe,0):commAgentBook(us).pipe;
 const weighted=sel==='ALL'?rows.reduce((s,r)=>s+r.A.weighted,0):commAgentBook(us).weighted;
 const earnedAgent=sel==='ALL'?rows.reduce((s,r)=>s+r.A.earn,0):commAgentBook(us).earn;
 return `<div class="card"><h3 style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">💰 Комиссия / бонусы <span class="mut">${sel==='ALL'?'команда + CASE':'сотрудник: '+esc(sel)}</span><span style="margin-left:auto;display:flex;gap:8px;align-items:center">${pctInp}${selHtml}</span></h3>
 <div class="kpis" style="grid-template-columns:repeat(5,1fr);margin-bottom:10px">
  <div class="kpi"><div class="lab">CASE в работе</div><div class="val">${fmt(B.pipe)}</div><div class="sub2">комиссия компании</div></div>
  <div class="kpi"><div class="lab">Бонус накоплен</div><div class="val" style="color:var(--green)">${fmt(earnedAgent)}</div><div class="sub2">по подписанным</div></div>
  <div class="kpi"><div class="lab">Бонус при закрытии</div><div class="val">${fmt(closeBonus)}</div><div class="sub2">текущий pipeline</div></div>
  <div class="kpi"><div class="lab">Weighted forecast</div><div class="val">${fmt(weighted)}</div><div class="sub2">с учётом стадии</div></div>
  <div class="kpi"><div class="lab">Упущено</div><div class="val" style="color:var(--red-d)">${fmt(lostAg)}</div><div class="sub2">сорвано / передано</div></div>
 </div>
 ${commStatusBars(B.by)}${cmp}
 <div style="font-size:11px;color:var(--muted);margin-top:8px">Модель: комиссия CASE = годовая аренда × % проекта. Бонус сотрудника = комиссия CASE × его доля. Weighted forecast: переговоры 20%, КП 40%, LOI 65%, договор на подписании 85%, резерв 50%. ${topAgent?`Лидер по текущему бонусному pipeline: ${esc(topAgent.b)} (${fmt(topAgent.A.pipe)}).`:''}</div></div>`;
}
/* 💰 Личная комиссия агента — видит только свои цифры */
function commMyCard(){

 <div class="kpis" style="grid-template-columns:repeat(5,1fr);margin-bottom:10px">
  <div class="kpi"><div class="lab">Накоплено</div><div class="val" style="color:var(--green)">${fmt(B.earn)}</div><div class="sub2">подписанные сделки</div></div>

  <div class="kpi"><div class="lab">Weighted forecast</div><div class="val">${fmt(B.weighted)}</div><div class="sub2">с учётом стадии</div></div>
  <div class="kpi"><div class="lab">Упущено</div><div class="val" style="color:var(--red-d)">${fmt(lost)}</div><div class="sub2">сорвалось / передано</div></div>
  <div class="kpi"><div class="lab">Доля</div><div class="val">${pct}%</div><div class="sub2">от комиссии CASE</div></div>
 </div>
 ${commStatusBars(B.by)}
 ${deals.length?`<h4 style="margin:12px 0 4px;font-size:12.5px">Мои бонусы по сделкам</h4><div class="tbl-scroll"><table><thead><tr><th>Помещение</th><th>Бренд</th><th>Статус</th><th class="num">При закрытии</th><th class="num">Weighted</th></tr></thead><tbody>${deals.map(u=>`<tr onclick="openUnit('${u.id}')" style="cursor:pointer"><td><b>${esc(u.code)}</b><div style="font-size:10px;color:var(--muted)">${esc((objById(u.obj)||{}).name||u.obj)}</div></td><td>${esc(commUnitBrand(u))}</td><td><span class="st ${STCLS[u.status]}">${stT(u.status)}</span></td><td class="num">${fmt(commAgentFeeU(u))}</td><td class="num">${fmt(commAgentWeightedU(u))}</td></tr>`).join('')}</tbody></table></div>`:''}
 ${lostList.length?`<h4 style="margin:12px 0 4px;font-size:12.5px">Упущенная комиссия</h4>${lostList.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:5px 0;border-bottom:1px dashed var(--border)"><span>${esc(x.unit)} · ${esc(x.obj)} <span class="mut">${esc(x.reason)} · ${esc(x.at||'')}</span></span><span style="color:var(--red-d);white-space:nowrap">−${fmt(x.amount).slice(1)} $</span></div>`).join('')}`:''}
 <div style="font-size:11px;color:var(--muted);margin-top:8px">Суммы — ваша доля от комиссии CASE. Когда сделка меняет стадию, прогноз автоматически меняется; если юнит передали или сделка сорвалась, сумма попадает в «упущено».</div></div>`;
}

 const totGla=scope.reduce((s,o)=>s+o.gla,0),totOcc=scope.reduce((s,o)=>s+occArea(o.id),0),op=totGla?Math.round(totOcc/totGla*100):0;
 const totRent=scope.reduce((s,o)=>s+monthRent(o.id),0),totNoi=scope.reduce((s,o)=>s+noi(o.id),0);
 const offered=sU.filter(u=>u.status==='off').length,loi=sU.filter(u=>u.status==='os'||u.status==='cs').length;

 const avgOcc=Math.round(scope.reduce((s,o)=>s+occPct(o.id),0)/scope.length*100);
 const avgSc=Math.round(scope.reduce((s,o)=>s+o.sc,0)/scope.length);
 const lost=sU.filter(u=>u.gap<0).reduce((s,u)=>s+u.gap,0);

 const maxA=Math.max(...byStat.map(x=>x.area),1);
 const C=2*Math.PI*52,off=C*(1-totOcc/totGla);

 <p class="sub">${S.obj==='ALL'?t('allobj'):t('objectlb')+': '+curObj().name} · ${t('rolelb')}: ${R().label}</p>

  <div class="kpis">
   <div class="kpi"><div class="lab">${S.obj==='ALL'?t('objects'):t('objectlb')}</div><div class="val">${S.obj==='ALL'?scope.length:1}</div><div class="sub2">${S.obj==='ALL'?scope.filter(o=>o.plan==='Подписка ТЦ').length+' '+t('subSaaS'):(curObj().city||'')}</div></div>
   <div class="kpi"><div class="lab">${t('occupancy')}</div><div class="val">${op}%</div><div class="sub2">${fmtA(totOcc)} / ${fmtA(totGla)} м²</div></div>

   <div class="kpi"><div class="lab">${fin?t('noimo'):t('rentmo')}</div><div class="val">${fin?fmt(totNoi):fmt(totRent)}</div><div class="sub2">${fin?'NOI':'-'}</div></div>
  </div>
  ${actionCenterHTML(scope,sU)}
  <div class="card"><h3>${t('avg')} <span class="mut">${S.obj==='ALL'?t('portfolio'):curObj().name}</span></h3><div class="kpis" style="margin-bottom:0">
  <div class="kpi"><div class="lab">${t('avgocc')}</div><div class="val">${avgOcc}%</div><div class="sub2">${t('byobj')}</div></div>
  <div class="kpi"><div class="lab">${t('avgrate')}</div><div class="val">${avgRate.toFixed(1)}<small> $/м²</small></div><div class="sub2">${t('byocc')}</div></div>
  <div class="kpi"><div class="lab">${t('avgsc')}</div><div class="val">${avgSc}%</div><div class="sub2">${t('ofrent')}</div></div>
  <div class="kpi"><div class="lab">${t('lossvac')}</div><div class="val">${fin?fmt(Math.abs(lost)):'•••'}</div><div class="sub2">${t('permonth')}</div></div>

 <div class="grid2">

  <div><div class="card"><h3>${t('occport')}</h3><div style="display:flex;align-items:center;gap:16px"><svg width="120" height="120" viewBox="0 0 130 130"><circle cx="65" cy="65" r="52" fill="none" stroke="#eee" stroke-width="16"/><circle cx="65" cy="65" r="52" fill="none" stroke="var(--red)" stroke-width="16" stroke-dasharray="${C}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 65 65)"/><text x="65" y="61" text-anchor="middle" font-size="25" font-weight="800">${op}%</text><text x="65" y="80" text-anchor="middle" font-size="10" fill="#888">${t('occupied').toLowerCase()}</text></svg><div class="legend"><div><span class="dot" style="background:var(--red)"></span>${t('occupied')} ${fmtA(totOcc)} м²</div><div><span class="dot" style="background:#eee"></span>${t('free')} ${fmtA(totGla-totOcc)} м²</div></div></div></div>

 ${commDashCard()}${commMyCard()}
 ${blockBreakdownCard()}${floorBreakdownCard()}${planFactCard()}${vacancyLossCard()}${noiForecastCard()}${chartsCard()}
 <div class="card"><h3>${t('statuses')} <span class="mut">${S.obj==='ALL'?t('allobj'):curObj().name}</span></h3>${byStat.map(x=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span class="st ${STCLS[x.k]}">${stT(x.k)}</span><span>${fmtA(x.area)} м² · ${x.n}</span></div><div class="bw"><div class="bar" style="width:${Math.round(x.area/maxA*100)}%;background:${barColor(x.k)}"></div></div></div>`).join('')}</div>
 ${footNote()}`;
}
function barColor(k){return{vac:'#bbb',neg:'var(--blue)',off:'var(--red)',os:'var(--teal)',cs:'var(--amber)',cd:'var(--green)',res:'var(--purple)'}[k];}
function geoFilterBar(){const cs=objCountries(),allCities=objCities('Все');if(cs.length<=1&&allCities.length<=1)return '';const cur=S.geoCountry||'Все';const cities=objCities(cur);
 const esq=s=>String(s).replace(/'/g,"\\'");
 let h='<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">';
 h+='<span style="font-size:11px;color:var(--muted);margin-right:2px">Страна:</span>';
 h+=[['Все','Все страны']].concat(cs.map(c=>[c,c])).map(c=>`<button class="thbtn${cur===c[0]?' on':''}" onclick="S.geoCountry='${esq(c[0])}';S.geoCity='Все';renderDash()">${esc(c[1])}</button>`).join('');
 if(cities.length>1){h+='<span style="font-size:11px;color:var(--muted);margin:0 2px 0 6px">Город:</span>';h+=[['Все','Все']].concat(cities.map(c=>[c,c])).map(c=>`<button class="thbtn${(S.geoCity||'Все')===c[0]?' on':''}" onclick="S.geoCity='${esq(c[0])}';renderDash()">${esc(c[1])}</button>`).join('');}
 h+='</div>';return h;}
function hasGeo(o){return o.lat!=null&&o.lng!=null&&isFinite(o.lat)&&isFinite(o.lng);}
function gmapUrl(o){if(hasGeo(o))return 'https://www.google.com/maps/search/?api=1&query='+o.lat+','+o.lng;return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((o.name||'')+' '+(o.city||'')+' '+objCountry(o));}
function gisUrl(o){if(hasGeo(o))return 'https://2gis.uz/geo/'+o.lng+','+o.lat;return 'https://2gis.uz/search/'+encodeURIComponent((o.name||'')+' '+(o.city||''));}
function yandexMapUrl(o){if(hasGeo(o))return 'https://yandex.ru/maps/?pt='+o.lng+','+o.lat+'&z=17&l=map';return 'https://yandex.ru/maps/?text='+encodeURIComponent((o.name||'')+' '+(o.city||'')+' '+objCountry(o));}
function planFactCard(){if(!R().finance)return '';const us=[];geoObjects().forEach(o=>unitsOf(o.id).forEach(u=>us.push(u)));if(!us.length)return '';
 const plan=us.reduce((s,u)=>s+uBudgetTotal(u),0);
 const signed=us.filter(u=>u.status==='cd').reduce((s,u)=>s+(u.total||0),0);
 const working=us.filter(u=>['os','cs','off'].indexOf(u.status)>=0).reduce((s,u)=>s+(u.total||0),0);

/* №6: пофильтровые колонки в Реестре (LCR) — как у брендов. Переиспользуем tblFilterPass (число/текст/select). */
function _regFCols(){return [
 {k:'code',filter:'text',get:x=>x.code},
 {k:'block',filter:'select',get:x=>unitBlock(x)},
 {k:'floor',filter:'select',get:x=>floorLabel(x.floor)},
 {k:'cat',filter:'select',get:x=>x.cat},
 {k:'area',filter:'number',get:x=>x.area},
 {k:'rate',filter:'number',get:x=>x.rate},
 {k:'budget',filter:'number',get:x=>uBudget(x)},
 {k:'vars',filter:'text',get:x=>(x.vars||[]).join(' ')},
 {k:'broker',filter:'select',get:x=>x.broker||''},
 {k:'status',filter:'select',get:x=>stT(x.status)}
];}
function regColMatch(u){const f=S.regColF;if(!f)return true;const cs=_regFCols();for(let i=0;i<cs.length;i++){const c=cs[i],fv=f[c.k];if(fv!=null&&fv!==''&&fv!=='Все'){if(!tblFilterPass(c,u,fv))return false;}}return true;}
function regColActive(){const f=S.regColF;return !!(f&&Object.keys(f).some(k=>f[k]!=null&&f[k]!==''&&f[k]!=='Все'));}
function regColFilter(k,v){S.regColF=S.regColF||{};S.regColF[k]=v;S._focus='rcf_'+k;go('registry');}
function regColReset(){S.regColF={};S._focus=null;go('registry');}

 const distinct=g=>{const s=[];us.forEach(u=>{const v=g(u);if(v!=null&&v!==''&&s.indexOf(String(v))<0)s.push(String(v));});return s.sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));};
 const sel=(k,g)=>{const cur=f[k]||'Все';return `<th><select id="rcf_${k}" onchange="regColFilter('${k}',this.value)" style="${RCFIN}">${['Все'].concat(distinct(g)).map(o=>`<option${cur===o?' selected':''}>${esc(o)}</option>`).join('')}</select></th>`;};
 const txt=(k,ph)=>{const cur=f[k]||'';return `<th><input id="rcf_${k}" value="${esc(cur)}" oninput="regColFilter('${k}',this.value)" placeholder="${ph||'фильтр…'}" style="${RCFIN};text-transform:none"></th>`;};
 const num=k=>txt(k,'≥100 / ≤300 / 70-300');
 let h='<tr class="fltrow">';
 if(canEdit)h+='<th></th>';
 h+=txt('code','код…');
 if(showBlk)h+=sel('block',u=>unitBlock(u));

 h+=sel('cat',u=>u.cat);
 h+=num('area')+num('rate')+num('budget');

function barRow(label,pct,suf,val){return `<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span>${esc(label)}</span><span>${val}${suf}</span></div><div class="bw"><div class="bar" style="width:${Math.max(3,Math.min(100,pct))}%"></div></div></div>`;}

 const catAgg={};objs.forEach(o=>unitsOf(o.id).forEach(u=>{if(!u.cat||u.cat==='-'||!u.rate)return;(catAgg[u.cat]=catAgg[u.cat]||{sum:0,n:0});catAgg[u.cat].sum+=u.rate;catAgg[u.cat].n++;}));const cats=Object.keys(catAgg);const maxR=Math.max(1,...cats.map(k=>catAgg[k].sum/catAgg[k].n));const rateBars=cats.map(k=>{const v=Math.round(catAgg[k].sum/catAgg[k].n);return barRow(k,Math.round(v/maxR*100),' $/м²',v);}).join('');

  const commRow=o=>{const ann=signedAnnual(o.id),fee=Math.round(ann*o.comm.total/100);const calc=fin?fmt(fee):'•••';let breakdown;if(o.comm.type==='milestone'){const each=Math.round(ann*2/100);breakdown=fin?`сделка ${fmt(each)} + этаж ${fmt(each)} + здание ${fmt(each)}`:'2% + 2% + 2%';}else breakdown=`${o.comm.total}% годовой аренды`;return `<tr><td><b>${o.name}</b></td><td>${o.comm.type==='milestone'?'Поэтапная (2/2/2)':'Фикс. %'}</td><td class="num">${fin?fmt(ann):'•••'}</td><td class="num"><b>${calc}</b></td><td style="font-size:11px;color:var(--muted)">${breakdown}</td></tr>`;};
  h+=`<div class="card"><h3>Комиссии по проектам <span class="mut">расчёт по подписанным сделкам · у каждого свои</span></h3><div class="tbl-scroll"><table><thead><tr><th>Объект</th><th>Модель</th><th class="num">Подписано (год. аренда)</th><th class="num">Комиссия CASE</th><th>Разбивка</th></tr></thead><tbody>${OBJECTS.map(commRow).join('')}</tbody></table></div><div style="font-size:11px;color:var(--muted);margin-top:8px">Creative Avenue: 2% за закрытие сделки + 2% за закрытие этажа + 2% за закрытие здания = 6%. Прочие объекты - фикс. % от годовой аренды. Модель настраивается на объекте.</div></div>`;}

 $('main').innerHTML=h+footNote();

 };

function quizUserKey(){return S.user?(BACKEND?S.user.id:(S.user.u||S.role)):'';}
function quizLoadUi(){try{return JSON.parse(localStorage.getItem(QUIZ_UI_KEY)||'{}');}catch(e){return {};}}
function quizSaveUi(o){try{localStorage.setItem(QUIZ_UI_KEY,JSON.stringify(o));}catch(e){}}
function quizStartTimer(){if(_quizTimerOn)return;_quizTimerOn=true;setTimeout(maybeShowQuiz,3000);setInterval(maybeShowQuiz,60000);}
function quizBank(){return (typeof QUIZ_BANK!=='undefined'&&Array.isArray(QUIZ_BANK))?QUIZ_BANK:[];}
function quizPick(){const bank=quizBank();if(!bank.length)return null;const uk=quizUserKey();const st=QUIZSTATS[uk];let seen=(st&&st.seen)||[];let pool=bank.filter(q=>seen.indexOf(q.id)<0);if(!pool.length)pool=bank;return pool[Math.floor(Math.random()*pool.length)];}
function maybeShowQuiz(){
 try{
  if(!S.user||!$('app')||$('app').classList.contains('hidden'))return;
  if(typeof document!=='undefined'&&document.hidden)return;
  if(isUserBusy())return;
  if($('quizPop'))return;
  const ui=quizLoadUi();const today=iso(TODAY);
  if(ui.day!==today){ui.day=today;ui.shown=0;}
  if((ui.shown||0)>=QUIZ_DAILY_MAX)return;
  if(ui.lastAt&&Date.now()-ui.lastAt<QUIZ_COOLDOWN_MS)return;
  const q=quizPick();if(!q)return;
  ui.shown=(ui.shown||0)+1;ui.lastAt=Date.now();quizSaveUi(ui);
  quizRenderPopup(q);
 }catch(e){}
}

let _quizPerm=null; /* порядок показа вариантов: перемешивается на каждый показ, но не меняется при переключении языка */
function quizRenderPopup(q){
 if(_quizCurrent!==q||!_quizPerm){_quizPerm=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[_quizPerm[i],_quizPerm[j]]=[_quizPerm[j],_quizPerm[i]];}}
 _quizCurrent=q;
 const ql=q[LANG]||q.ru;
 let box=$('quizPop');if(!box){box=document.createElement('div');box.id='quizPop';box.className='quizpop';document.body.appendChild(box);}
 box.innerHTML=`<div class="quizpop-h"><b>${esc(quizT('title'))}</b><button class="quizpop-x" onclick="quizMinimize()" title="${esc(quizT('min'))}">–</button></div>
  <div class="quizpop-body">

   <div class="quizpop-fb" style="display:none"></div>
  </div>`;
}
function quizAnswer(idx){
 const q=_quizCurrent;if(!q)return;const box=$('quizPop');if(!box)return;
 const ql=q[LANG]||q.ru;const perm=_quizPerm||[0,1,2];
 const correct=(perm[idx]===ql.c);const cpos=perm.indexOf(ql.c);
 [...box.querySelectorAll('.quizpop-opt')].forEach((b,i)=>{b.disabled=true;if(i===cpos)b.classList.add('ok');else if(i===idx)b.classList.add('bad');});

}
function quizRecordAnswer(q,idx,correct){if(Array.isArray(QUIZSTATS))QUIZSTATS={};
 const uk=quizUserKey();if(!uk)return;
 QUIZLOG.unshift({at:nowStr(),uk,name:S.user.name,qid:q.id,cat:q.cat,logic:!!q.logic,correct:correct?1:0,lang:LANG});
 if(QUIZLOG.length>3000)QUIZLOG.length=3000;
 const st=QUIZSTATS[uk]=QUIZSTATS[uk]||{name:S.user.name,total:0,correct:0,logicTotal:0,logicCorrect:0,cats:{},seen:[],lastAt:''};
 st.name=S.user.name;st.total++;if(correct)st.correct++;
 if(q.logic){st.logicTotal++;if(correct)st.logicCorrect++;}
 st.cats[q.cat]=st.cats[q.cat]||{total:0,correct:0};st.cats[q.cat].total++;if(correct)st.cats[q.cat].correct++;
 if(st.seen.indexOf(q.id)<0)st.seen.push(q.id);

 persist();

/* ===== PLANS ===== */
const PLANUP={};
const PLANSVG={}; /* ключ objId::этаж -> {kind:'svg'|'img', data, by, date} - чертёж этажа */
const PLAN_LABELPOS={}; /* ключ objId::этаж -> {код: {dx,dy}} - сдвиги подписей (перетаскивание) */
let MAPCFG={apikey:''}; /* общий на всю компанию ключ Яндекс.Карт (admin вводит один раз) */
const PLAN_STRUCT={}; /* #4: персистентная иерархия планировок { [objId]:{blocks:[name...],floors:{[block||'']:[name...]}} } - блоки/этажи как отдельные записи, новый блок не затирает предыдущий */
function planStruct(objId){if(!PLAN_STRUCT[objId])PLAN_STRUCT[objId]={blocks:[],floors:{}};const s=PLAN_STRUCT[objId];if(!Array.isArray(s.blocks))s.blocks=[];if(!s.floors||typeof s.floors!=='object')s.floors={};return s;}
const PLAN_CODES={}; /* ключ objId::блок::этаж -> [{code,area}] коды с последнего чертежа (для сверки с реестром) */
let PLAN_LAST_DUPS=[]; /* коды, встретившиеся на чертеже 2+ раза при последнем разборе (не сохраняется - только для предупреждения) */
function floorLabel(f){f=(f==null?'':String(f)).trim();return f||'Без этажа';}
function floorCmp(a,b){const na=parseFloat(String(a).replace(/[^0-9.\-]/g,'')),nb=parseFloat(String(b).replace(/[^0-9.\-]/g,''));const aa=isNaN(na)?9999:na,bb=isNaN(nb)?9999:nb;return aa-bb||String(a).localeCompare(String(b),'ru');}
/* ===== Блоки (некоторые объекты разделены на блоки, напр. Creative Avenue) ===== */
function unitBlock(u){return (u&&u.block)?String(u.block).trim():'';}
function blockFromCode(code){const m=String(code||'').match(/^([A-Za-zА-Яа-я]+\d*)[ _\-]/);return m?m[1]:'';}
function blocksOf(objId){
  /* #4: сначала персистентные блоки (в заданном порядке — поддержка переупорядочивания/переименования), потом производные из юнитов/чертежей */
  const ps=(PLAN_STRUCT[objId]&&Array.isArray(PLAN_STRUCT[objId].blocks))?PLAN_STRUCT[objId].blocks.map(x=>String(x).trim()).filter(Boolean):[];
  const set=[],extra=[];ps.forEach(b=>{if(set.indexOf(b)<0)set.push(b);});
  const add=b=>{b=(b==null?'':String(b)).trim();if(b&&set.indexOf(b)<0&&extra.indexOf(b)<0)extra.push(b);};
  unitsOf(objId).forEach(u=>add(unitBlock(u)));
  Object.keys(PLANSVG).forEach(k=>{const p=k.split('::');if(p[0]===objId&&p.length>=3&&p[1])add(p[1]);});
  if(S.planBlock)add(S.planBlock);
  extra.sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
  return set.concat(extra);
}
function hasBlocks(objId){return (PLAN_STRUCT[objId]&&PLAN_STRUCT[objId].blocks&&PLAN_STRUCT[objId].blocks.length>0)||unitsOf(objId).some(u=>unitBlock(u))||Object.keys(PLANSVG).some(k=>{const p=k.split('::');return p[0]===objId&&p.length>=3&&p[1];});}
function curBlock(){const bs=blocksOf(S.obj);if(!bs.length)return '';if(!S.planBlock||bs.indexOf(S.planBlock)<0)S.planBlock=bs[0];return S.planBlock;}
function floorsOf(objId,block,raw){
  /* #4: персистентные этажи блока в заданном порядке + производные из юнитов/чертежей.
     raw=true → без синтетического дефолта «1 этаж» и без временного S.planFloor (для проверки дубликатов). */
  const key=block||'';
  const ps=(PLAN_STRUCT[objId]&&PLAN_STRUCT[objId].floors&&Array.isArray(PLAN_STRUCT[objId].floors[key]))?PLAN_STRUCT[objId].floors[key].map(x=>String(x).trim()).filter(Boolean):[];
  const set=[],extra=[];ps.forEach(f=>{if(set.indexOf(f)<0)set.push(f);});
  const add=f=>{f=floorLabel(f);if(f&&set.indexOf(f)<0&&extra.indexOf(f)<0)extra.push(f);};
  unitsOf(objId).forEach(u=>{if(block&&unitBlock(u)!==block)return;add(u.floor);});
  Object.keys(PLANSVG).forEach(k=>{const p=k.split('::');if(p[0]!==objId)return;let kb='',kf='';if(p.length>=3){kb=p[1];kf=p.slice(2).join('::');}else{kf=p.slice(1).join('::');}if(block){if(kb!==block)return;}else if(kb)return;if(kf)add(kf);});
  if(!raw&&S.planFloor&&(key===(S.planBlock||'')))add(S.planFloor); /* временный этаж — только для текущего выбранного блока, не смешиваем между блоками */
  extra.sort(floorCmp);
  const all=set.concat(extra);
  if(!raw&&!all.length)all.push('1 этаж');
  return all;
}
function curFloor(){const fs=floorsOf(S.obj,curBlock());if(!S.planFloor||fs.indexOf(S.planFloor)<0)S.planFloor=fs[0];return S.planFloor;}
function planKey(objId,block,floor){return block?(objId+'::'+block+'::'+floor):(objId+'::'+floor);}
function planFor(objId,block,floor){return PLANSVG[planKey(objId,block,floor)]||null;}
function setPlanFloor(i){const fs=floorsOf(S.obj,curBlock());S.planFloor=fs[i]||fs[0];renderPlans();}
function addPlanFloor(){
  const f=prompt('Название этажа (например: «3 этаж», «Цоколь», «Минус 1»):');if(!f||!f.trim())return;
  const name=floorLabel(f.trim());const blk=curBlock()||'';const s=planStruct(S.obj);
  if(!Array.isArray(s.floors[blk]))s.floors[blk]=[];
  if(floorsOf(S.obj,curBlock(),true).indexOf(name)>=0){toast('Такой этаж уже есть');S.planFloor=name;return renderPlans();}
  s.floors[blk].push(name);S.planFloor=name;persist();toast('Этаж «'+name+'» добавлен');renderPlans();
}
function setPlanBlock(i){const bs=blocksOf(S.obj);S.planBlock=bs[i]||bs[0];S.planFloor=null;renderPlans();}
function addPlanBlock(){
  const b=prompt('Название блока (например: «B1», «B2», «Блок A»):');if(!b||!b.trim())return;
  const name=b.trim();const s=planStruct(S.obj);
  if(blocksOf(S.obj).indexOf(name)>=0){toast('Такой блок уже есть');S.planBlock=name;S.planFloor=null;return renderPlans();}
  s.blocks.push(name);S.planBlock=name;S.planFloor=null;persist();toast('Блок «'+name+'» добавлен');renderPlans();
}
/* #4: переименование/удаление блоков и этажей как отдельных записей, с миграцией привязанных данных (юниты, чертежи, подписи, коды) и защитой при удалении */
function _planKeysFor(objId,block,floor){/* возвращает список фактических ключей planKey, попадающих под (block[,floor]) */
  return Object.keys(PLANSVG).concat(Object.keys(PLAN_LABELPOS),Object.keys(PLAN_CODES)).filter((k,i,a)=>a.indexOf(k)===i).filter(k=>{
    const p=k.split('::');if(p[0]!==objId)return false;let kb='',kf='';if(p.length>=3){kb=p[1];kf=p.slice(2).join('::');}else{kf=p.slice(1).join('::');}
    if(block!=null&&kb!==(block||''))return false;if(floor!=null&&kf!==floor)return false;return true;});
}
function _migratePlanKey(oldKey,newKey){[PLANSVG,PLAN_LABELPOS,PLAN_CODES].forEach(M=>{if(M[oldKey]!=null){if(M[newKey]==null)M[newKey]=M[oldKey];delete M[oldKey];}});}
function renamePlanBlock(i){
  if(!(R().admin||R().plans||R().edit)){toast('Нет прав');return;}
  const bs=blocksOf(S.obj),old=bs[i];if(!old)return;
  const nv=prompt('Переименовать блок «'+old+'» в:',old);if(nv==null)return;const name=nv.trim();if(!name||name===old)return;
  if(bs.indexOf(name)>=0){toast('Блок «'+name+'» уже существует');return;}
  const s=planStruct(S.obj);
  const bi=s.blocks.indexOf(old);if(bi>=0)s.blocks[bi]=name;else s.blocks.push(name);
  if(s.floors[old]){s.floors[name]=(s.floors[name]||[]).concat(s.floors[old].filter(f=>(s.floors[name]||[]).indexOf(f)<0));delete s.floors[old];}
  unitsOf(S.obj).forEach(u=>{if(unitBlock(u)===old)u.block=name;});
  _planKeysFor(S.obj,old,null).forEach(k=>{const p=k.split('::');const kf=p.length>=3?p.slice(2).join('::'):p.slice(1).join('::');_migratePlanKey(k,planKey(S.obj,name,kf));});
  if(S.planBlock===old)S.planBlock=name;persist();toast('Блок переименован');renderPlans();
}
function delPlanBlock(i){
  if(!(R().admin||R().plans)){toast('Удаление блоков — только для админа/планировщика');return;}
  const bs=blocksOf(S.obj),old=bs[i];if(!old)return;
  const nUnits=unitsOf(S.obj).filter(u=>unitBlock(u)===old).length;
  const nPlans=_planKeysFor(S.obj,old,null).filter(k=>PLANSVG[k]).length;
  if(nUnits>0){alert('Нельзя удалить блок «'+old+'»: к нему привязано юнитов — '+nUnits+'. Сначала перенесите или архивируйте юниты.');return;}
  if(nPlans>0&&!confirm('В блоке «'+old+'» есть загруженные чертежи ('+nPlans+'). Удалить блок вместе с ними?'))return;
  if(!confirm('Удалить блок «'+old+'» без привязанных юнитов?'))return;
  const s=planStruct(S.obj);s.blocks=s.blocks.filter(b=>b!==old);delete s.floors[old];
  _planKeysFor(S.obj,old,null).forEach(k=>{delete PLANSVG[k];delete PLAN_LABELPOS[k];delete PLAN_CODES[k];});
  if(S.planBlock===old){S.planBlock=null;S.planFloor=null;}persist();toast('Блок удалён');renderPlans();
}
function renamePlanFloor(i){
  if(!(R().admin||R().plans||R().edit)){toast('Нет прав');return;}
  const blk=curBlock()||'',fs=floorsOf(S.obj,curBlock()),old=fs[i];if(!old)return;
  const nv=prompt('Переименовать этаж «'+old+'» в:',old);if(nv==null)return;const name=floorLabel(nv.trim());if(!name||name===old)return;
  if(fs.indexOf(name)>=0){toast('Этаж «'+name+'» уже существует');return;}
  const s=planStruct(S.obj);if(!Array.isArray(s.floors[blk]))s.floors[blk]=[];
  const fi=s.floors[blk].indexOf(old);if(fi>=0)s.floors[blk][fi]=name;else s.floors[blk].push(name);
  unitsOf(S.obj).forEach(u=>{if((unitBlock(u)===blk||(!blk&&!unitBlock(u)))&&floorLabel(u.floor)===old)u.floor=name;});
  _planKeysFor(S.obj,blk,old).forEach(k=>_migratePlanKey(k,planKey(S.obj,blk,name)));
  if(S.planFloor===old)S.planFloor=name;persist();toast('Этаж переименован');renderPlans();
}
function delPlanFloor(i){
  if(!(R().admin||R().plans)){toast('Удаление этажей — только для админа/планировщика');return;}
  const blk=curBlock()||'',fs=floorsOf(S.obj,curBlock()),old=fs[i];if(!old)return;
  const nUnits=unitsOf(S.obj).filter(u=>(unitBlock(u)===blk||(!blk&&!unitBlock(u)))&&floorLabel(u.floor)===old).length;
  const nPlans=_planKeysFor(S.obj,blk,old).filter(k=>PLANSVG[k]).length;
  if(nUnits>0){alert('Нельзя удалить этаж «'+old+'»: к нему привязано юнитов — '+nUnits+'. Сначала перенесите или архивируйте юниты.');return;}
  if(nPlans>0&&!confirm('На этаже «'+old+'» есть загруженный чертёж. Удалить этаж вместе с ним?'))return;
  if(!confirm('Удалить этаж «'+old+'» без привязанных юнитов?'))return;
  const s=planStruct(S.obj);if(Array.isArray(s.floors[blk]))s.floors[blk]=s.floors[blk].filter(f=>f!==old);
  _planKeysFor(S.obj,blk,old).forEach(k=>{delete PLANSVG[k];delete PLAN_LABELPOS[k];delete PLAN_CODES[k];});
  if(S.planFloor===old)S.planFloor=null;persist();toast('Этаж удалён');renderPlans();
}

function catFromLabel(s){const k=String(s||'').trim().toUpperCase().replace(/[.,;:!?]+$/,'');if(CODE_CAT_MAP[k])return CODE_CAT_MAP[k];

    а не x/y — тогда getBBox() возвращает координаты ДО этой матрицы (почти всегда ~0,0 для
    всех подписей сразу), и по расстоянию их отличить невозможно. Настоящую позицию на чертеже
    даёт только getBBox() в паре с getCTM() (учитывает все transform у элемента и его родителей). */

 const groups=[];const flat=[];
 svg.querySelectorAll('text').forEach(t=>{
   if(t.closest&&t.closest('[data-caseos-overlay]'))return;
   const tspans=t.querySelectorAll('tspan');
   const gp=posOf(t);const gcx=gp.cx,gcy=gp.cy;
   const lines=[];
   if(tspans.length>1){
     tspans.forEach(ts=>{const s=mtextClean(ts.textContent);if(!s)return;const p=posOf(ts);lines.push({s,cx:p.cx||gcx,cy:p.cy||gcy});});
   }else{
     const raw=mtextClean(t.textContent);if(!raw)return;
     const parts=raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
     (parts.length?parts:[raw]).forEach(s=>lines.push({s,cx:gcx,cy:gcy}));
   }
   if(!lines.length)return;
   const gi=groups.length;groups.push({lines});
   lines.forEach(l=>flat.push({s:l.s,cx:l.cx,cy:l.cy,g:gi}));
 });

 const codeTAll=flat.filter(o=>reCode.test(o.s.replace(/\s+/g,'')));
 {const already={};codeTAll.forEach(o=>already[o.s.replace(/\s+/g,'').toLowerCase()]=1);
  flat.forEach(o=>{if(reCode.test(o.s.replace(/\s+/g,'')))return;const m=o.s.match(reInline);if(m&&!already[m[1].toLowerCase()]){already[m[1].toLowerCase()]=1;codeTAll.push({s:m[1],cx:o.cx,cy:o.cy,g:o.g});}});}
 let md=0;{const ds=[];for(let i=0;i<codeTAll.length;i++){let best=Infinity;for(let j=0;j<codeTAll.length;j++){if(i!==j){const d=Math.hypot(codeTAll[i].cx-codeTAll[j].cx,codeTAll[i].cy-codeTAll[j].cy);if(d<best)best=d;}}if(isFinite(best))ds.push(best);}ds.sort((a,b)=>a-b);md=ds.length?ds[Math.floor(ds.length/2)]:0;}
 let svgDiag=0;try{const b=svg.getBBox();svgDiag=Math.hypot(b.width,b.height);}catch(e){}
 const thr=md?md*3:(svgDiag?svgDiag*0.12:Infinity);
 /* категория — более строгий радиус, чем площадь: сокращение вроде «РБП» относится к своему
    помещению, только если оно реально рядом (иначе лучше оставить пустым, чем угадать чужое) */

 const nearestArea=(cx,cy)=>{let best=thr,val=0;cands.forEach(c=>{const d=Math.hypot(c.cx-cx,c.cy-cy);if(d<best){best=d;val=c.val;}});return val;};

 const out=[];const seen={};const dups=[];
 groups.forEach(grp=>{
   let codeTok=null;
   const codeLine=grp.lines.find(l=>reCode.test(l.s.replace(/\s+/g,'')));

   else{const merged=mtextClean(grp.lines.map(l=>l.s).join(' '));const m=merged.match(reInline);if(m)codeTok=m[1];}

   const key=codeTok.toLowerCase();if(seen[key]){if(dups.indexOf(codeTok)<0)dups.push(codeTok);return;}seen[key]=1;
   const anchor=grp.lines.find(l=>l.s.replace(/\s+/g,'').toLowerCase()===key)||grp.lines[0];

   let area=0;
   for(const l of grp.lines){const c=combOf(l.s);if(c){area=c;break;}}
   if(!area)for(let i=0;i<grp.lines.length-1&&!area;i++){const c=combOf(grp.lines[i].s+' '+grp.lines[i+1].s);if(c)area=c;}
   if(!area){const cand=grp.lines.find(l=>{const tok=l.s.replace(/\s+/g,'');if(tok.toLowerCase()===key)return false;if(catFromLabel(l.s))return false;if(isUnit(l.s))return false;if(isBareExp(l.s))return false;const n=numOf(l.s);return n>=2&&n<=100000;});if(cand)area=numOf(cand.s);}
   if(!area)area=nearestArea(anchor.cx,anchor.cy);

   let cat='',sub='';
   for(const l of grp.lines){const c=catFromLabel(l.s);if(c){cat=c.cat;sub=c.sub;break;}}
   /* название категории может быть разбито на 2-3 строки подписи («ДЕТСКАЯ» + «ПЛОЩАДКА») — пробуем склейки соседних строк */
   if(!cat)for(let i=0;i<grp.lines.length-1&&!cat;i++){const c=catFromLabel(grp.lines[i].s+' '+grp.lines[i+1].s)||( i<grp.lines.length-2?catFromLabel(grp.lines[i].s+' '+grp.lines[i+1].s+' '+grp.lines[i+2].s):null);if(c){cat=c.cat;sub=c.sub;}}
   if(!cat){const nc=nearestCat(anchor.cx,anchor.cy);cat=nc.cat;sub=nc.sub;}

   out.push({code:codeTok,area:area||0,cat,sub});
 });
 PLAN_LAST_DUPS=dups;

function detectUnitsFromSvg(svg){const have={};unitsOf(S.obj).forEach(u=>have[String(u.code).trim().toLowerCase()]=1);return parsePlanLabels(svg).filter(r=>!have[r.code.toLowerCase()]);}
function planDiff(objId,block,floor,labels){const reg=unitsOf(objId).filter(u=>(!floor||floorLabel(u.floor)===floor)&&(!block||unitBlock(u)===block));const rc={};reg.forEach(u=>rc[String(u.code).trim().toLowerCase()]=u);const pc={};labels.forEach(l=>pc[l.code.toLowerCase()]=l);

 const objOpts=objs.map(o=>`<option value="${o.id}">${esc(o.name)} · ${esc(o.city||'')}</option>`).join('');
 const rows=ids.map(bid=>{const b=BRANDS.find(x=>x.id===bid);return b?`<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f2f0ed"><div style="flex:1;min-width:0"><b>${esc(b.name)}</b> <span class="mut" style="font-size:10px">${catDot(b.cat)}${esc(b.cat)}</span></div><select data-bid="${bid}" class="att-unit" style="font-family:inherit;font-size:12px;padding:5px;border:1px solid var(--border);border-radius:7px;max-width:230px"></select></div>`:'';}).join('');
 openModal(`<h3 style="margin:0 0 4px">📌 Прикрепить бренды к проекту</h3><p class="mut" style="font-size:11.5px;margin:4px 0 10px">Каждый бренд добавится в шорт-лист выбранного помещения как потенциальный арендатор (появится в карточке юнита и на планировке).</p><label style="font-size:11px;font-weight:600">Проект</label><select id="att_obj" onchange="attachUnitsRefill()" style="width:100%;font-family:inherit;font-size:13px;padding:7px;border:1px solid var(--border);border-radius:8px;margin:4px 0 10px">${objOpts}</select>${rows}<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="attachBrandsDo()">Прикрепить</button><button class="btn ghost" onclick="document.getElementById('rmodal').remove()">Отмена</button></div>`);
 attachUnitsRefill();}
function attachUnitsRefill(){const sel=$('att_obj');if(!sel)return;const us=unitsOf(sel.value).slice().sort((a,b)=>((a.status==='vac'?0:1)-(b.status==='vac'?0:1))||String(a.code).localeCompare(String(b.code)));
 const opts='<option value="">— выберите помещение —</option>'+us.map(u=>`<option value="${u.id}">${esc(u.code)} · ${fmtA(u.area)} м² · ${stT(u.status)}</option>`).join('');
 document.querySelectorAll('.att-unit').forEach(s=>{const v=s.value;s.innerHTML=opts;if(v&&[...s.options].some(o=>o.value===v))s.value=v;});}
function attachBrandsDo(){let n=0,skip=0;
 document.querySelectorAll('.att-unit').forEach(s=>{const bid=s.getAttribute('data-bid'),uid=s.value;if(!uid){skip++;return;}
  const b=BRANDS.find(x=>x.id===bid),u=U.find(x=>x.id===uid);if(!b||!u)return;
  u.shortlist=u.shortlist||[];if(u.shortlist.indexOf(b.name)<0){u.shortlist.push(b.name);u.hist.push([iso(TODAY),'Шорт-лист из базы брендов: +'+b.name+' ('+S.user.name+')']);(b.hist=b.hist||[]).push([iso(TODAY),S.user.name,'Прикреплён как потенциальный арендатор: '+((objById(u.obj)||{}).name||u.obj)+' · '+u.code]);n++;}});
 audit('Бренды прикреплены к помещениям','добавлено: '+n);persist();if(BACKEND){clearTimeout(_saveT);apiPOST('state.php',{data:stateBlob()}).catch(()=>{});}
 const m=$('rmodal');if(m)m.remove();S.brandSel=[];toast('Прикреплено: '+n+(skip?' · пропущено (юнит не выбран): '+skip:''));renderBrands();}

function brandCardPrint(id){const b=BRANDS.find(x=>x.id===id);if(!b)return;

 <h3 style="border-bottom:1px solid #ddd;padding-bottom:5px;margin-top:20px">Контактные лица</h3>

 <div style="margin-top:22px;font-size:11px;color:#6d6d6d">Карточка выгружена из CASE OS · ${esc(nowMin())} · ${esc(S.user?S.user.name:'')}</div>
 <div style="margin-top:14px"><button onclick="window.print()" style="padding:9px 18px;font-size:13px;cursor:pointer">Печать / сохранить PDF</button></div></body></html>`);
 w.document.close();}
function brandTouch(id){const b=BRANDS.find(x=>x.id===id);if(!b||!R().edit)return;b.lastContact=iso(TODAY);b.editedBy=S.user.name;b.editedAt=nowMin();(b.hist=b.hist||[]).push([iso(TODAY),S.user.name,'Отмечен контакт с брендом']);persist();openBrand(id);}
function brandFitsArea(b,area){area=+String(area||'').replace(',','.')||0;if(!area)return true;const mn=+b.amin||0,mx=+b.amax||0;return (!mn||mn<=area)&&(!mx||mx>=area);}

 ];
 $('main').innerHTML=`<div class="ph"><h1>${t('brands')}</h1><span class="pill">${BRANDS.length}</span></div>
  <p class="sub">Единая база ритейлеров · price level, brand level, min/max площадь вынесены отдельными колонками для точной фильтрации. Профиль PPTX, правки с историей.</p>
  ${pptxReady()?'':'<div class="banner warn">Библиотека PPTX не загрузилась в этом браузере. Для production лучше подключить PptxGenJS локально или разрешить CDN. Контактные данные по-прежнему не включаются в профиль ритейлера.</div>'}
  <div class="card"><div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${canEdit?'<button class="btn sm" onclick="brandEdit()">+ '+t('add')+'</button><button class="btn ghost sm" onclick="importBrandsCSV()">⬆ Импорт CSV</button><button class="btn ghost sm" onclick="brandDupScan()" title="Найти бренды с одинаковыми названиями и предложить объединение">⧉ Дубликаты</button>':''}<button class="btn ghost sm" onclick="exportBrandsCSV()">⬇ Экспорт CSV</button>${S.brandSel.length?`<button class="btn sm" onclick="attachBrandsFlow()">📌 Прикрепить к проекту (${S.brandSel.length})</button><button class="btn ghost sm" onclick="S.brandSel=[];renderBrands()">снять выделение</button>`:''}<label class="brand-fit-filter" style="margin-left:auto;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)">Подходит под м² <input value="${esc(S.brandFitArea||'')}" oninput="S.brandFitArea=this.value;renderBrands()" placeholder="например 120" style="width:112px;font-family:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--ink)"></label>${S.brandFitArea?'<button class="btn ghost sm" onclick="S.brandFitArea=null;renderBrands()">сброс м²</button>':''}</div>${buildTable('brands',cols,BRANDS.filter(b=>brandFitsArea(b,S.brandFitArea)),{rowClick:b=>`openBrand('${b.id}')`,rowStyle:b=>`background:${catHex(b.cat)}1f`} /* 12% тона категории: подстраивается и под светлую, и под тёмную тему */)}</div>

function _bTA(tt,id,val){return _bL(tt)+'<textarea id="'+id+'" style="width:100%;font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;min-height:50px">'+((val==null?'':val).toString().replace(/</g,'&lt;'))+'</textarea>';}

function deleteBrand(id){if(!R().edit){alert('Недостаточно прав.');return;}const b=BRANDS.find(x=>x.id===id);if(!b)return;if(!confirm('Удалить бренд «'+b.name+'»? Бренд будет перемещён в корзину.'))return;const i=BRANDS.indexOf(b);if(i>=0)BRANDS.splice(i,1);trashPut('brand',b.name,b);audit('Удалён бренд',b.name);closeDrawer();persist();go('brands');}
function brandSave(id){const b=BRANDS.find(x=>x.id===id);if(!b)return;const g=i=>{const e=$(i);return e?e.value:'';};
 b.name=g('e_name')||b.name;b.cat=g('e_cat');b.sub=g('e_sub');b.type=g('e_type');{const _a=$('e_alco');b.alcohol=_a?_a.checked:(catHasAlcohol(b.cat)?!!b.alcohol:false);}b.country=g('e_country');b.status=g('e_status');b.amin=+g('e_amin')||0;b.amax=+g('e_amax')||0;b.format=g('e_format');b.fr=g('e_fr');b.reqs=g('e_reqs');b.coten=g('e_coten');b.site=g('e_site');b.ig=g('e_ig');b.founded=g('e_founded');b.group=g('e_group');b.price=g('e_price');b.icsc=g('e_icsc');b.netPts=g('e_netPts');b.netCountries=g('e_netCountries');b.uzOp=g('e_uzOp');b.about=g('e_about');b.pos=g('e_pos');b.concept=g('e_concept');b.rec=g('e_rec');b.notes=g('e_notes');
 /* несколько контактных лиц: Имя | Должность | Телефон | Email (по строке) */
 b.owner=g('e_owner');b.tier=g('e_tier');b.lastContact=g('e_lastc');
 b.contacts=g('e_contacts').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());return {name:p[0]||'',title:p[1]||'',phone:p[2]||'',email:p[3]||''};}).filter(c=>c.name||c.phone||c.email);
 const c0=b.contacts[0]||{};b.person=c0.name||'';b.phone=c0.phone||'';b.email=c0.email||''; /* первый контакт — совместимость со старыми полями/PPTX */
 b.editedBy=S.user.name;b.editedAt=nowMin();(b.hist=b.hist||[]).push([iso(TODAY),S.user.name,'Правка карточки']);
 /* дубликат по названию? предложить объединить */
 const dup=BRANDS.find(x=>x.id!==b.id&&normBrandName(x.name)===normBrandName(b.name));
 if(dup&&confirm('В базе уже есть бренд с таким названием: «'+dup.name+'» (изменён: '+(dup.editedBy||'-')+' '+(dup.editedAt||'')+').\n\nOK — объединить: эта запись вольётся в существующую (пустые поля дополнятся, контакты объединятся, дубликат исчезнет).\nОтмена — оставить обе записи.')){
  brandMerge(dup.id,b.id);persist();openBrand(dup.id);return;
 }
 persist();openBrand(id);}
function normBrandName(s){return String(s||'').toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'');}
function brandMerge(keepId,dupId){const k=BRANDS.find(x=>x.id===keepId),d=BRANDS.find(x=>x.id===dupId);if(!k||!d||k===d)return;
 Object.keys(d).forEach(f=>{if(f==='id'||f==='hist'||f==='contacts')return;if((k[f]==null||k[f]===''||k[f]===0)&&d[f])k[f]=d[f];});
 const seen={};k.contacts=[...(k.contacts||[]),...(d.contacts||[])].filter(c=>{const key=((c.name||'')+'|'+(c.phone||'')+'|'+(c.email||'')).toLowerCase();if(!key.replace(/\|/g,'')||seen[key])return false;seen[key]=1;return true;});
 if(!k.person&&k.contacts[0]){k.person=k.contacts[0].name;k.phone=k.phone||k.contacts[0].phone;k.email=k.email||k.contacts[0].email;}
 (k.hist=k.hist||[]).push([iso(TODAY),S.user.name,'Объединён с дубликатом «'+d.name+'»']);
 k.editedBy=S.user.name;k.editedAt=nowMin();
 trashPut('brand',d.name+' (дубликат, объединён с «'+k.name+'»)',d);BRANDS.splice(BRANDS.indexOf(d),1);audit('Бренды: объединение дубликатов',k.name+' ← '+d.name);}
function brandDupScan(){if(!R().edit){alert('Нет прав на правки.');return;}

 const dups=Object.values(groups).filter(g2=>g2.length>1);
 if(!dups.length){alert('Дубликатов по названию не найдено — база чистая.');return;}
 let merged=0,kept=0;
 dups.forEach(g2=>{const keep=g2[0];
  for(let i=1;i<g2.length;i++){const d=g2[i];
   if(confirm('Дубликат: «'+keep.name+'» и «'+d.name+'».\n\nOK — объединить (вторая запись вольётся в первую: пустые поля дополнятся, контакты объединятся).\nОтмена — оставить обе.')){brandMerge(keep.id,d.id);merged++;}
   else kept++;}});
 persist();alert('Готово: объединено '+merged+', оставлено парами '+kept+'.');renderBrands();}

 const key=planKey(oid,st.block||'',st.floor||'');const up=PLANUP[key]||PLANUP[planKey(oid,'',st.floor||'')];

 else content=`<div id="mapPlanHost" style="width:100%">${planSVG(oid,st.block||'',st.floor)}</div>`;
 body.innerHTML=`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;color:var(--ink)"><b>${esc(o.name)}</b> ${bsel} ${ftabs}</div><div style="border:1px dashed #cfc9c1;border-radius:10px;padding:6px;background:#fbfaf8;max-height:430px;overflow:auto">${content}</div><div style="font-size:10.5px;color:var(--muted);margin-top:5px">Клик по помещению — карточка. Полный режим: <a href="#" style="color:var(--red-d)" onclick="S.obj='${oid}';S.planViewTab='plan';go('plans');return false">открыть Планировки →</a></div>`;

function hrOf(uk,name){if(Array.isArray(HRPROF))HRPROF={};HRPROF[uk]=HRPROF[uk]||{name:name||uk,langs:{},skills:{},hired:''};if(name)HRPROF[uk].name=name;return HRPROF[uk];}
function ratingRows(){
 const map={};
 Object.keys(QUIZSTATS).forEach(uk=>{map[uk]={uk,name:QUIZSTATS[uk].name||uk};});
 Object.keys(KBPROG).forEach(uk=>{map[uk]=map[uk]||{uk,name:(HRPROF[uk]&&HRPROF[uk].name)||uk};});
 Object.keys(HRPROF).forEach(uk=>{map[uk]=map[uk]||{uk,name:HRPROF[uk].name||uk};if(HRPROF[uk].name)map[uk].name=HRPROF[uk].name;});
 if(!BACKEND)USERS.forEach(u=>{const uk=u.u||u.role;map[uk]=map[uk]||{uk,name:u.name};});
 if(S.user){const uk=quizUserKey();map[uk]=map[uk]||{uk,name:S.user.name};}
 return Object.values(map).map(r=>{
  const qs=QUIZSTATS[r.uk]||{total:0,correct:0,logicTotal:0,logicCorrect:0};
  const acc=qs.total?qs.correct/qs.total:0;
  const quizPts=Math.round(acc*50+Math.min(qs.total,300)/300*50);
  const logicAcc=qs.logicTotal?qs.logicCorrect/qs.logicTotal:0;
  const logicPts=Math.round(logicAcc*20);
  const prog=KBPROG[r.uk]||{};const courses=Object.values(prog).filter(p=>p.passed).length;
  const coursePts=Math.min(courses*15,150);
  const hp=HRPROF[r.uk]||{langs:{},skills:{},hired:''};
  const langPts=Math.min(Object.values(hp.langs||{}).reduce((s,v)=>s+(+v||0),0)*5,60);
  const skillPts=Math.min(Object.values(hp.skills||{}).reduce((s,v)=>s+(+v||0),0)*2,60);
  let days=0;if(hp.hired){days=Math.max(0,Math.floor((TODAY-new Date(hp.hired))/86400000));} /* стаж в днях от даты приёма */
  const tenurePts=Math.min(Math.round(days*10/365),100); /* 10 баллов за год, пропорционально по дням */
  const ag=(AGENTS||[]).find(a=>a.u===r.uk||a.user_id===r.uk||a.id===r.uk);
  const actPts=ag?Math.min((+ag.sign||0)*20+(+ag.loi||0)*5+(+ag.meet||0),100):0;
  const total=quizPts+logicPts+coursePts+langPts+skillPts+tenurePts+actPts;
  return Object.assign(r,{qs,acc,quizPts,logicPts,courses,coursePts,langPts,skillPts,days,tenurePts,actPts,total,hp});
 }).sort((a,b)=>b.total-a.total);
}

function fitOrgTree(){const wrap=document.querySelector('.orgtree-wrap');const tree=wrap&&wrap.querySelector('.orgtree');if(!wrap||!tree)return;
 tree.style.transform='';tree.style.transformOrigin='top left';wrap.style.overflowX='';wrap.style.height='';
 const need=tree.scrollWidth,have=wrap.clientWidth;
 if(need>have&&have>0){const k=Math.max(0.42,have/need);const dx=Math.max(0,(have-need*k)/2);
  tree.style.transform='translateX('+dx+'px) scale('+k+')'; /* уменьшить и держать по центру; левый край всегда достижим */
  wrap.style.overflowX=(need*k<=have+2)?'hidden':'auto';

function srvUserLinks(u){const name=(u.name||'').trim().toLowerCase(),broker=(u.broker_name||'').trim().toLowerCase(),id=u.id;const hit=v=>{v=(v==null?'':String(v)).trim().toLowerCase();return v&&(v===name||(broker&&v===broker)||v===id);};let n=0;const parts=[];
 try{const c=U.filter(x=>hit(x.broker)).length;if(c){n+=c;parts.push('юниты/брокер: '+c);}}catch(e){}
 try{const c=(typeof AGENTS!=='undefined'?AGENTS:[]).filter(a=>hit(a.name)||hit(a.role)).length;if(c){parts.push('строки KPI: '+c);}}catch(e){}
 try{const c=(typeof LEASE_COMMISSION_DEALS!=='undefined'&&Array.isArray(LEASE_COMMISSION_DEALS)?LEASE_COMMISSION_DEALS:[]).filter(d=>hit(d.broker)||hit(d.agent_primary)).length;if(c){n+=c;parts.push('сделки/комиссии: '+c);}}catch(e){}
 try{const c=(typeof CASE_TASKS!=='undefined'&&Array.isArray(CASE_TASKS)?CASE_TASKS:[]).filter(tk=>hit(tk.assignee)||hit(tk.owner)||hit(tk.assigneeId)).length;if(c){n+=c;parts.push('задачи: '+c);}}catch(e){}
 try{const c=(typeof CASE_PROPOSALS!=='undefined'&&Array.isArray(CASE_PROPOSALS)?CASE_PROPOSALS:[]).filter(pp=>hit(pp.createdBy)||hit(pp.owner)).length;if(c){n+=c;parts.push('КП: '+c);}}catch(e){}
 return {n:n,parts:parts};}
async function srvUserArchive(id,arch){const u=(SRV_USERS||[]).find(x=>x.id===id);if(!u)return;if(S.user&&S.user.id===id&&arch){alert('Нельзя архивировать собственную учётную запись.');return;}if(!confirm(arch?('Отправить «'+(u.name||u.email)+'» в архив? Пользователь исчезнет из активных списков и не сможет войти. Данные и история сохранятся.'):('Вернуть «'+(u.name||u.email)+'» из архива?')))return;try{await apiPOST('users.php',{action:'set_archived',id,archived:arch?1:0});audit(arch?'Пользователь в архив':'Пользователь из архива',id);await reloadSrvUsers();}catch(e){alert('Ошибка: '+(e&&e.message||e));}}

 if(links.n>0){if(confirm('У пользователя «'+(u.name||u.email)+'» есть связанные данные ('+links.parts.join('; ')+').\n\nПолное удаление заблокировано, чтобы не оторвать историю сделок/комиссий/задач.\n\nОтправить в АРХИВ вместо удаления? (данные сохранятся, пользователь уйдёт из активных списков)'))return srvUserArchive(id,1);return;}
 if(!confirm('Полностью удалить пользователя «'+(u.name||u.email)+'»? Связанных данных не найдено. Действие необратимо.'))return;
 try{await apiPOST('users.php',{action:'delete_user',id,confirm:1});audit('Удалён пользователь',id+' · '+(u.email||''));toast&&toast('Пользователь удалён');await reloadSrvUsers();}catch(e){alert('Ошибка: '+(e&&e.message||e));}}

async function srvEditUserProjects(id){const u=(SRV_USERS||[]).find(x=>x.id===id);if(!u)return;const list=OBJECTS.map(o=>o.id+' = '+o.name).join('\n');const cur=(u.projects||[]).join(',');const val=prompt('Проекты, доступные этому внешнему агенту.\nВведите id объектов через запятую:\n\n'+list,cur);if(val==null)return;const ids=val.split(',').map(s=>s.trim()).filter(Boolean).filter(id2=>OBJECTS.some(o=>o.id===id2));try{await apiPOST('data.php',{table:'app_users',row:{id,projects:ids}});audit('Назначены проекты',id+' → '+(ids.join(', ')||'нет'));reloadSrvUsers();}catch(e){alert('Ошибка: '+(e&&e.message||e));}}

function auditSeverity(a){const act=a.action||'';
 if(/^Удал|Очистка данных|Изменение прав роли|^Смена роли|Сброс пароля|^Статус (пользователя|сотрудника)|^Создан пользователь/.test(act))return 'crit';

 return 'ok';}

function trashCard(){if(!R().admin)return '';if(!TRASH.length)return `<div class="card"><h3>🗑 Корзина <span class="mut">пусто</span></h3><div style="font-size:12px;color:var(--muted)">Удалённые помещения, бренды и материалы попадают сюда — их можно восстановить.</div></div>`;
 const rows=TRASH.slice(0,60).map((x,i)=>{const k=TRASH_KINDS[x.kind]||[x.kind,'•'];return `<tr><td>${k[1]} ${esc(k[0])}</td><td><b>${esc(x.label)}</b></td><td style="font-size:11px;color:var(--muted)">${esc(x.by)} · ${esc(x.at)}</td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="trashRestore(${i})">↩ Восстановить</button></td></tr>`;}).join('');

function trashRestore(i){if(!R().admin)return;const x=TRASH[i];if(!x)return;const item=x.item;
 if(x.kind==='unit'){if(U.some(u=>u.id===item.id))item.id='r'+Date.now();if(U.some(u=>u.obj===item.obj&&String(u.code).toLowerCase()===String(item.code).toLowerCase()))item.code=item.code+'_восст';(item.hist=item.hist||[]).push([iso(TODAY),'Восстановлено из корзины ('+S.user.name+')']);U.push(item);for(let j=COMMLOST.length-1;j>=0;j--){if(COMMLOST[j].unit===item.code&&COMMLOST[j].reason==='юнит удалён из реестра'){COMMLOST.splice(j,1);break;}}}
 else if(x.kind==='brand'){if(BRANDS.some(b=>b.id===item.id))item.id='r'+Date.now();(item.hist=item.hist||[]).push([iso(TODAY),S.user.name,'Восстановлен из корзины']);BRANDS.push(item);}
 else if(x.kind==='kb'){if(KB.some(k=>k.id===item.id))item.id='kbr'+Date.now();KB.unshift(item);}
 else{alert('Неизвестный тип записи.');return;}

function mergeUnitForm(id){if(!R().edit)return;const u=U.find(x=>x.id===id);if(!u)return;const others=unitsOf(u.obj).filter(x=>x.id!==id);if(!others.length){alert('Нет других помещений для объединения в этом объекте.');return;}
 $('drawer').innerHTML='<div class="dh"><span class="x" onclick="openUnit(\''+id+'\')">×</span><h2>Объединение помещений</h2><div class="s">'+esc(u.code)+' · '+fmtA(u.area)+' м²</div></div><div class="dbody"><div class="form"><label>Присоединить помещение</label><select id="mg_to">'+others.map(x=>'<option value="'+x.id+'">'+esc(x.code)+' · '+fmtA(x.area)+' м²</option>').join('')+'</select><div style="font-size:11px;color:var(--muted);margin-top:8px">Площади и террасы сложатся в «'+esc(u.code)+'»; присоединяемое помещение удаляется из реестра. Фиксируется в истории.</div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="doMerge(\''+id+'\')">Объединить</button><button class="btn ghost" onclick="openUnit(\''+id+'\')">Отмена</button></div></div></div>';

function doMerge(id){const u=U.find(x=>x.id===id);if(!u)return;const o=U.find(x=>x.id===$('mg_to').value);if(!o||o.id===u.id)return;u.area=Math.round((u.area+o.area)*10)/10;u.terr=Math.round(((u.terr||0)+(o.terr||0))*10)/10;u.merged=(u.merged&&u.merged.length?u.merged:[u.code]).concat([o.code]);u.total=Math.round(u.area*u.rate);u.gap=(OCCK.indexOf(u.status)>=0)?0:-(u.total);u.hist.push([iso(TODAY),'Объединено с '+o.code+' (+'+fmtA(o.area)+' м²) ('+S.user.name+')']);const i=U.indexOf(o);if(i>=0)U.splice(i,1);audit('Объединение помещений',u.code+' ← '+o.code);persist();openUnit(id);}

function doSplit(id){const u=U.find(x=>x.id===id);if(!u)return;const code=($('sp_code').value||'').trim()||(u.code+'-2');const a=+$('sp_area').value||0;if(a<=0){alert('Введите площадь больше 0.');return;}if(a>=u.area){alert('Площадь нового помещения должна быть меньше текущей ('+fmtA(u.area)+' м²).');return;}u.area=Math.round((u.area-a)*10)/10;u.total=Math.round(u.area*u.rate);u.gap=(OCCK.indexOf(u.status)>=0)?0:-(u.total);const nu=unit(u.obj,code,u.floor,Math.round(a*10)/10,0,u.cat,u.sub,u.rate,0,0,'vac','',[],[],'');nu.budget=u.budget;nu.total=Math.round(nu.area*nu.rate);nu.gap=-(nu.total);nu.hist.push([iso(TODAY),'Выделено из '+u.code+' ('+fmtA(a)+' м²) ('+S.user.name+')']);U.push(nu);u.hist.push([iso(TODAY),'Разделено: выделено '+code+' ('+fmtA(a)+' м²) ('+S.user.name+')']);audit('Разделение помещения',u.code+' → '+code);persist();openUnit(id);}
/* Перераспределение площади: срезать часть одного помещения и передать другому */
function areaTransferForm(fromId){if(!R().edit){alert('Недостаточно прав для редактирования.');return;}
 let oid;if(fromId){const fu=U.find(x=>x.id===fromId);oid=fu?fu.obj:S.obj;}else oid=S.obj;
 if(oid==='ALL'){alert('Выберите конкретный объект в шапке.');return;}
 const us=unitsOf(oid);if(us.length<2){alert('В объекте должно быть минимум два помещения.');return;}
 const fromSel=fromId||us[0].id;const toU=us.find(u=>u.id!==fromSel);const toSel=toU?toU.id:us[0].id;
 const opt=selId=>us.map(u=>`<option value="${u.id}"${u.id===selId?' selected':''}>${esc(u.code)} · ${fmtA(u.area)} м²</option>`).join('');
 $('drawer').innerHTML='<div class="dh"><span class="x" onclick="closeDrawer()">×</span><h2>Перераспределение площади</h2><div class="s">Срезать часть одного помещения и передать другому</div></div><div class="dbody"><div class="form">'
 +'<label>Из помещения (откуда срезаем)</label><select id="at_from" onchange="atInfo()">'+opt(fromSel)+'</select>'
 +'<label>В помещение (куда добавляем)</label><select id="at_to" onchange="atInfo()">'+opt(toSel)+'</select>'
 +'<label>Площадь к передаче, м²</label><input id="at_area" type="number" min="0" step="0.1" value="0" oninput="atInfo()">'
 +'<div id="at_preview" style="font-size:12px;color:var(--muted);margin-top:8px"></div>'
 +'<div style="font-size:11px;color:var(--muted);margin-top:8px">Аренда/мес у обоих помещений пересчитается автоматически. Операция фиксируется в истории обоих помещений.</div>'
 +'<div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="doTransferArea()">Передать</button><button class="btn ghost" onclick="closeDrawer()">Отмена</button></div></div></div>';
 openDrawerUI();atInfo();localize();}
function atInfo(){const fe=$('at_from'),te=$('at_to');if(!fe||!te)return;const f=U.find(x=>x.id===fe.value),t=U.find(x=>x.id===te.value),a=+($('at_area')||{}).value||0;const p=$('at_preview');if(!p)return;if(!f||!t){p.textContent='';return;}if(f.id===t.id){p.innerHTML='<span class="sev red">Выберите разные помещения.</span>';return;}if(a>f.area){p.innerHTML='<span class="sev red">Нельзя передать больше, чем есть ('+fmtA(f.area)+' м²).</span>';return;}p.innerHTML=esc(f.code)+': '+fmtA(f.area)+' → <b>'+fmtA(Math.round((f.area-a)*10)/10)+'</b> м²<br>'+esc(t.code)+': '+fmtA(t.area)+' → <b>'+fmtA(Math.round((t.area+a)*10)/10)+'</b> м²';}
function doTransferArea(){const f=U.find(x=>x.id===$('at_from').value),t=U.find(x=>x.id===$('at_to').value),a=+$('at_area').value||0;if(!f||!t||f.id===t.id){alert('Выберите два разных помещения.');return;}if(a<=0){alert('Введите площадь больше 0.');return;}if(a>f.area){alert('Нельзя передать больше площади, чем есть в исходном помещении.');return;}
 f.area=Math.round((f.area-a)*10)/10;t.area=Math.round((t.area+a)*10)/10;
 f.total=Math.round(f.area*f.rate);f.gap=(OCCK.indexOf(f.status)>=0)?0:-(f.total);
 t.total=Math.round(t.area*t.rate);t.gap=(OCCK.indexOf(t.status)>=0)?0:-(t.total);
 const note='Передано '+fmtA(a)+' м²: '+f.code+' → '+t.code+' ('+S.user.name+')';
 f.hist.push([iso(TODAY),note]);t.hist.push([iso(TODAY),note]);
 audit('Перераспределение площади',note);persist();closeDrawer();go(S.view);}
