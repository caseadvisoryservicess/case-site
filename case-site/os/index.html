<style>
:root{--red:#9E0000;--red-d:#7a0000;--red-l:#c62828;--bg:#f4f3f1;--panel:#fff;--card:#fff;--ink:#1b1b1b;--muted:#6b6b6b;--soft:#faf9f7;--border:#e6e3df;--green:#2e7d32;--amber:#a16000;--blue:#1565c0;--teal:#0d8484;--purple:#6a3fb5;--shadow:0 1px 3px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.05)}
*{box-sizing:border-box}html,body{margin:0;padding:0;overflow-x:clip}
body{font-family:'Montserrat',system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:clip}
button{font-family:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}.hidden{display:none!important}.num{text-align:right;font-variant-numeric:tabular-nums}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#2a0000,#9E0000);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.lcard{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:380px;max-width:94vw;padding:30px 28px}
.lcard .lg{font-size:30px;font-weight:800}.lcard .lg .c{color:var(--red)}
.lcard .tag{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin:2px 0 18px}
.lcard label{font-size:11.5px;font-weight:600;color:#555;display:block;margin:12px 0 5px}
.lcard select,.lcard input{width:100%;font-family:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:#fff}
.lcard .go{width:100%;margin-top:18px;background:var(--red);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:15px}
.lcard .lng{display:flex;gap:8px;justify-content:center;margin-top:14px}
.lcard .lng button{flex:1;border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px;font-weight:600;font-size:12px}
.lcard .lng button.on{background:var(--red);color:#fff;border-color:var(--red)}
.lcard .hint{font-size:10.5px;color:var(--muted);margin-top:12px;text-align:center;line-height:1.5}
.topbar{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:40}
.burger{display:block;width:38px;height:36px;padding:0;font-size:20px;background:none;border:1px solid var(--border);border-radius:9px;color:#333}
.brand{display:flex;align-items:baseline;gap:7px;font-weight:800;font-size:19px;white-space:nowrap}.brand .c{color:var(--red)}.brand .tag{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.demo{font-size:9.5px;font-weight:700;color:var(--red-d);background:#fdeaea;border:1px solid #f6cccc;padding:3px 7px;border-radius:20px}
.tb-obj{margin-left:auto;font-family:inherit;font-size:13px;font-weight:600;padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:#fff;max-width:320px}
/* v4.34: «+ Объект»/«✎ Объект» убраны из шапки — они дублировали кнопки главного экрана и карточки объекта; шапка разгружена под селектор проекта и поиск */
#addObjBtn,#editObjBtn{display:none!important}
.gsearch{position:relative;width:min(320px,28vw);min-width:150px;flex:0 1 auto}.gsearch input{width:100%;font-family:inherit;font-size:12.5px;padding:8px 26px 8px 30px;border:1px solid var(--border);border-radius:8px;background:#fff}.gsearch .gclear{position:absolute;right:7px;top:50%;transform:translateY(-50%);cursor:pointer;color:#6d6d6d;font-weight:800;font-size:13px;display:none;z-index:2;padding:2px 5px;line-height:1}.gsearch .gclear:hover{color:var(--red-d)}.gsearch::before{content:'⌕';position:absolute;left:10px;top:6px;color:#6d6d6d;font-weight:800;z-index:1}.gdrop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:70;display:none}.gdrop.open{display:block}.gitem{display:flex;justify-content:space-between;gap:8px;padding:10px 11px;border-bottom:1px solid #f2f0ed;cursor:pointer}.gitem:hover{background:var(--soft)}.gitem b{font-size:12.5px}.gitem small{display:block;color:var(--muted);font-size:10.5px}.gitem .kind{font-size:9.5px;font-weight:800;color:var(--red-d);background:#fdeaea;border-radius:10px;padding:2px 7px;align-self:flex-start}
.langbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 9px;font-weight:700;font-size:11.5px;color:#444}
.who{display:flex;align-items:center;gap:9px}.who .av{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.who .nm{font-size:12px;font-weight:700;line-height:1.1}.who .nm small{display:block;color:var(--muted);font-weight:500;font-size:10.5px}
.who .out{font-size:11px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:7px;padding:5px 8px}
#profileWrap{position:relative}
.profile-btn{display:flex;align-items:center;gap:9px;background:none;border:1px solid transparent;border-radius:10px;padding:3px 6px;cursor:pointer}
.profile-btn:hover{border-color:var(--border);background:#fafafa}
.prof-caret{font-size:10px;color:var(--muted)}
.profile-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;display:none;z-index:60}
.profile-menu.open{display:block}
.profile-menu .pm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 9px;font-size:12px;color:var(--muted)}
.profile-menu .pm-item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.profile-menu .pm-item:hover{background:#f5f5f5}
.profile-menu .pm-out{color:var(--red-d,#9E0000);border-top:1px solid var(--border);margin-top:4px}
.ph-help{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:10px;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:#fff;color:var(--muted);font-weight:800;font-size:12px;cursor:pointer;line-height:1}
.ph-help:hover{border-color:var(--red);color:var(--red-d,#9E0000)}
.shell{display:block;min-height:calc(100vh - var(--topbar-h,55px))}
.side{position:fixed;top:var(--topbar-h,55px);bottom:0;left:0;width:58px;background:#fff;border-right:1px solid var(--border);padding:8px 6px;z-index:39;overflow-x:hidden;overflow-y:auto;transition:width .18s ease,box-shadow .18s ease}
.side:hover,.side.open{width:264px;box-shadow:10px 0 30px rgba(20,20,20,.13)}
/* v4.34: на десктопе меню по умолчанию ЗАКРЕПЛЕНО с подписями (иконки-загадки без подписей — главная жалоба на «кашу»); ☰ сворачивает в узкую рейку */
@media(min-width:821px){
 body.nav-pin .side{width:264px;box-shadow:none}
 body.nav-pin .main{margin-left:264px;width:calc(100% - 264px)}
 body.nav-pin .side .nav-group-btn{visibility:visible;pointer-events:auto;cursor:pointer}
 body.nav-pin .side .nav-group:not(.open) .nav-menu{display:none}
 body.nav-pin .side .nav-menu a{justify-content:flex-start;gap:10px;width:100%;padding:8px 10px;font-size:12px}
}
.nav{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
.nav-group{position:relative;width:100%;flex:0 0 auto}
.nav-group-btn{display:flex;visibility:hidden;align-items:center;justify-content:space-between;width:100%;height:24px;gap:7px;padding:7px 9px 3px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.side:hover .nav-group-btn,.side.open .nav-group-btn{visibility:visible;pointer-events:auto;cursor:pointer}
/* v4.37: группы меню — аккордеон. Открыта группа текущего экрана; остальные сворачиваются, клик по заголовку раскрывает. Меню перестаёт быть простынёй. */
.nav-group-btn .chev{display:none;font-size:8px;transition:transform .15s}
.side:hover .nav-group-btn .chev,.side.open .nav-group-btn .chev,body.nav-pin .side .nav-group-btn .chev{display:inline}
.nav-group.open .nav-group-btn .chev{transform:rotate(180deg)}
.side:hover .nav-group:not(.open) .nav-menu,.side.open .nav-group:not(.open) .nav-menu{display:none}
.nav-menu,.nav-group:hover .nav-menu,.nav-group:focus-within .nav-menu,.nav-group.open .nav-menu{display:flex;position:static;min-width:0;padding:0;border:0;background:transparent;box-shadow:none;flex-direction:column;gap:2px}
.nav-menu a{display:flex;align-items:center;justify-content:center;gap:0;width:45px;min-height:38px;padding:8px;border-radius:9px;color:#333;font-weight:600;font-size:0;cursor:pointer;white-space:nowrap;overflow:hidden;transition:width .18s ease,background .12s ease}
.side:hover .nav-menu a,.side.open .nav-menu a{justify-content:flex-start;gap:10px;width:100%;padding:8px 10px;font-size:12px}
.nav-menu a:hover{background:var(--soft)}.nav-menu a.active{background:var(--red);color:#fff}.nav-menu a .ic{flex:0 0 24px;width:24px;text-align:center;font-size:16px}
.nav .sep{display:none}
.perm{display:none;margin-top:12px;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--soft);font-size:11px;color:var(--muted)}.perm.collapsed{padding:6px 11px}
.perm b{color:#333;display:block;margin-bottom:5px;font-size:12px}.chip{display:inline-block;margin:2px 3px 0 0;padding:2px 7px;border-radius:12px;background:#fff;border:1px solid var(--border);font-weight:600;font-size:10px}
.orgtree-wrap{overflow-x:auto;padding:14px 6px 6px}
.orgtree,.orgtree ul{display:flex;justify-content:center;padding:0;margin:0;list-style:none}
.orgtree{width:max-content;margin:0 auto} /* корневой UL по ширине контента: центр без обрезания слева, scrollWidth честный */
.orgtree ul{padding-top:22px;position:relative}
.orgtree li{display:flex;flex-direction:column;align-items:center;position:relative;padding:22px 12px 0 12px;margin:0}
.orgtree li::before,.orgtree li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--border);width:50%;height:22px}
.orgtree li::after{right:auto;left:50%;border-left:2px solid var(--border)}
.orgtree li:only-child::after,.orgtree li:only-child::before{display:none}
.orgtree li:only-child{padding-top:0}
.orgnode{display:flex;flex-direction:column;align-items:center;gap:4px}
.orgteam{display:flex;flex-direction:column;gap:2px;margin-top:2px;max-width:150px}
.orgmini{font-size:10px;background:var(--soft,#f7f5f1);border:1px solid var(--border);border-radius:7px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
@media(max-width:900px){.orgtree,.orgtree ul{flex-wrap:nowrap}.orgtree li{padding:22px 4px 0 4px}.orgbox{font-size:10.5px;padding:6px 8px}.orgmini{max-width:96px;font-size:9px}.orgtree-wrap{-webkit-overflow-scrolling:touch}}
/* круглая кнопка «наверх» */
#toTop{position:fixed;right:18px;bottom:92px;width:44px;height:44px;border-radius:50%;background:var(--red-d,#9E0000);color:#fff;border:0;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:80;display:none}
#toTop:hover{filter:brightness(1.12)}
/* чат-виджет */
#chatFab{position:fixed;right:18px;bottom:20px;width:54px;height:54px;border-radius:50%;background:var(--red-d,#9E0000);color:#fff;border:0;font-size:23px;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.3);z-index:120}
#chatFab:hover{filter:brightness(1.12)}
#chatFabBadge{position:absolute;top:-4px;right:-4px;background:#f2b90d;color:#3d2f00;border-radius:10px;font-size:10px;font-weight:800;padding:2px 6px}
#chatW{display:none;position:fixed;right:18px;bottom:84px;width:min(370px,92vw);height:min(540px,74vh);background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);z-index:119;flex-direction:column;overflow:hidden}
.chatw-h{background:var(--red-d,#9E0000);color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.chatw-x{background:none;border:0;color:#fff;font-size:17px;cursor:pointer;line-height:1;padding:0 4px}
.chatw-body{flex:1;overflow-y:auto;padding:10px;background:var(--soft,#f7f5f1)}
.chatw-inp{border-top:1px solid var(--border);padding:8px;background:#fff;position:relative}
#chatNotif{display:none;position:fixed;right:18px;bottom:146px;max-width:300px;background:#fff;border:1px solid var(--red-d,#9E0000);border-left:5px solid var(--red-d,#9E0000);border-radius:12px;padding:10px 13px;font-size:12px;box-shadow:0 8px 26px rgba(0,0,0,.22);z-index:121;cursor:pointer}
#mentionDD{position:absolute;bottom:100%;left:8px;right:8px;background:#fff;border:1px solid var(--border);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:150px;overflow:auto;z-index:5}
.mention-it{padding:7px 11px;font-size:12px;cursor:pointer;border-bottom:1px solid #f2f0ed}
.mention-it:hover,.mention-it.on{background:var(--soft,#f7f5f1)}
body.dark #chatW,body.dark .chatw-inp,body.dark #mentionDD,body.dark #chatNotif{background:var(--panel);color:var(--ink)}
body.dark .chatw-body{background:#28261f}
.orgtree li:first-child::before,.orgtree li:last-child::after{border:0 none}
.orgtree li:last-child::before{border-right:2px solid var(--border);border-radius:0 6px 0 0}
.orgtree li:first-child::after{border-radius:6px 0 0 0}
.orgtree ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--border);width:0;height:22px}
.orgbox{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--border);border-radius:10px;background:var(--soft);cursor:pointer;font-size:13px;white-space:nowrap;transition:background .15s}
.orgbox:hover{background:#f0ede8}.orgbox.open{background:#fdeaea;border-color:#e0a0a0}.orgcnt{display:inline-block;min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;background:#fff;border:1px solid var(--border);font-size:11px;font-weight:700;color:#6d6d6d}
.orgpanel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.orgpeople{margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.orgperson{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px}.orgperson.inactive{opacity:.55}
tr.sev-crit td{background:#fdeaea}tr.sev-warn td{background:#fff8e1}tr.sev-ok td{background:#eefaf0}
body.dark tr.sev-crit td{background:#3a1414}body.dark tr.sev-warn td{background:#3a2f14}body.dark tr.sev-ok td{background:#14301a}
.scrim{display:none}.main{margin-left:58px;padding:12px clamp(12px,1.6vw,26px) 24px;max-width:none;width:calc(100% - 58px);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 3px;flex-wrap:wrap}.ph h1{font-size:20px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:11px;margin:0 0 9px}.main>.sub{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}.kpi .val{font-size:23px;font-weight:800;margin-top:5px}.kpi .val small{font-size:12px;font-weight:600;color:var(--muted)}.kpi .sub2{font-size:11px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;box-shadow:var(--shadow);margin-bottom:15px}
.card h3{margin:0 0 13px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}.card h3 .mut{font-weight:500;color:var(--muted);font-size:11.5px}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tbl-scroll::-webkit-scrollbar{height:11px}
.tbl-scroll::-webkit-scrollbar-track{background:#f0eeec;border-radius:6px}
.tbl-scroll::-webkit-scrollbar-thumb{background:#c9c2b8;border-radius:6px;border:2px solid #f0eeec}
.tbl-scroll::-webkit-scrollbar-thumb:hover{background:var(--red-d,#9E0000)}
.tbl-scroll-top{overflow-x:auto;overflow-y:hidden;height:13px;margin-bottom:2px;scrollbar-width:thin}
.tbl-scroll-top::-webkit-scrollbar{height:11px}
.tbl-scroll-top::-webkit-scrollbar-track{background:#f0eeec;border-radius:6px}
.tbl-scroll-top::-webkit-scrollbar-thumb{background:#c9c2b8;border-radius:6px;border:2px solid #f0eeec}
.tbl-scroll-top>div{height:1px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 9px;border-bottom:1px solid #f0eeec;vertical-align:top}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
/* Единый вид всех таблиц в рабочей области: лёгкая «шапка-полоса» и подсветка строки при наведении.
   Спец-заголовки (группы Бюджет/Факт, гео-таблицы) задают свой фон и перекрывают это правило. */
/* Шапка всех таблиц рабочей области — один в один как в «Базе брендов» (asaas35):
   мелкие серые заголовки КАПСом, плотный отступ, мягкая фон-полоса. */
.card table thead th{background:var(--soft);color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:7px 6px;vertical-align:middle}
.card table tbody tr:nth-child(even)>td{background:rgba(0,0,0,.015)}
body.dark .card table tbody tr:nth-child(even)>td{background:rgba(255,255,255,.02)}
.card table tbody tr:hover>td{background:rgba(158,0,0,.04)}
/* ═══ v4.38: ЕДИНЫЙ СКИН для таблиц ВСЕХ модулей (v32/v326/case49) — как «База брендов».
   #main в селекторе даёт приоритет над CSS модулей независимо от порядка их загрузки. ═══ */
#main .v32-table thead th,#main .v326-table thead th,#main .case49-table thead th{background:var(--soft);color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:7px 6px;vertical-align:middle;font-weight:700;text-align:left}
#main .v32-table td,#main .v326-table td,#main .case49-table td{font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink)}

body.dark [style*="color:var(--red-d"]{color:#ff9d94!important}
body.dark [style*="color:var(--red)"]{color:#ff8a80!important}
body.dark [style*="color:var(--blue)"]{color:#7fb3f5!important}
body.dark [style*="color:var(--green)"]{color:#7fd089!important}
body.dark [style*="color:var(--teal)"]{color:#5fd0d0!important}
body.dark [style*="color:var(--amber)"]{color:#ffc46b!important}
body.dark [style*="color:var(--purple)"]{color:#c9a7f0!important}
body.dark .c{color:#ff8a80}
body.dark .demo{color:#ff9d94}
body.dark .ft{color:#ff9d94}
body.dark .chip{background:#28261f}

body.dark svg text:not([fill]){fill:#ededed} /* подписи на SVG-диаграммах: без fill браузер рисует чёрным */

body.dark .paper [style*="color:var(--red-d"],body.dark .paper .ft{color:var(--red-d)!important}

.planwrap{position:relative;overflow:hidden;touch-action:none}
.planzoom{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:5}
.planzoom button{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:#fff;font-weight:800;font-size:15px;line-height:1;color:#333;box-shadow:var(--shadow);min-height:30px}
.planview{transform-origin:0 0;cursor:grab}.planview.grabbing{cursor:grabbing}
.selbar{position:sticky;bottom:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:9px 13px;display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;z-index:10}
td.selcol,th.selcol{width:28px;text-align:center;padding-left:4px;padding-right:4px}
.rate-cur{font-size:10.5px;font-weight:700;color:var(--green);background:#e7f4e8;border:1px solid #cfe6cf;border-radius:11px;padding:4px 9px;white-space:nowrap}
body.dark .rate-cur{background:#14301a;border-color:#1d4a26;color:#7fd089}
.thbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 9px;font-weight:700;font-size:11.5px;color:#444}body.dark .thbtn{background:#28261f;color:var(--ink)}
.thbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.dovr{font-size:9.5px;font-weight:800;border-radius:9px;padding:2px 6px;white-space:nowrap}.dovr.sent{background:#e4eefb;color:var(--blue)}.dovr.acc{background:#e7f4e8;color:var(--green)}.dovr.rej{background:#fdeaea;color:var(--red-d)}.dovr.draft{background:#f0f0f0;color:#6d6d6d}
.kcol{min-width:178px;flex:1;background:var(--soft);border:1px solid var(--border);border-radius:10px;padding:8px;min-height:80px}
.kcol.kover{border-color:var(--red);background:#fdeaea}
body.dark .kcol.kover{background:#3a1414}
.kch{font-size:11.5px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.kcard{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:7px;cursor:grab;box-shadow:var(--shadow)}
.kcard:active{cursor:grabbing}
body.dark .kcard{background:#262420}
.quizpop{position:fixed;right:16px;bottom:86px;width:320px;max-width:90vw;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.22);z-index:2000;font-size:13px;overflow:hidden;animation:quizIn .18s ease-out}
@keyframes quizIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.quizpop-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--red);color:#fff}
.quizpop-h b{font-size:12.5px;letter-spacing:.02em}
.quizpop-x{background:none;border:none;color:#fff;font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.quizpop-x:hover{background:rgba(255,255,255,.18)}
.quizpop-body{padding:12px 14px}
.quizpop-q{font-size:13.5px;font-weight:600;margin-bottom:10px}
.quizpop-opts{display:flex;flex-direction:column;gap:7px}
.quizpop-opt{text-align:left;background:var(--soft);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:inherit}
.quizpop-opt:hover:not(:disabled){border-color:var(--red)}
.quizpop-opt:disabled{cursor:default}
.quizpop-opt.ok{background:#e7f4e8;border-color:var(--green);color:var(--green);font-weight:700}
.quizpop-opt.bad{background:#fdeaea;border-color:var(--red);color:var(--red-d)}
.quizpop-fb{margin-top:10px;font-size:12.5px}
.quizpop-ok{color:var(--green);font-weight:700}
.quizpop-bad{color:var(--red-d);font-weight:700}
.quizpop-why{color:var(--muted);margin-top:4px}
.quizpop-badge{position:fixed;right:18px;left:auto;bottom:86px;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:18px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:2000}
@media (max-width:480px){.quizpop{right:8px;bottom:8px;left:8px;width:auto}}
@media (max-width:900px){.quizpop-badge{display:none!important}}
/* v3.1: тёмный режим для квиз-окна и тестов — все тексты читаемые */
.quizpop,.quizpop-body,.quizpop-q,.quizpop-fb{color:var(--ink)}

body.dark .quizpop{background:var(--panel);color:var(--ink);border-color:var(--border)}
body.dark .quizpop-body,body.dark .quizpop-q,body.dark .quizpop-fb{color:var(--ink)}

body.dark .quizpop-opt.ok{background:#14301a;border-color:#5aa765;color:#7fd089}
body.dark .quizpop-opt.bad{background:#3a1717;border-color:#ff7a70;color:#ff9d94}
body.dark .quizpop-why{color:#c9c4bd}
body.dark .quizpop-bad{color:#ff9d94}

/* #78 профиль-меню (версия/курс/тема/язык/имена/выход) + #85 кнопка «?» на каждой странице у заголовка */
(function(){
  window.toggleProfileMenu=function(e){if(e&&e.stopPropagation)e.stopPropagation();var m=document.getElementById('profileMenu'),b=document.getElementById('profileBtn');if(!m)return;var open=m.classList.toggle('open');if(b)b.setAttribute('aria-expanded',open?'true':'false');};
  document.addEventListener('click',function(e){var m=document.getElementById('profileMenu');if(!m||!m.classList.contains('open'))return;if(e.target.closest&&e.target.closest('#profileWrap'))return;m.classList.remove('open');var b=document.getElementById('profileBtn');if(b)b.setAttribute('aria-expanded','false');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=document.getElementById('profileMenu');if(m&&m.classList.contains('open'))m.classList.remove('open');}});
  function injectHelp(){var main=document.getElementById('main');if(!main)return;main.querySelectorAll('.ph').forEach(function(ph){if(ph.querySelector('.ph-help'))return;var h1=ph.querySelector('h1');if(!h1)return;var b=document.createElement('button');b.className='ph-help';b.type='button';b.title='Инструкция раздела';b.setAttribute('aria-label','Инструкция раздела');b.textContent='?';b.onclick=function(ev){if(ev&&ev.stopPropagation)ev.stopPropagation();try{openGuide((typeof S!=='undefined'&&S.view)||'');}catch(_){}};h1.appendChild(b);});}
  var main=document.getElementById('main');
  if(main){try{new MutationObserver(function(){injectHelp();}).observe(main,{childList:true,subtree:true});}catch(_){}}
  if(document.readyState!=='loading')injectHelp();else document.addEventListener('DOMContentLoaded',injectHelp);
})();
</script>
