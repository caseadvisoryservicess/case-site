<style>

.lcard{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:380px;max-width:94vw;padding:30px 28px}

.gsearch{position:relative;width:min(320px,28vw);min-width:210px}.gsearch input{width:100%;font-family:inherit;font-size:12.5px;padding:8px 10px 8px 30px;border:1px solid var(--border);border-radius:8px;background:#fff}.gsearch::before{content:'⌕';position:absolute;left:10px;top:6px;color:#999;font-weight:800;z-index:1}.gdrop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:70;display:none}.gdrop.open{display:block}.gitem{display:flex;justify-content:space-between;gap:8px;padding:10px 11px;border-bottom:1px solid #f2f0ed;cursor:pointer}.gitem:hover{background:var(--soft)}.gitem b{font-size:12.5px}.gitem small{display:block;color:var(--muted);font-size:10.5px}.gitem .kind{font-size:9.5px;font-weight:800;color:var(--red-d);background:#fdeaea;border-radius:10px;padding:2px 7px;align-self:flex-start}

.nav a:hover{background:var(--soft)}.nav a.active{background:var(--red);color:#fff}.nav a .ic{width:18px;text-align:center}

.miniobj{display:flex;flex-direction:column;gap:7px;border:1px solid var(--border);border-radius:8px;padding:13px;cursor:pointer}.miniobj:hover{border-color:var(--red)}

.objgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 13px;font-weight:600;font-size:12px;color:#444}.tabs button.on{background:#222;color:#fff;border-color:#222}
.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

.drawer{position:fixed;top:0;right:0;height:100%;width:440px;max-width:94vw;background:#fff;z-index:51;box-shadow:-8px 0 30px rgba(0,0,0,.16);transform:translateX(100%);transition:.22s;overflow-y:auto}.drawer.open{transform:none}
.dh{padding:17px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}.dh .x{float:right;font-size:23px;color:#999;cursor:pointer}.dh h2{margin:0;font-size:17px}.dh .s{color:var(--muted);font-size:12px;margin-top:3px}
.dbody{padding:16px 20px}.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f2f0ed;font-size:13px}.kv span{color:var(--muted)}.kv b{font-weight:700;text-align:right}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin:16px 0 8px}
.tl{border-left:2px solid var(--border);padding-left:15px}.tl .ev{position:relative;padding:0 0 14px}.tl .ev::before{content:'';position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:var(--red)}.tl .ev .dt{font-size:11px;color:var(--muted);font-weight:600}.tl .ev .tx{font-size:12.5px}
.banner{padding:10px 12px;border-radius:9px;font-size:12px;margin-bottom:12px}.banner.warn{background:#fdeaea;border:1px solid #f3c2c2;color:var(--red-d)}.banner.ok{background:#eef6ee;border:1px solid #cfe6cf;color:#256029}

.form label{display:block;font-size:11px;font-weight:600;color:#555;margin:10px 0 4px}.form input,.form select,.form textarea{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}.form textarea{min-height:54px;resize:vertical}

.paper h2{font-size:15px;margin:0 0 11px}.paper table{margin:8px 0}.paper td{padding:5px 8px;font-size:12px;border:1px solid #ddd}.paper .tot{font-weight:800;color:var(--red-d)}.paper .note{font-size:10.5px;color:var(--muted);border-top:1px solid var(--border);margin-top:13px;padding-top:9px}

.lock{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 20px;color:var(--muted)}.lock .em{font-size:40px;margin-bottom:10px}

<body>

<div id="login">
  <div class="lcard">
    <div class="lg"><span class="c">CASE</span> OS</div>
    <div class="tag">Leasing &amp; Asset Control</div>
    <label id="l_user">Пользователь</label>
    <select id="luser"></select>
    <label id="l_pass">Пароль</label>
    <input id="lpass" type="password" value="demo">
    <button class="go" id="l_go" onclick="doLogin()">Войти</button>
    <div class="lng"><button id="lng_ru" class="on" onclick="setLang('ru')">RU</button><button id="lng_uz" onclick="setLang('uz')">UZ</button></div>

</div>

<div id="app" class="hidden">
  <div class="topbar">
    <button class="burger" aria-label="Открыть меню" onclick="toggleSide()">☰</button>
    <div class="brand"><span><span class="c">CASE</span> OS</span><span class="tag">Leasing Control</span></div>
    <span class="demo">DEMO</span>
    <select class="tb-obj" id="objSel" aria-label="Object switcher" onchange="setObj(this.value)"></select>
    <div class="gsearch"><input id="gq" aria-label="Global search" placeholder="Поиск: помещение, бренд, КП..." oninput="globalSearch(this.value)" onkeydown="if(event.key==='Escape')clearSearch()"><div id="gdrop" class="gdrop"></div></div>
    <button class="langbtn" id="langTop" aria-label="Switch language" onclick="toggleLang()">UZ</button>
    <div class="who"><div class="av" id="avatar">A</div><div class="nm" id="whoName">-<small id="whoRole">-</small></div><button class="out" id="b_out" onclick="logout()">Выход</button></div>

  <div class="shell">
    <div class="scrim" id="scrim" onclick="toggleSide()"></div>
    <aside class="side" id="side"><nav class="nav" id="nav"></nav><div class="perm" id="perm"></div></aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="dbg" id="dbg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

let _UZK=null;
function uzKeys(){if(!_UZK)_UZK=Object.keys(UZMAP).sort((a,b)=>b.length-a.length);return _UZK;}
function uzText(s){if(!s)return s;const ex=UZMAP[s.trim()];if(ex)return s.replace(s.trim(),ex);if(!/[А-Яа-яЁё]/.test(s))return s;let out=s;const keys=uzKeys();for(let i=0;i<keys.length;i++){const k=keys[i];if(k.length>=4&&out.indexOf(k)>=0)out=out.split(k).join(UZMAP[k]);}return out.split('м²').join('m²');}
function localize(){try{if(LANG!=='uz')return;if(!document.createTreeWalker)return;
 const conts=['main','drawer','perm'].map(id=>$(id)).filter(Boolean);const tb=document.querySelector('.topbar');if(tb)conts.push(tb);
 conts.forEach(r=>{const skip=r.querySelector?r.querySelector('#dprev'):null;
  const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT,null);const ns=[];let x;while(x=w.nextNode()){if(skip&&skip.contains(x))continue;ns.push(x);}
  ns.forEach(tn=>{const v=tn.nodeValue;if(/[А-Яа-яЁё]/.test(v)){const nv=uzText(v);if(nv!==v)tn.nodeValue=nv;}});
  (r.querySelectorAll?r.querySelectorAll('[placeholder],[title],[aria-label]'):[]).forEach(el=>{if(skip&&skip.contains(el))return;['placeholder','title','aria-label'].forEach(a=>{if(el.hasAttribute(a)){const v=el.getAttribute(a);if(/[А-Яа-яЁё]/.test(v)){const nv=uzText(v);if(nv!==v)el.setAttribute(a,nv);}}});});
 });}catch(e){}}

function renderKPI(){
 const role=S.role,fin=R().finance,agg=['ASH','ADM','BA'].indexOf(role)>=0,per=['ASH','ADM'].indexOf(role)>=0,me=AGENTS.find(a=>a.role===role);

 const bars=a=>bar(a.touch,TARGETS.touch,'Касания')+bar(a.meet,TARGETS.meet,'Встречи')+bar(a.view,TARGETS.view,'Показы')+bar(a.loi,TARGETS.loi,'LOI')+bar(a.sign,TARGETS.sign,'Подписано');
 let h=`<div class="ph"><h1>${t('kpi')}</h1></div><p class="sub">Роль: ${R().label} · эта неделя (демо)</p>`;
 if(me){h+=`<div class="card"><h3>Мои показатели <span class="mut">${me.name}</span></h3><div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:13px"><div class="kpi"><div class="lab">Выполнение KPI</div><div class="val">${pct(me)}%</div></div><div class="kpi"><div class="lab">Моя комиссия</div><div class="val">${fmt(me.earned)}</div><div class="sub2">${me.sign} сделок</div></div><div class="kpi"><div class="lab">В пайплайне</div><div class="val">${fmt(me.pipe)}</div></div></div>${bars(me)}</div>`;}
 else h+=`<div class="card" style="color:var(--muted);font-size:12.5px">Роль ${R().label} не закрывает сделки лично - персональной комиссии нет.</div>`;
 if(agg){const T=AGENTS.reduce((s,a)=>({sign:s.sign+a.sign,loi:s.loi+a.loi,view:s.view+a.view,earned:s.earned+a.earned,pipe:s.pipe+a.pipe}),{sign:0,loi:0,view:0,earned:0,pipe:0});h+=`<div class="card"><h3>Совокупно по отделу</h3><div class="kpis" style="grid-template-columns:repeat(4,1fr)"><div class="kpi"><div class="lab">Сделок</div><div class="val">${T.sign}</div></div><div class="kpi"><div class="lab">Сов. комиссия</div><div class="val">${fmt(T.earned)}</div></div><div class="kpi"><div class="lab">Пайплайн</div><div class="val">${fmt(T.pipe)}</div></div><div class="kpi"><div class="lab">Показы/нед</div><div class="val">${T.view}</div></div></div></div>`;}
 if(per)h+=`<div class="card"><h3>По агентам</h3><div class="tbl-scroll"><table><thead><tr><th>Агент</th><th class="num">KPI</th><th class="num">Сделки</th><th class="num">Комиссия</th><th class="num">Пайплайн</th></tr></thead><tbody>${AGENTS.map(a=>`<tr><td><b>${a.name}</b><div style="font-size:10px;color:#999">${a.title}</div></td><td class="num">${pct(a)}%</td><td class="num">${a.sign}</td><td class="num">${fmt(a.earned)}</td><td class="num">${fmt(a.pipe)}</td></tr>`).join('')}</tbody></table></div></div>`;

 if(agg){const signedAnnual=oid=>unitsOf(oid).filter(u=>u.status==='cd').reduce((s,u)=>s+u.total,0)*12;

btn ghost sm" onclick="addComment('${u.id}')">+ Комментарий</button>`:''}</div></div>`;

 const o=objById($('f_obj').value);
 const no=$('f_no').value||'-',date=$('f_date').value,valid=+$('f_valid').value||30,addr=$('f_addr').value||'________',ten=$('f_ten').value||'Арендатор';
 let act=$('f_act').value;if(act.indexOf('Другое')>=0)act=$('f_actm').value||'-';
 const unit=$('f_unit').value||'-',area=+$('f_area').value||0,rate=+$('f_rate').value||0;
 const terrOn=$('f_terr_on').checked,terr=+(($('f_terr')||{}).value)||0,terrate=+(($('f_terrate')||{}).value)||0,season=$('f_season')&&$('f_season').checked,seasonm=(($('f_seasonm')||{}).value)||'';
 const rmod=$('f_rmodel').value,rstep=(($('f_rstep')||{}).value)||'',turn=+(($('f_turn')||{}).value)||0,turnmin=(($('f_turnmin')||{}).value)||'';
 const inc=+$('f_inc').value||5,sc=+$('f_sc').value||10,vat=$('f_vat').value,vatr=+$('f_vatr').value||0;
 const capx=$('f_capx').value,capxv=$('f_capxv').value||'-',fit=+$('f_fit').value||0,fitp=$('f_fitp').value||'',prep=+$('f_prep').value||1,dep=+$('f_dep').value||1;
 const cond=$('f_cond').value,special=$('f_special').value||'-',sig=$('f_sig').value;
 const m1=area*rate,mt=terrOn?terr*terrate:0;
 const vatTxt=vat==='na'?'не облагается НДС':vat==='incl'?('включён в ставку (НДС '+vatr+'%)'):('НДС '+vatr+'% сверх ставки');
 let rentRow;
 if(rmod.indexOf('Нараст')>=0)rentRow='<b>'+rate+' $/м²/мес</b> (стартовая), нарастающая: '+(rstep||'по графику')+'. Итого старт <b>'+fmt(m1)+'/мес</b>.';
 else if(rmod.indexOf('оборот')>=0&&rmod.indexOf('База')<0)rentRow='<b>'+turn+'% от товарооборота</b>'+(turnmin?' (мин. '+turnmin+')':'')+'.';
 else if(rmod.indexOf('База')>=0)rentRow='<b>'+rate+' $/м²/мес</b> + <b>'+turn+'% от оборота</b> сверх порога. База <b>'+fmt(m1)+'/мес</b>.';
 else rentRow='<b>'+rate+' $/м²/мес</b>, итого <b>'+fmt(m1)+'/мес</b>.';
 const utils=UTILS.filter(u=>$('u_'+u[0])&&$('u_'+u[0]).checked).map(u=>'<tr><td>'+u[1]+'</td><td>'+$('um_'+u[0]).value+'</td></tr>').join('');
 let mark='';
 if(DOC.uid){const u=U.find(x=>x.id===DOC.uid);if(u){if(u.offer&&u.offer.byUser!==S.user.u){const st=offerState(u);if(!confirm('Внимание: '+u.code+' уже предложено ('+u.offer.to+', агент '+(u.offer.by||u.offer.role)+', '+(st?(st.days<0?'бронь просрочена':st.days+' дн. до окончания'):'активная бронь')+'). Это другой агент. Сформировать ещё одно КП?'))return;}u.offer={to:ten,role:S.role,by:S.user.name,byUser:S.user.u,date,no,validDays:valid,validUntil:addDaysISO(date,valid)};if(OCCK.indexOf(u.status)<0)u.status='off';u.hist.push([iso(TODAY),'КП '+no+': '+ten+' (агент '+S.user.name+', до '+u.offer.validUntil+')']);if(ten&&u.vars.indexOf(ten)<0)u.vars.push(ten);persist();mark='<br>✔ '+u.code+' отмечено «Предложено» ('+ten+'), бронь до '+dateRU(u.offer.validUntil)+' - видно всем агентам.';}}

 show(`${letter('Коммерческое предложение / Договор намерения')}<div style="text-align:right;font-size:11px;color:#555">${date} · № ${no} · действительно ${valid} дн.</div><h2>Коммерческое предложение / Договор намерения</h2><p>Уважаемый(ая) <b>${addr}</b>,</p><p>Арендатор: <b>${ten}</b> · Объект: <b>${o.ru}</b></p><p>Благодарим за интерес к ${o.ru}. Предлагаем помещение(я) на следующих условиях:</p><table><tr><td style="width:38%">Помещение(я)</td><td>${unit}</td></tr><tr><td>Площадь</td><td>${fmtA(area)} м²${terrOn?' + терраса '+fmtA(terr)+' м²'+(season?' (сезонно: '+(seasonm||'-')+')':''):''}; после стройработ перезамер +/- 10%</td></tr><tr><td>Деятельность</td><td>${act}</td></tr><tr><td>Базовая аренда</td><td>${rentRow} Оплата в ${o.cur}.</td></tr>${terrOn?'<tr><td>Аренда террасы</td><td>'+terrate+' $/м²/мес, итого '+fmt(mt)+'/мес'+(season?'; сезонно ('+(seasonm||'-')+')':'')+'</td></tr>':''}<tr><td>НДС</td><td>${vatTxt}</td></tr><tr><td>Повышение аренды</td><td>не более ${inc}% и не чаще раза в год</td></tr><tr><td>Оплата за обслуживание</td><td>${sc}% от аренды, отдельно</td></tr><tr><td>CAPEX</td><td>${capx}${capxv&&capxv!=='-'?' · '+capxv:''}</td></tr><tr><td>Арендные каникулы (fit-out)</td><td>${fit} мес${fitp?' ('+fitp+')':''}</td></tr><tr><td>Предоплата / депозит</td><td>${prep} мес аванс / ${dep} мес депозит</td></tr><tr><td>Период пользования</td><td>5 лет со дня открытия (подлежит согласованию)</td></tr><tr><td>Состояние при передаче</td><td>${cond}</td></tr></table><div style="page-break-before:always;height:0"></div><h2 style="font-size:13px;margin-top:14px">Коммунальные платежи</h2><table><tr><td style="width:38%;font-weight:700">Вид</td><td style="font-weight:700">Как оплачивается</td></tr>${utils||'<tr><td colspan="2">по договорённости</td></tr>'}</table><h2 style="font-size:13px;margin-top:14px">Особые условия</h2><p>${special}</p><p style="margin-top:8px">Для принятия подпишите и верните с: 3 экз. с печатью; предоплатой; копией паспорта; копией  let body;
 if(ty==='unit'){const unit=$('f_unit').value||'-',area=+$('f_area').value||0,rate=+$('f_rate').value||0;body='<p>Намерение заключить договор аренды помещения <b>'+unit+'</b> в <b>'+o.ru+'</b>:</p><table><tr><td>Площадь</td><td class="num">'+fmtA(area)+' м²</td></tr><tr><td>Ставка</td><td class="num">'+rate+' $/м²/мес</td></tr><tr><td>Аренда/мес</td><td class="num">'+fmt(area*rate)+'</td></tr></table>';}
 else if(ty==='brand')body='<p>Настоящим <b>CASE Advisory</b> и <b>'+ten+'</b> подтверждают намерение о стратегическом сотрудничестве по размещению бренда <b>'+ten+'</b> на объектах под управлением CASE (несколько локаций), на условиях, согласуемых по каждому помещению отдельно.</p>';
 else body='<p>Настоящим <b>'+ten+'</b> и <b>CASE Advisory</b> подтверждают намерение о сотрудничестве по объекту <b>'+o.ru+'</b> (брокеридж / лизинг / управление), с детализацией в отдельном договоре.</p>';
 show(`${letter('Letter of Intent (черновик)')}<h2>Письмо о намерениях (LOI)</h2>${body}<p>Настоящее LOI не является обязывающим договором и действует ${val} дней.</p>${sign3()}<div class="note">Черновик. Юридическая проверка обязательна.</div>`);
}
function genREM(){const o=objById($('f_obj').value),ten=$('f_ten').value||'-',sub=$('f_sub').value,date=$('f_date2').value,dd=date?daysUntil(date):'';DOC.fname='Reminder_'+ten.replace(/\W+/g,'_');show(`${letter('Служебное напоминание')}<h2>${sub}</h2><p>Объект: <b>${o.ru}</b> · Арендатор: <b>${ten}</b></p><p>Дата события: <b>${date?dateRU(date):'-'}</b>${dd!==''?' (через '+dd+' дней)':''}.</p><p>Просьба подготовить решение и согласовать с ответственным (ASH).</p><div class="note">Автоформируется по контрольной дате.</div>`);}
function printDoc(){const w=window.open('','_blank');w.document.write(wrapDoc(DOC.last||$('dprev').innerHTML));w.document.close();w.focus();setTimeout(()=>w.print(),300);}
function wrapDoc(h){return `<html><head><meta charset="utf-8"><title>CASE OS</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Montserrat',Arial,sans-serif;color:#222;max-width:760px;margin:24px auto;padding:0 22px;font-size:12pt}.lh{display:flex;justify-content:space-between;border-bottom:2px solid #9E0000;padding-bottom:10px;margin-bottom:16px}.lh .b{font-size:20pt;font-weight:800}.lh .b .c{color:#9E0000}.lh .meta{font-size:9pt;color:#888;text-align:right}h2{font-size:13pt}table{width:100%;border-collapse:collapse;margin:8px 0}td{padding:5px 8px;border:1px solid #999;font-size:10.5pt;vertical-align:top}.tot{font-weight:800;color:#7a0000}.note{font-size:9pt;color:#888;border-top:1px solid #eee;margin-top:14px;padding-top:8px}.sign{display:flex;gap:18px;margin-top:14px}.sign div{flex:1;font-size:10pt}</style></head><body>${h}</body></html>`;}
function dlWord(){const html=wrapDoc(DOC.last||$('dprev').innerHTML);const blob=new Blob(['﻿'+html],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(DOC.fname||'CASE_document')+'.doc';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ===== BRAND IMAGES + PPTX PROFILE ===== */
function imgBox(b,field,label){const can=R().edit;const inner=b[field]?`<img src="${b[field]}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`:`<span style="color:#bbb;font-size:10.5px;text-align:center;line-height:1.3">${label}${can?'<br>+ загрузить':''}</span>`;return `<div onclick="${can?`uploadImg('${b.id}','${field}')`:''}" style="flex:1;height:80px;border:1px dashed #cfc9c1;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:${can?'pointer':'default'}">${inner}</div>`;}
function uploadImg(id,field){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const b=BRANDS.find(x=>x.id===id);b[field]=r.result;b.editedBy=S.user.name;b.editedAt=iso(TODAY);(b.hist=b.hist||[]).push([iso(TODAY),S.user.name,'Загружено изображение: '+field]);persist();openBrand(id);};r.readAsDataURL(f);};inp.click();}
function brandProfile(id){
 const b=BRANDS.find(x=>x.id===id);
 if(typeof PptxGenJS==='undefined'){alert('PPTX-библиотека не загрузилась (нужен интернет). Повторите позже.');return;}
 const RED='9E0000',DARK='1B1B1B',GREY='6B6B6B';

 const hdr=(s,right,pg)=>{s.background={color:'FFFFFF'};s.addText('CASE ADVISORY',{x:0.5,y:0.28,w:6,h:0.3,fontFace:'Montserrat',fontSize:12,bold:true,color:RED});s.addText(right,{x:5,y:0.28,w:7.83,h:0.3,align:'right',fontFace:'Montserrat',fontSize:11,color:GREY});s.addShape(p.ShapeType.line,{x:0.5,y:0.66,w:12.33,h:0,line:{color:RED,width:1.5}});s.addText('CASE Advisory  ·  Профиль ритейлера  ·  внутренний документ',{x:0.5,y:7.05,w:9,h:0.3,fontFace:'Montserrat',fontSize:9,color:GREY});s.addText(pg,{x:11.8,y:7.05,w:1,h:0.3,align:'right',fontFace:'Montserrat',fontSize:9,color:GREY});};
 let s=p.addSlide();hdr(s,'ПРОФИЛЬ РИТЕЙЛЕРА','1 / 2');
 if(b.logo)s.addImage({data:b.logo,x:0.5,y:0.95,w:1.4,h:1.4});
 else{s.addShape(p.ShapeType.roundRect,{x:0.5,y:0.95,w:1.4,h:1.4,fill:{color:'F0EEEC'},line:{color:'E0E0E0',width:1}});s.addText((b.name||'?').slice(0,2).toUpperCase(),{x:0.5,y:0.95,w:1.4,h:1.4,align:'center',valign:'middle',fontFace:'Montserrat',fontSize:28,bold:true,color:'AAAAAA'});}
 s.addText(b.name||'',{x:2.1,y:1.0,w:7,h:0.6,fontFace:'Montserrat',fontSize:28,bold:true,color:DARK});
 s.addText(b.about||b.notes||b.sub||'',{x:2.1,y:1.65,w:8.5,h:0.4,fontFace:'Montserrat',fontSize:12,color:GREY});
 s.addText((b.cat||'').toUpperCase()+'    ·    '+(b.country||''),{x:2.1,y:2.08,w:8.5,h:0.3,fontFace:'Montserrat',fontSize:11,bold:true,color:RED});
 if(b.site||b.ig)s.addText('Онлайн:  '+(b.site||'')+(b.ig?'   '+b.ig:''),{x:2.1,y:2.42,w:8.5,h:0.3,fontFace:'Montserrat',fontSize:10,color:GREY});
 s.addText('КЛЮЧЕВЫЕ ФАКТЫ',{x:0.5,y:3.05,w:5,h:0.3,fontFace:'Montserrat',fontSize:12,bold:true,color:RED});
 const facts=[['СТРАНА',b.country],['ГОД ОСНОВАНИЯ',b.founded],['ГРУППА / ХОЛДИНГ',b.group],['ЦЕНОВОЙ УРОВЕНЬ',b.price],['ФОРМАТ (ICSC)',b.icsc],['ТИПОВАЯ ПЛОЩАДЬ',(b.amin&&b.amax)?b.amin+'-'+b.amax+' м²':''],['СЕТЬ (МИР)',(b.netPts||'')+(b.netCountries?' · '+b.netCountries+' стран':'')],['В УЗБЕКИСТАНЕ',b.uzOp]];
 let fy=3.45;facts.forEach(f=>{s.addText(f[0],{x:0.5,y:fy,w:3.4,h:0.24,fontFace:'Montserrat',fontSize:8.5,color:GREY});s.addText(((f[1]||'').toString()||'уточнить'),{x:0.5,y:fy+0.2,w:3.6,h:0.28,fontFace:'Montserrat',fontSize:11,bold:true,color:DARK});fy+=0.46;});
 s.addText('О БРЕНДЕ',{x:4.4,y:3.05,w:4,h:0.3,fontFace:'Montserrat',fontSize:12,bold:true,color:RED});
 s.addText(b.about||b.notes||'-',{x:4.4,y:3.45,w:3.9,h:1.9,fontFace:'Montserrat',fontSize:11,color:DARK,valign:'top'});
 const imgB=(field,label,x)=>{if(b[field])s.addImage({data:b[field],x:x,y:3.45,w:2.15,h:1.7});else{s.addShape(p.ShapeType.roundRect,{x:x,y:3.45,w:2.15,h:1.7,fill:{color:'FBFAF8'},line:{color:'CFC9C1',width:1,dashType:'dash'}});s.addText(label+' · фото',{x:x,y:3.45,w:2.15,h:1.7,align:'center',valign:'middle',fontFace:'Montserrat',fontSize:10,color:'BBBBBB'});}s.addText(label,{x:x,y:5.2,w:2.15,h:0.25,align:'center',fontFace:'Montserrat',fontSize:9,bold:true,color:GREY});};
 imgB('shopfront','ВИТРИНА',8.55);imgB('interior','ИНТЕРЬЕР',10.8);
 let s2=p.addSlide();hdr(s2,'ВЗГЛЯД CASE: РИТЕЙЛ И АРЕНДА','2 / 2');
 const secs=[['Позиционирование и аудитория',b.pos||('Сегмент '+(b.price||'уточнить')+'. Аудитория - уточнить.')],['Концепция и ассортимент',b.concept||(b.sub||'-')],['Формат и площадь (ICSC)',(b.icsc||'-')+'; в базе '+((b.amin&&b.amax)?b.amin+'-'+b.amax+' м²':'-')+'. Требования: '+(b.reqs||'-')+'.'],['Сеть и развитие',(b.netPts||'-')+' точек, '+(b.netCountries||'-')+' стран. Модель: '+(b.fr||'-')+'.'],['Присутствие в Узбекистане',b.uzOp?('Оператор '+b.uzOp+' (по базе CASE). Кол-во точек - уточнить.'):'Уточнить.'],['Рекомендация CASE  [ДОПУЩЕНИЕ]',b.rec||'Оценить как драйвер трафика и dwell-time; контроль turnover-rent; подтвердить готовность франчайзи.']];
 let y=1.0;secs.forEach(sec=>{s2.addText('◆ '+sec[0],{x:0.5,y:y,w:12.3,h:0.3,fontFace:'Montserrat',fontSize:12,bold:true,color:RED});s2.addText(sec[1],{x:0.8,y:y+0.32,w:12,h:0.6,fontFace:'Montserrat',fontSize:11,color:DARK,valign:'top'});y+=0.97;});
 s2.addText('Источники: открытые данные бренда; база CASE Brands.',{x:0.5,y:6.75,w:9,h:0.3,fontFace:'Montserrat',fontSize:8.5,italic:true,color:GREY});
 p.writeFile({fileName:'Профиль ритейлера - '+(b.name||'brand')+' (CASE).pptx'});
}
